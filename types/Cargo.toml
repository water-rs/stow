[package]
name = "stow-types"
description = "Shared API and artifact-identity types for the stow artifact cache"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["artifact-cache", "cargo", "oci", "rustc"]
categories = ["caching", "development-tools::build-utils"]

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
blake3.workspace = true
hex.workspace = true
sha2 = "0.11"
tar = "0.4"
tracing.workspace = true
target-lexicon.workspace = true
shell-words = "1"
utoipa.workspace = true

# zstd-sys does not build for wasm32, and the only wasm consumer
# (stow-edge) serves index pages rather than encoding them — `index`'s
# encode/decode helpers are cfg-gated the same way.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zstd = "0.14"

[dev-dependencies]
serial_test = "4"
tempfile = "3"

[lints]
workspace = true
