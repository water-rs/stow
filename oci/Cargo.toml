[package]
name = "stow-oci"
description = "OCI registry push/pull/sign machinery shared by the stow CLI, stow-build and stow-admin"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["artifact-cache", "oci", "cosign"]
categories = ["caching", "development-tools::build-utils"]

[dependencies]
stow-types.workspace = true
stow-shim = { workspace = true, features = ["zstd"] }
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
smol = "2"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
fastrand = "2"
# The process-wide registry write bucket (`throttle::WriteBudget`): a
# lock-free GCRA limiter whose `until_ready` waits on `futures-timer`, so it
# runs on any executor. `std` is the only feature it needs.
governor = { version = "0.10.4", default-features = false, features = ["std"] }
# Canonical JSON for manifest bytes — the same formatter oci-client's own
# push uses, so digests match what it produced.
olpc-cjson = "0.1"
# `oci-client`'s `rustls-tls` default pins reqwest's `rustls` feature, which
# selects `aws-lc-rs` as the rustls CryptoProvider. `zenwave` selects `ring`,
# and rustls panics when both providers are compiled in. `rustls-tls` gates no
# code in `oci-client` itself, so the TLS backend is supplied by reqwest's
# `rustls-no-provider` (provider resolved from the process-level default
# installed by the binary).
oci-client = { version = "0.17.0", default-features = false }
reqwest = { version = "0.13", default-features = false, features = [
    "rustls-no-provider",
] }
sigstore = { version = "0.14.0", default-features = false, features = ["cosign", "verify", "rustls-tls"] }
# The TUF-verified trust-root loader (stow#869): `sigstore` 0.14's own
# `sigstore-trust-root` feature pinned `tough` 0.22 to an expired embedded
# TUF root and reported transport failures as `root metadata is expired`.
# `rustls-no-provider` resolves the process-level provider the binaries
# install (ring); `aws-lc-rs` is the `sigstore-crypto` backend TUF metadata
# verification needs and is already in the lockfile.
sigstore-trust-root = { version = "0.15.0", default-features = false, features = [
    "tuf",
    "rustls-no-provider",
    "aws-lc-rs",
] }
base64 = "0.23"
hex.workspace = true
sha2 = "0.11"
rustls-pki-types = "1"
x509-cert = "0.2.5"
const-oid = { version = "0.10", features = ["db"] }
webpki = { package = "rustls-webpki", version = "0.103.8" }
async-fs = "2"
# The sigstore trust cache's default root — the platform cache
# directory, not `$HOME` (a Windows Actions runner has none, stow#1026).
dirs = "7"
# `RegistryHttp` builds the reqwest client on a blocking thread: the
# trust-store load is synchronous and must not run on an async worker.
tokio = { version = "1", features = ["rt"] }

[features]
mock-verify = []

[dev-dependencies]
# Env-mutating tests serialize against each other — `std::env` is
# process-global.
serial_test = "4"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt"] }
# The protobuf types `sigstore` 0.14's `SigstoreTrustRoot` parsed
# `trusted_root.json` into — the parity test replays the retired
# extraction over the same bytes (stow#869).
sigstore_protobuf_specs = "0.5"
# The registry client resolves its TLS provider from the process default;
# a test that builds one installs `ring` the way the binaries do.
rustls.workspace = true
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }

[lints]
workspace = true
