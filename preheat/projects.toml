# Showcase projects the preheat lanes seed as project-source tasks: one
# task per entry per CI target, resolved to an immutable commit at
# dispatch time. The trusted runner clones the repository and builds the
# workspace against the project's own Cargo.lock, so the captured
# artifacts carry the dependency c_metadata chain the project's consumers
# compute (the `preheat project` shape).
#
# To add a well-known project — a workspace whose dependency closure is
# worth keeping warm for everyone — append one `[[project]]` table:
#
#   [[project]]
#   repo = "https://github.com/<org>/<repo>"   # git URL the runner clones
#   ref_policy = "latest-tag"                  # or "default-branch"
#   manifest_path = "Cargo.toml"               # optional; this is the default
#
# `ref_policy` selects the commit pinned into the task: `latest-tag`
# resolves the newest tag whose name parses as semver (a leading `v` is
# allowed), `default-branch` resolves the remote's HEAD.
# `manifest_path` must point at a package manifest — the workspace-root
# facade crate, not a virtual workspace root — because the task is
# anchored on the package the consumer's own manifest resolves to.

[[project]]
repo = "https://github.com/water-rs/waterui"
ref_policy = "default-branch"
