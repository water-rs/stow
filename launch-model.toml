# Regenerated by `stow-admin launch-model export` — hand edits
# are lost. `stow-admin traffic-cost project`, `verdict` and `peak`
# read this file; every rate is events per active install per
# day in `window`, or a flat daily cadence where the lane does
# not scale with installs. `cadence` counts the stable rustc
# releases (minor and point) Rust published in the
# `period_days` before the window's end; each one invalidates
# the public cache and brings a full preheat wave, which the
# projection prices once per release.

[scale]
installs = 10000
peak_factor = 10.0
days_per_month = 30

[window]
days = 7
end = "2026-09-27"
install_days = 289

[cadence]
stable_releases = 14
period_days = 365

