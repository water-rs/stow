[workspace]
changelog_update = true
# No package gets a release-plz GitHub release; the libraries ship as
# crate versions and stow-cli's GitHub release is owned by cargo-dist.
git_release_enable = false

# release-plz still pushes each released crate's tag (git_tag_enable
# defaults to true). The main crate's tag is `v<version>`; it triggers the
# cargo-dist release workflow, toolchain-publish.yml and the edge deploy,
# and it is the release tag the production workflows and signing identities
# are scoped to. dist creates the GitHub Release itself and attaches the
# prebuilt binaries (https://axodotdev.github.io/cargo-dist/book/ — the
# "host" step runs `gh release create`, which would fail if release-plz had
# already made the release). Every other crate's tag is
# `<directory>/v<version>`, which no workflow triggers on.
[[package]]
name = "stow-cli"
publish = false
git_only = true
git_release_enable = false
git_tag_name = "v{{ version }}"
version_group = "stow"

[[package]]
name = "stow-oci"
git_tag_name = "oci/v{{ version }}"
version_group = "stow"

[[package]]
name = "stow-shim"
git_tag_name = "shim/v{{ version }}"
version_group = "stow"

[[package]]
name = "stow-types"
git_tag_name = "types/v{{ version }}"
version_group = "stow"

# Internal binaries shipped or deployed from `v<version>`: never published to
# crates.io or tagged separately, but grouped with `stow` so changes confined
# to the builder, edge, or admin CLI still bump `[workspace.package].version`
# in lockstep with `v<version>`.
[[package]]
name = "stow-build"
publish = false
git_only = true
git_tag_enable = false
git_tag_name = "v{{ version }}"
changelog_update = false
version_group = "stow"

[[package]]
name = "stow-edge"
publish = false
git_only = true
git_tag_enable = false
git_tag_name = "v{{ version }}"
changelog_update = false
version_group = "stow"

[[package]]
name = "stow-admin"
publish = false
git_only = true
git_tag_enable = false
git_tag_name = "v{{ version }}"
changelog_update = false
version_group = "stow"

# Non-release workspace crates.
[[package]]
name = "stow-mock-registry"
release = false
publish = false

[[package]]
name = "stow-site"
release = false
publish = false

[[package]]
name = "stow-resolver"
release = false
publish = false
