[package]
name = "stow-shim"
description = "Cross-crate helpers for stow: rustc-wrapper shim materialization, shared SQL schema, and zstd defaults"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["artifact-cache", "cargo", "rustc-wrapper"]
categories = ["caching", "development-tools::build-utils"]

[dependencies]
stow-types.workspace = true
# `zstdmt` is the multithreaded compressor every bundle and index slice
# is written with.
zstd = { version = "0.14", optional = true, default-features = false, features = ["zstdmt"] }
tar = { workspace = true, optional = true }
sha2 = { version = "0.11", optional = true }
hex = { workspace = true, optional = true }

# `dirs` backs `tools_dir()`, which lives in the wrapper module that is only
# compiled for native targets — `stow-edge` builds this crate for
# wasm32-unknown-unknown where `dirs` has no platform support.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = "7"

[target.'cfg(windows)'.dependencies]
# is_same_file: hard-linked wrapper shims skip the byte-for-byte
# comparison against the runtime executable.
same-file = "1"

[features]
default = []
# Enables the zstd constants and the `pack` module (the bundle format and
# the index compressor). Off by default because zstd-sys doesn't build for
# `wasm32-unknown-unknown` (the edge worker target).
zstd = ["dep:zstd", "dep:tar", "dep:sha2", "dep:hex"]
