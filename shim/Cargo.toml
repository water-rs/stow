[package]
name = "stow-shim"
description = "Cross-crate helpers for stow: rustc-wrapper shim materialization, shared SQL schema, and zstd defaults"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["artifact-cache", "cargo", "rustc-wrapper"]
categories = ["caching", "development-tools::build-utils"]

[dependencies]
stow-types.workspace = true
zstd = { version = "0.14", optional = true }

# `dirs` backs `tools_dir()`, which lives in the wrapper module that is only
# compiled for native targets — `stow-edge` builds this crate for
# wasm32-unknown-unknown where `dirs` has no platform support.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = "7"

[features]
default = []
# Enables `STOW_ZSTD_COMPRESSION_LEVEL` and any zstd-related helpers. Off by
# default because zstd-sys doesn't build for `wasm32-unknown-unknown` (the
# edge worker target).
zstd = ["dep:zstd"]

[lints]
workspace = true
