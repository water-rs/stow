[package]
name = "stow-mock-registry"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "stow-mock-registry"
path = "src/main.rs"

[dependencies]
stow-types.workspace = true
blake3.workspace = true
stow-shim = { workspace = true, features = ["zstd"] }
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
async-fs = "2"
smol = "2"
base64 = "0.23"
clap = { version = "4.5", features = ["derive"] }
axum = "0.8"
sha2 = "0.11"
rsa = "0.9"
sigstore = { version = "0.14.0", default-features = false, features = ["cosign", "verify", "rustls-tls"] }
rustls.workspace = true
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3"
# The keyless-signing tests' mock Sigstore: a Fulcio issuing under a
# throwaway CA, a Rekor signing canonical entry timestamps, and the
# concurrent sweep they publish.
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
olpc-cjson = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
tower = { version = "0.5", features = ["util"] }
stow-oci = { workspace = true, features = ["mock-verify"] }
# The fixture example serializes QueueSelector task-id lists into the
# same `task_ids=…&task_ids=…` wire encoding the admin queue route reads.
serde_html_form = "0.4"
