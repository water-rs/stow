[package]
name = "stow-build"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
stow-types.workspace = true
stow-shim = { workspace = true, features = ["zstd"] }
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
async-fs = "2"
async-process = "2"
smol = "2"
tempfile = "3"
cargo_metadata = "0.19"
clap = { version = "4.5", features = ["derive"] }
futures-lite = "2"
sha2 = "0.10"
hex.workspace = true
semver.workspace = true
zenwave.workspace = true
# `oci-client`'s `rustls-tls` default pins reqwest's `rustls` feature, which
# selects `aws-lc-rs` as the rustls CryptoProvider. `zenwave` selects `ring`,
# and rustls panics when both providers are compiled in. `rustls-tls` gates no
# code in `oci-client` itself, so the TLS backend is supplied by reqwest's
# `rustls-no-provider` (provider resolved from the process-level default
# installed in `main`).
oci-client = { version = "0.16.1", default-features = false }
reqwest = { version = "0.13", default-features = false, features = [
    "rustls-no-provider",
] }
rustls.workspace = true
blake3.workspace = true
fs2 = "0.4"
reflink = "0.1.3"
walkdir = "2"
zstd = "0.13"
flate2 = "1.0"
tar = "0.4"
skyzen = { version = "0.3.0", default-features = false, features = ["json", "hyper"] }
heel = { version = "0.3", default-features = false }
utoipa.workspace = true
executor-core = { version = "0.7", features = ["tokio"] }
tokio = { version = "1", features = ["io-std", "macros", "net", "rt-multi-thread"] }
async-net = "2"

[lints]
workspace = true
