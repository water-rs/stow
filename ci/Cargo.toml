[package]
name = "stow-build"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Passes the CLI's local mock verification through to the build job's cache
# consumption. The consumption path is the CLI's verified-download chain, so
# without this the mock end-to-end lane's builder refuses the mock key and
# consumption silently does nothing — the lane would cover every stage of
# the pipeline except the one it was extended to cover.
mock-verify = ["stow-cli/mock-verify"]
# The `Preheat cost` lane's compiler (stow#773): with
# `STOW_BUILD_MOCK_COMPILE=1` the capture wrapper writes each unit's
# outputs empty instead of running rustc, so a whole preheat wave drives
# the real build, scan, plan, publish and completion stages at the cost
# of none of the compilation. Never enabled in a production build.
mock-compile = []

[dependencies]
stow-types.workspace = true
stow-oci.workspace = true
stow-cli.workspace = true
stow-shim = { workspace = true, features = ["zstd"] }
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
async-fs = "2"
async-process = "2"
smol = "2"
tempfile = "3"
cargo_metadata = "0.23"
clap = { version = "4.5", features = ["derive"] }
futures-lite = "2"
futures-util = "0.3"
sha2 = "0.11"
hmac = "0.13"
hex.workspace = true
semver.workspace = true
zenwave.workspace = true
rustls.workspace = true
blake3.workspace = true
fs2 = "0.4"
reflink-copy = { version = "0.1.30", default-features = false }
walkdir = "2"
flate2.workspace = true
tar.workspace = true
skyzen = { version = "0.5.0", default-features = false, features = ["json", "hyper", "query"] }
heel = { version = "0.7.0", default-features = false }
utoipa.workspace = true
executor-core = { version = "0.7", features = ["tokio"] }
tokio = { version = "1", features = ["io-std", "macros", "net", "rt-multi-thread", "sync"] }
# Run-record timestamps, serialized as GitHub spells them.
time = { version = "0.3", default-features = false, features = ["std", "serde-well-known"] }
async-net = "2"
# The machine check on every object the plan stage packs — objects and
# archive members only, never image parsing (`read` covers COFF, ELF,
# Mach-O, PE, XCOFF and Unix archives; `wasm` would pull wasmparser for a
# format the check passes through unchecked anyway).
object = { version = "0.39", default-features = false, features = ["read", "std"] }

# `fclonefileat`, so a handle-based output copy clones on APFS.
[target.'cfg(target_os = "macos")'.dependencies]
libc = { version = "0.2.189", default-features = false }

# The MSVC lookup rustc performs for itself — run out here on the host,
# because it cannot run inside the sandbox. Maintained by the `cc`
# maintainers, which is where `cc::windows_registry` now lives.
[target.'cfg(windows)'.dependencies]
find-msvc-tools = "0.1.9"

[dev-dependencies]
url = "2"
stow-resolver.workspace = true
http = "1"
# Test fixtures write minimal objects through `object::write`; cargo
# unifies this with the dependency's `read`/`std` for test builds.
object = { version = "0.39", default-features = false, features = ["write"] }

[lints]
workspace = true
