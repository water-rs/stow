[package]
name = "stow-build"
version = "0.1.0"
edition = "2024"

[dependencies]
stow-types.workspace = true
stow-shim = { workspace = true, features = ["zstd"] }
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
async-fs = "2"
async-process = "2"
smol = "2"
tempfile = "3"
cargo_metadata = "0.19"
futures-lite = "2"
sha2 = "0.10"
hex.workspace = true
semver.workspace = true
zenwave.workspace = true
oci-client = "0.16.1"
blake3.workspace = true
fs2 = "0.4"
reflink = "0.1.3"
walkdir = "2"
zstd = "0.13"
flate2 = "1.0"
tar = "0.4"
skyzen = { path = "../../skyzen", default-features = false, features = ["json", "hyper"] }
executor-core = { version = "0.7", features = ["tokio"] }
tokio = { version = "1", features = ["io-std", "macros", "net", "rt-multi-thread"] }
async-net = "2"

[lints]
workspace = true
