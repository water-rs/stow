[package]
name = "stow-build"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
stow-types.workspace = true
stow-oci.workspace = true
stow-cli.workspace = true
stow-shim = { workspace = true, features = ["zstd"] }
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
async-fs = "2"
async-process = "2"
smol = "2"
tempfile = "3"
cargo_metadata = "0.23"
clap = { version = "4.5", features = ["derive"] }
futures-lite = "2"
sha2 = "0.11"
hex.workspace = true
semver.workspace = true
zenwave.workspace = true
rustls.workspace = true
blake3.workspace = true
fs2 = "0.4"
reflink = "0.1.3"
walkdir = "2"
flate2.workspace = true
tar.workspace = true
skyzen = { version = "0.3.0", default-features = false, features = ["json", "hyper"] }
heel = { version = "0.3", default-features = false }
utoipa.workspace = true
executor-core = { version = "0.7", features = ["tokio"] }
tokio = { version = "1", features = ["io-std", "macros", "net", "rt-multi-thread"] }
async-net = "2"

# The MSVC lookup rustc performs for itself — run out here on the host,
# because it cannot run inside the sandbox. Maintained by the `cc`
# maintainers, which is where `cc::windows_registry` now lives.
[target.'cfg(windows)'.dependencies]
find-msvc-tools = "0.1.9"

[lints]
workspace = true
