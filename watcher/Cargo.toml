[package]
name = "stow-watcher"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "s"
strip = true
lto = true
codegen-units = 1

[dependencies]
skyzen = { path = "../../skyzen", default-features = false, features = ["rt"] }
skyzen-cloudflare = { path = "../../skyzen/cloudflare" }
skyzen-services = { path = "../../skyzen/services" }
stow-types = { path = "../types" }
zenwave.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
toml = "0.8"
