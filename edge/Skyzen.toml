[cloudflare]
name = "stow-edge"
main = "stable-worker.js"
compatibility_date = "2026-07-15"
workers_dev = false

[cloudflare.vars]
GITHUB_APP_ID = "4985635"
GITHUB_APP_INSTALLATION_ID = "162649982"
# The App's slug — its bot login (`<slug>[bot]`) is the
# `triggering_actor` a scheduler-dispatched run carries, which is how
# the webhook tells own runs from external ones (stow#940). A wrong
# value only re-adds own runs' `in_progress` forwards — the cost, not
# a correctness break.
GITHUB_APP_SLUG = "stow-ci"
GITHUB_REPO = "water-rs/stow"
GHCR_BASE_URL = "https://ghcr.io"
STOW_DISPATCH_MIN_AGE_MINUTES = "5"
# Dispatch ceilings against the org's 60 GitHub-hosted runners (15 of them
# macOS): 45 total leaves 15 runners for the repo's own CI, and the macOS
# cap keeps a full wave from queueing on the smallest pool while leaving
# 4 macOS runners free. They bound in-flight work until an operator's
# `stow-admin dispatch-cap set` replaces them.
STOW_MAX_CONCURRENT_JOBS = "45"
STOW_MAX_CONCURRENT_MACOS_JOBS = "11"
STOW_STALE_DISPATCH_MINUTES = "60"
# Enqueue-admission scaling: one extra proof-of-work bit per 50 pending
# tasks, floored at STOW_POW_MIN_BITS and capped at 24 bits.
# Floor on enqueue proof-of-work difficulty: an enqueue is never free,
# even on an empty queue.
STOW_POW_MIN_BITS = "12"
# Pending-queue depth at which the miss lane starts refusing enqueues
# with 429 + Retry-After: 600. Checked in the edge handler and again in
# the scheduler Durable Object; human-lane and trusted submits are exempt.
STOW_MAX_QUEUE_PENDING = "2000"
# Largest dependency closure POST /api/v1/requests accepts; bigger
# closures are refused with 422.
STOW_HUMAN_MAX_CLOSURE = "150"
# Human-lane tasks the scheduler accepts per UTC day; the Durable Object
# keeps the counter and refuses overspending submits with 429.
STOW_HUMAN_DAILY_TASK_BUDGET = "2000"
# Admission floor on a pending row's dispatch score (queue.value): a
# miss-lane row claims only while its score reaches the bound —
# under-floor work stays queued and visible in `queue list` instead of
# being built. The human lane is exempt by contract. Decimal text: the
# floor can exceed the JS-safe integer range, and the DO parses it as a
# typed i64 when its settings initialize — overflow or a negative value
# fails then, not a clamp. The operator reset (`stow-admin scheduler
# reset --yes`) stamps the configured value into the queue's
# `settings.min_dispatch_value` row that every writer's eligibility
# expression reads — changing this binding changes nothing until that
# pass runs. Unset means "0", admit everything.
# STOW_MIN_DISPATCH_VALUE = "0"
# Public Turnstile site key (invisible widget) rendered by the request page
# on stow.waterui.dev; the matching secret is a Worker secret below.
TURNSTILE_SITE_KEY = "0x4AAAAAAE8LjhnMsqdVhiSp"
# Hostname the widget is registered for; a token whose siteverify report
# names any other host is rejected.
TURNSTILE_HOSTNAME = "stow.waterui.dev"
# Audience the trusted CI requests when it mints its GitHub Actions OIDC
# token; the edge rejects OIDC credentials carrying any other `aud`.
STOW_OIDC_AUDIENCE = "https://stow.waterui.dev"
# Account id the Analytics Engine SQL API is queried under — powers
# GET /api/v1/stats.
CF_ACCOUNT_ID = "76e9b86d5be8efabd346f9b2c4da0d41"
# Dispatch-freeze trip condition: a stream (the fleet aggregate, or any
# single target) must record at least STOW_FREEZE_MIN_OUTCOMES terminal
# outcomes inside the trailing STOW_FREEZE_WINDOW_MINUTES AND reach
# STOW_FREEZE_FAIL_PERCENT percent failures — both, never either alone.
# The motivating incident (#431) failed ~120 outcomes/hour on each
# Windows leg, so 50 outcomes at 50% inside an hour trips it well
# before the runner allowance is gone; a queue too quiet to reach the
# sample cannot be burning the allowance either.
STOW_FREEZE_WINDOW_MINUTES = "60"
STOW_FREEZE_MIN_OUTCOMES = "50"
STOW_FREEZE_FAIL_PERCENT = "50"
# Freeze-transition alerts: the email sender must live on a domain
# onboarded under Compute → Email Service → Email Sending
# (E_SENDER_NOT_VERIFIED otherwise); the recipient is whoever owns
# runner-allowance incidents. The send_email binding itself is declared
# under cloudflare.raw below — mock/local manifests deliberately omit
# it so they can never reach Cloudflare's sending API. The `incident`
# issue record is the watchdog's (#450), which reads the freeze state
# off `stow-admin dispatch-freeze status` — the edge's App token has no
# `issues` grant, deliberately.
STOW_ALERT_FROM = "alerts@stow.waterui.dev"
STOW_ALERT_TO = "me@lexo.cool"
# Scales the scheduler DO's per-day SQL budget (80% of the monthly included
# allowance / 30 — the stow#883 line's daily share): the object self-meters rowsRead/rowsWritten off its
# own cursors and freezes dispatch the moment a day crosses budget —
# no scheduled probe, so nothing here costs while idle. Lower it to
# trip earlier on a shared account.
STOW_COST_BUDGET_MULTIPLIER = "1.0"
# Periodic workflows (stow#1100, stow#1121): GitHub's `schedule` trigger
# skipped most ticks, so the Worker's Cron Trigger dispatches them through
# the App, on `main` unless an entry says `{"workflow": ..., "ref": "dev"}`.
# This JSON object maps each cron expression of `[cloudflare.triggers]
# crons` below to the workflow entries due when it fires; a tick whose cron
# is missing here fails and is mailed. Retuning a cadence edits the cron in
# both places, and `admin/tests/periodic_schedule.rs` pins the two sets
# equal. UTC.
STOW_PERIODIC_WORKFLOWS = '{"*/15 * * * *": ["watchdog.yml"], "17 0 * * *": ["preheat-cron.yml"], "*/10 * * * *": [{"workflow": "index-publish-cron.yml", "ref": "dev"}], "5 * * * *": ["demand-feed.yml"], "0 13 * * *": [{"workflow": "build-failure-digest.yml", "ref": "dev"}], "0 7 * * *": [{"workflow": "test.yml", "ref": "dev"}], "30 5 * * 1": [{"workflow": "preheat-projects.yml", "ref": "dev"}], "0 6 * * 1": ["preheat-missed.yml"]}'

[cloudflare.triggers]
crons = ["*/15 * * * *", "17 0 * * *", "*/10 * * * *", "5 * * * *", "0 13 * * *", "0 7 * * *", "30 5 * * 1", "0 6 * * 1"]


[[cloudflare.durable_objects.bindings]]
name = "SCHEDULER"
class_name = "Scheduler"

[[cloudflare.durable_objects.migrations]]
tag = "v1"
new_sqlite_classes = ["Scheduler"]

# Declared so `skyzen secret set <NAME>` accepts them and `skyzen deploy`
# resolves them from the environment; values are never stored here.
[[secret]]
name = "GITHUB_APP_PRIVATE_KEY"

[[secret]]
name = "STOW_POW_CHALLENGE_SECRET"

# HMAC secret verifying GitHub's workflow_run webhook deliveries to
# /api/v1/github/workflow-run — the scheduler's completion channel.
[[secret]]
name = "STOW_GITHUB_WEBHOOK_SECRET"

# HMAC secret verifying newreleases.io deliveries to
# /api/v1/newreleases/release — the new-stable-release wake for preheat.
[[secret]]
name = "STOW_NEWRELEASES_WEBHOOK_SECRET"

[[secret]]
name = "TURNSTILE_SECRET_KEY"


# Daily-salted install-hash key for the usage-statistics indexes.
[[secret]]
name = "STOW_STATS_SALT_SECRET"

# API token with Analytics Engine read on the account — queried by
# /api/v1/stats for the public usage page.
[[secret]]
name = "CF_ANALYTICS_TOKEN"

# Workers Custom Domain — the schema models only `route`/`zone_id`, and this
# deployment keys the zone by name.
[cloudflare.raw]
routes = [{ pattern = "stow.waterui.dev", custom_domain = true, zone_name = "waterui.dev" }]

# Cache-miss events go to Analytics Engine; the dataset is created
# implicitly by the first writeDataPoint.
[[cloudflare.raw.analytics_engine_datasets]]
binding = "STOW_ANALYTICS"
dataset = "stow_cache_misses"

# Usage statistics — byte-path hit points (edge-observed undercount by
# design) and the CLI's per-day build reports. The index is a
# daily-salted install hash, never an IP.
[[cloudflare.raw.analytics_engine_datasets]]
binding = "STOW_STATS"
dataset = "stow_events"

# Workers Cache — the platform cache that answers cacheable GETs before
# this Worker runs. A hit is still billed as a Workers request; what it
# saves is the Worker running — the CPU time and subrequests a miss
# would spend. Cacheability is the response's own
# Cache-Control: the digest-addressed byte paths emit `public,
# max-age=31536000, immutable`, the catalog and stats endpoints short
# max-ages, and the point-in-time lanes and every error answer
# `no-store` (errors without one get heuristic freshness — a 404 would
# be held for minutes). Entries key on the Worker version, so a deploy
# never replays an older deploy's answers
# (developers.cloudflare.com/workers/cache/configuration/; Wrangler
# >=4.69 — the deploy workflow installs wrangler@4).
[cloudflare.raw.cache]
enabled = true


# Paid plan defaults subrequests to 10k/invocation, which a cold-closure
# analysis can exceed — every uncached entry costs a sparse-index fetch
# plus scheduler service calls, and `max_expanded_tasks` is 4096. 100k gives headroom
# while staying a hard per-invocation fuse. cpu_ms drops from the paid
# default (30s) to 15s — the billed meter — so a runaway request is
# cut off sooner. Skyzen has no first-class limits section, so both keys
# ride the `cloudflare.raw` passthrough into the generated wrangler.toml.
[cloudflare.raw.limits]
subrequests = 100000
cpu_ms = 15000

# Freeze-transition alert transport — Email Service Email Sending (public
# beta). `remote = true` makes the binding callable over the Email Service
# API. Declared only here: the mock/local manifests deliberately omit it
# so they can never reach Cloudflare's sending API — their alert path
# resolves to `Disabled`. `allowed_destination_addresses` pins sends to
# the one operator even though the onboarded sender domain would let the
# binding mail anyone — an alerting path able to mail arbitrary addresses
# is a worse bug than a missed alert.
[[cloudflare.raw.send_email]]
name = "STOW_ALERT_EMAIL"
remote = true
allowed_destination_addresses = ["me@lexo.cool"]

# Workers Logs — a systematic failure that 500s must leave a searchable
# record, not exist only on a live tail. The wrangler keys are
# `[observability] enabled`/`head_sampling_rate` plus
# `[observability.logs] enabled`/`head_sampling_rate`/`invocation_logs`
# (all sampled at 1 — the failure signal must not thin out under load).
# Workers Paid includes 20M log events/month at 7-day retention, then
# $0.60 per additional million (developers.cloudflare.com/workers/
# observability/logs/workers-logs + /workers/platform/pricing).
[cloudflare.raw.observability]
enabled = true
head_sampling_rate = 1
[cloudflare.raw.observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true