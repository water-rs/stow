[cloudflare]
name = "stow-edge"
main = "stable-worker.js"
compatibility_date = "2026-07-15"
workers_dev = false

[cloudflare.vars]
GITHUB_APP_ID = "4985635"
GITHUB_APP_INSTALLATION_ID = "162649982"
GITHUB_REPO = "water-rs/stow"
GHCR_BASE_URL = "https://ghcr.io/v2/water-rs/stow-cache"
STOW_DISPATCH_MIN_AGE_MINUTES = "5"
STOW_MAX_CONCURRENT_JOBS = "10"
STOW_STALE_DISPATCH_MINUTES = "60"
# Enqueue-admission scaling: one extra proof-of-work bit per 50 pending
# tasks, capped at 24 bits.
STOW_POW_DEPTH_PER_BIT = "50"
# Public Turnstile site key (invisible widget) rendered by the request page
# on stow.waterui.dev; the matching secret is a Worker secret below.
TURNSTILE_SITE_KEY = "0x4AAAAAAE8LjhnMsqdVhiSp"
# Hostname the widget is registered for; a token whose siteverify report
# names any other host is rejected.
TURNSTILE_HOSTNAME = "stow.waterui.dev"
# Audience the trusted CI requests when it mints its GitHub Actions OIDC
# token; the edge rejects OIDC credentials carrying any other `aud`.
STOW_OIDC_AUDIENCE = "https://stow.waterui.dev"

[[cloudflare.d1_databases]]
binding = "STOW_DB"
database_name = "stow-prod"
database_id = "b2fefa0a-828a-4681-b6f1-4d491d5dff5e"

[[cloudflare.durable_objects.bindings]]
name = "SCHEDULER"
class_name = "Scheduler"

[[cloudflare.durable_objects.migrations]]
tag = "v1"
new_sqlite_classes = ["Scheduler"]

# Declared so `skyzen secret set <NAME>` accepts them and `skyzen deploy`
# resolves them from the environment; values are never stored here.
[[secret]]
name = "GITHUB_APP_PRIVATE_KEY"

[[secret]]
name = "STOW_POW_CHALLENGE_SECRET"

[[secret]]
name = "TURNSTILE_SECRET_KEY"

# Workers Custom Domain — the schema models only `route`/`zone_id`, and this
# deployment keys the zone by name.
[cloudflare.raw]
routes = [{ pattern = "stow.waterui.dev", custom_domain = true, zone_name = "waterui.dev" }]

# Cache-miss events go to Analytics Engine instead of a D1 append log; the
# dataset is created implicitly by the first writeDataPoint.
[[cloudflare.raw.analytics_engine_datasets]]
binding = "STOW_ANALYTICS"
dataset = "stow_cache_misses"

# Paid plan defaults subrequests to 10k/invocation, which a cold-closure
# analysis can exceed — every uncached entry costs a sparse-index fetch plus
# D1 service calls, and `max_expanded_tasks` is 4096. 100k gives headroom
# while staying a hard per-invocation fuse; cpu_ms stays at the paid default
# (30s), which is the billed meter.
[cloudflare.raw.limits]
subrequests = 100000
