[cloudflare]
name = "stow-edge"
main = "stable-worker.js"
compatibility_date = "2026-07-15"
workers_dev = false

[cloudflare.vars]
GITHUB_APP_ID = "4985635"
GITHUB_APP_INSTALLATION_ID = "162649982"
GITHUB_REPO = "water-rs/stow"
GHCR_BASE_URL = "https://ghcr.io/v2/water-rs/stow-cache"
STOW_DISPATCH_MIN_AGE_MINUTES = "5"
# Dispatch ceilings against the org's 60 GitHub-hosted runners (20 of them
# macOS): 45 total leaves 15 runners for the repo's own CI, and the macOS
# cap keeps a full wave from queueing on the smallest pool while leaving
# 4 macOS runners free.
STOW_MAX_CONCURRENT_JOBS = "45"
STOW_MAX_CONCURRENT_MACOS_JOBS = "16"
STOW_STALE_DISPATCH_MINUTES = "60"
# Enqueue-admission scaling: one extra proof-of-work bit per 50 pending
# tasks, floored at STOW_POW_MIN_BITS and capped at 24 bits.
# Floor on enqueue proof-of-work difficulty: an enqueue is never free,
# even on an empty queue.
STOW_POW_MIN_BITS = "12"
# Pending-queue depth at which the miss lane starts refusing enqueues
# with 429 + Retry-After: 600. Checked in the edge handler and again in
# the scheduler Durable Object; human-lane and trusted submits are exempt.
STOW_MAX_QUEUE_PENDING = "2000"
# Largest dependency closure POST /api/v1/requests accepts; bigger
# closures are refused with 422.
STOW_HUMAN_MAX_CLOSURE = "150"
# Human-lane tasks the scheduler accepts per UTC day; the Durable Object
# keeps the counter and refuses overspending submits with 429.
STOW_HUMAN_DAILY_TASK_BUDGET = "2000"
# Public Turnstile site key (invisible widget) rendered by the request page
# on stow.waterui.dev; the matching secret is a Worker secret below.
TURNSTILE_SITE_KEY = "0x4AAAAAAE8LjhnMsqdVhiSp"
# Hostname the widget is registered for; a token whose siteverify report
# names any other host is rejected.
TURNSTILE_HOSTNAME = "stow.waterui.dev"
# Audience the trusted CI requests when it mints its GitHub Actions OIDC
# token; the edge rejects OIDC credentials carrying any other `aud`.
STOW_OIDC_AUDIENCE = "https://stow.waterui.dev"
# Account id the Analytics Engine SQL API is queried under — powers
# GET /api/v1/stats.
CF_ACCOUNT_ID = "76e9b86d5be8efabd346f9b2c4da0d41"

[[cloudflare.d1_databases]]
binding = "STOW_DB"
database_name = "stow-prod"
database_id = "b2fefa0a-828a-4681-b6f1-4d491d5dff5e"

# `wrangler d1 migrations apply` reads `migrations_dir` relative to the
# config file, which skyzen generates into `edge/.skyzen/gen/`, so the
# default `migrations/` would resolve next to the generated file instead of
# to `edge/migrations`. Skyzen models no `migrations_dir` on a D1 database
# (`CfD1Database` denies unknown fields), so the whole entry is restated
# here: `[cloudflare.raw]` replaces the rendered `d1_databases` array
# wholesale, and the three keys above must stay in sync with it.
[[cloudflare.raw.d1_databases]]
binding = "STOW_DB"
database_name = "stow-prod"
database_id = "b2fefa0a-828a-4681-b6f1-4d491d5dff5e"
migrations_dir = "../../migrations"

[[cloudflare.durable_objects.bindings]]
name = "SCHEDULER"
class_name = "Scheduler"

[[cloudflare.durable_objects.migrations]]
tag = "v1"
new_sqlite_classes = ["Scheduler"]

# Declared so `skyzen secret set <NAME>` accepts them and `skyzen deploy`
# resolves them from the environment; values are never stored here.
[[secret]]
name = "GITHUB_APP_PRIVATE_KEY"

[[secret]]
name = "STOW_POW_CHALLENGE_SECRET"

[[secret]]
name = "TURNSTILE_SECRET_KEY"

# Daily-salted install-hash key for the usage-statistics hit index.
[[secret]]
name = "STOW_STATS_SALT_SECRET"

# API token with Analytics Engine read on the account — queried by
# /api/v1/stats for the public usage page.
[[secret]]
name = "CF_ANALYTICS_TOKEN"

# Workers Custom Domain — the schema models only `route`/`zone_id`, and this
# deployment keys the zone by name.
[cloudflare.raw]
routes = [{ pattern = "stow.waterui.dev", custom_domain = true, zone_name = "waterui.dev" }]

# Cache-miss events go to Analytics Engine instead of a D1 append log; the
# dataset is created implicitly by the first writeDataPoint.
[[cloudflare.raw.analytics_engine_datasets]]
binding = "STOW_ANALYTICS"
dataset = "stow_cache_misses"

# Usage statistics — served-hit and opt-in share events. Hit points are
# sampled 1/10 and scaled by their stored weight at query time; the index
# is a daily-salted install hash, never an IP.
[[cloudflare.raw.analytics_engine_datasets]]
binding = "STOW_STATS"
dataset = "stow_events"

# Paid plan defaults subrequests to 10k/invocation, which a cold-closure
# analysis can exceed — every uncached entry costs a sparse-index fetch plus
# D1 service calls, and `max_expanded_tasks` is 4096. 100k gives headroom
# while staying a hard per-invocation fuse. cpu_ms drops from the paid
# default (30s) to 15s — the billed meter — so a runaway request is
# cut off sooner. Skyzen has no first-class limits section, so both keys
# ride the `cloudflare.raw` passthrough into the generated wrangler.toml.
[cloudflare.raw.limits]
subrequests = 100000
cpu_ms = 15000
