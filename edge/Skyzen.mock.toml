[cloudflare]
name = "stow-edge-mock"
main = "stable-worker.js"
compatibility_date = "2025-02-01"
workers_dev = false

[cloudflare.vars]
GHCR_BASE_URL = "http://127.0.0.1:28123"
GITHUB_REPO = "water-rs/stow"
# Mock value for the App's slug — the local CI stamps `<slug>[bot]` as
# `triggering_actor` on the runs it was dispatched, which is what the
# webhook's `in_progress` filter reads (stow#940).
GITHUB_APP_SLUG = "mock-stow-ci"
# The audience the mock OIDC issuer (`stow-mock-registry oidc-token`)
# signs — every mutating route takes only a workflow's OIDC token
# (stow#955), so the two must agree; a test in mock-registry pins it.
STOW_OIDC_AUDIENCE = "https://stow.waterui.dev"
STOW_LOCAL_CI_URL = "http://127.0.0.1:28124"
# The trusted lanes' bearer check probes GitHub for the operator
# credential's push access (`/user` plus the git-receive-pack
# advertisement) and fetches the OIDC issuer's key set
# (`/.well-known/jwks`) — the mock registry's stub answers all of them,
# the key set being its own mock issuer's, so the check never leaves the
# stack (stow#793, stow#955). Required whenever
# STOW_LOCAL_CI_URL is set: the edge fails startup without it rather
# than calling the real API.
STOW_GITHUB_API_URL = "http://127.0.0.1:28123"
STOW_DISPATCH_MIN_AGE_MINUTES = "0"
STOW_MAX_CONCURRENT_JOBS = "3"
# The mock's 3-job pool bounds concurrent task runs; every task is its
# own build-crate.yml run.
# The seeded fixture holds ~60k pending rows — the production-sized cap
# keeps the mock's untrusted enqueue lanes on the accept path (the load
# test drives real admissions and PoW redemptions and expects 200s, not
# QueueFull refusals).
STOW_MAX_QUEUE_PENDING = "100000"
# A week: the seeded fixture's in-flight rows carry `claimed_at`
# 30 minutes back and the cost drives run the real alarm against them —
# the lease must sit well above any drive's run time or stale recovery
# would reclaim fixture rows mid-measurement (stow#786).
STOW_STALE_DISPATCH_MINUTES = "10080"
# Unlock the scheduler Durable Object's budget probe (/budget, /budget/seed)
# — the workerd cost harness drives it via `stow-admin scheduler budget`.
# Never set on production deploys.
STOW_SCHEDULER_BUDGET = "1"
# The budget probe's seed pass writes millions of billed rows in one
# request — far over the daily self-meter budget — so the mock inflates
# `STOW_COST_BUDGET_MULTIPLIER` to keep the dispatch freeze from tripping
# on fixture writes. Production stays at the Skyzen.toml value.
STOW_COST_BUDGET_MULTIPLIER = "10000"
STOW_POW_CHALLENGE_SECRET = "mock-pow-challenge-secret"
STOW_GITHUB_WEBHOOK_SECRET = "mock-github-webhook-secret"
STOW_NEWRELEASES_WEBHOOK_SECRET = "mock-newreleases-webhook-secret"
# Cloudflare's documented always-pass Turnstile test pair: any token sent
# through the request API verifies in the mock deployment.
TURNSTILE_SITE_KEY = "1x00000000000000000000AA"
TURNSTILE_SECRET_KEY = "1x0000000000000000000000000000000AA"
# Cloudflare's test keys always report this hostname.
TURNSTILE_HOSTNAME = "example.com"
# The account id and token only have to be present: the public stats
# route queries the Analytics Engine SQL API through the override below,
# which the mock registry stubs.
CF_ACCOUNT_ID = "00000000000000000000000000000000"
CF_ANALYTICS_TOKEN = "mock-analytics-token"
STOW_STATS_SALT_SECRET = "mock-stats-salt"
# `stow-mock-registry serve` answers POST /analytics_engine/sql with one
# union row every stats_*.sql query decodes. Loopback-only by the same
# rule as STOW_LOCAL_CI_URL — the token rides in Authorization.
STOW_STATS_SQL_URL = "http://127.0.0.1:28123/analytics_engine/sql"


[[cloudflare.durable_objects.bindings]]
name = "SCHEDULER"
class_name = "Scheduler"

[[cloudflare.durable_objects.migrations]]
tag = "v1"
new_sqlite_classes = ["Scheduler"]

# Local miss analytics — workerd accepts writeDataPoint as a no-op.
[[cloudflare.raw.analytics_engine_datasets]]
binding = "STOW_ANALYTICS"
dataset = "stow_cache_misses"

[[cloudflare.raw.analytics_engine_datasets]]
binding = "STOW_STATS"
dataset = "stow_events"