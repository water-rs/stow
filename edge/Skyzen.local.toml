[cloudflare]
name = "stow-edge-local"
main = "stable-worker.js"
compatibility_date = "2025-02-01"
workers_dev = false

[cloudflare.vars]
GITHUB_APP_ID = "4985635"
GITHUB_APP_INSTALLATION_ID = "162649982"
GITHUB_REPO = "water-rs/stow"
# Any value works locally — trusted calls use the developer's GitHub
# user token; the audience pin only binds OIDC credentials.
STOW_OIDC_AUDIENCE = "https://stow.waterui.dev"
STOW_POW_CHALLENGE_SECRET = "mock-pow-challenge-secret"
# Dispatch-freeze trip condition at production scale — this deployment
# really dispatches to GitHub, so a systematic breakage here really can
# burn the allowance and the trip thresholds matter as configured.
STOW_FREEZE_WINDOW_MINUTES = "60"
STOW_FREEZE_MIN_OUTCOMES = "50"
STOW_FREEZE_FAIL_PERCENT = "50"
# The freeze-transition alert is a no-op here: no send_email binding is
# declared in this manifest, so the alert path resolves to `Disabled`
# and can never reach Cloudflare's sending API even though this
# deployment can otherwise run for real. STOW_ALERT_* vars are
# deliberately unset — without the binding they are unused.

[[cloudflare.d1_databases]]
binding = "STOW_DB"
database_name = "stow-local"
database_id = "00000000-0000-0000-0000-000000000001"
preview_database_id = "00000000-0000-0000-0000-000000000001"

[[cloudflare.durable_objects.bindings]]
name = "SCHEDULER"
class_name = "Scheduler"

[[cloudflare.durable_objects.migrations]]
tag = "v1"
new_sqlite_classes = ["Scheduler"]

# Local dispatch still targets the real GitHub API (no STOW_LOCAL_CI_URL),
# so it mints an installation token from the same App bindings as
# production; the PEM comes from the environment at `skyzen dev`/`deploy`
# time and is never stored here.
[[secret]]
name = "GITHUB_APP_PRIVATE_KEY"
