[package]
name = "stow-edge"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
skyzen = { path = "../../skyzen", default-features = false, features = ["json", "form", "rt"] }
skyzen-cloudflare = { path = "../../skyzen/cloudflare" }
skyzen-services = { path = "../../skyzen/services" }
stow-types = { path = "../types" }
zenwave.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
semver.workspace = true
blake3.workspace = true
target-lexicon.workspace = true
oci-spec = "0.9.0"
tar = "0.4"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Request", "RequestInit", "Response", "ResponseInit", "Headers", "Url"] }
serde-wasm-bindgen = "0.6"
cargo-platform = "0.1.9"
futures-util = "0.3"
