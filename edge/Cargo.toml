[package]
name = "stow-edge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
skyzen = { version = "0.4.3", default-features = false, features = ["json", "query"] }
skyzen-core = "0.2"
skyzen-cloudflare = "0.4.3"
skyzen-services = { version = "0.2.1", default-features = false }
stow-types.workspace = true
stow-shim.workspace = true
http = "1"
anyhow = "1"
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
# Query-string serialization for the scheduler client's admin filter —
# the same crate skyzen's `query` feature parses with.
serde_html_form = "0.4"
tracing.workspace = true
semver.workspace = true
blake3.workspace = true
askama = "0.14"
# The wasm-bindgen family is exact-coupled (`js-sys =0.3.x` requires
# `wasm-bindgen =0.2.y` of the same release), and `skyzen dev`/`skyzen build`
# repackage the worker with the wasm-bindgen generator embedded in
# skyzen-cli 0.4.2, which ships `=0.2.120` (see CONTRIBUTING.md). All four are
# pinned to that release line so `cargo update` cannot drift them.
wasm-bindgen = "=0.2.120"
wasm-bindgen-futures = "=0.4.70"
js-sys = "=0.3.97"
web-sys = { version = "=0.3.97", features = ["Crypto", "CryptoKey", "Headers", "Request", "RequestInit", "Response", "ResponseInit", "SubtleCrypto", "Url", "UrlSearchParams"] }
base64 = "0.23"
pem = "4"
pkcs1 = { version = "0.7", features = ["pkcs8"] }
pkcs8 = { version = "0.10", default-features = false, features = ["alloc"] }
serde-wasm-bindgen = "0.6"
utoipa.workspace = true
futures-util = "0.3"
# A maintained semaphore for the outbound and ambient-VFS permits —
# event-listener only ever wakes tasks that returned `Pending`, which a
# hand-rolled waker queue cannot promise on the single-threaded
# js_sys::futures executor (see fetch_guard::OutboundPool).
async-lock = "3.4"
# The index-slice transcode: the `zstd` crate does not build for wasm32,
# so the worker decodes zstd with `ruzstd` (pure Rust) and re-encodes as
# gzip with `flate2` for clients without `Accept-Encoding: zstd`; the
# resolver also reads `.crate`/codeload tarballs through it.
ruzstd = "0.8"
flate2.workspace = true
hmac = "0.13"
sha2 = "0.11"
hex.workspace = true
rsa = "0.9"
# Exact U256 arithmetic for the dispatch rank quotient — the locked
# RustCrypto bignum (no_std, no `rand` needed for fixed-width
# shift/div/hex). `cargo` keeps it on the pinned 0.5.5 the lockfile
# already carries transitively.
crypto-bigint = { version = "0.5.5", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The wasm subscriber bridge in console_log.rs is the only consumer; a
# host build never installs a subscriber through this crate.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
# rsa -> num-bigint-dig -> getrandom 0.2 needs the js backend to compile for
# wasm32; the OIDC path only verifies signatures and never draws entropy.
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
# Synthesized `.crate` tarballs for the sparse-unpack resolve test.
tar.workspace = true

# Host-only test deps: the sqlite test backend is `cfg(all(test, not(wasm32)))`,
# so sqlx-sqlite must not enter the wasm32 dev-dep graph.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio"] }
skyzen-services = { version = "0.2.1", default-features = false, features = ["sqlite", "runtime-tokio"] }

[lints]
workspace = true
