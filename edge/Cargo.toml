[package]
name = "stow-edge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Durable Object residency (`skyzen::durable::Residency`, stow#1574) is
# not released: the edge's skyzen crates track skyzen's `main`, and the
# generated Worker shim must come from the commit `Cargo.lock` pins
# (`.github/actions/install-skyzen-cli`). `ci` stays on the skyzen release
# whose native server it is written against.
skyzen = { git = "https://github.com/zen-rs/skyzen", branch = "main", default-features = false, features = ["json", "query"] }
skyzen-core = { git = "https://github.com/zen-rs/skyzen", branch = "main" }
skyzen-cloudflare = { git = "https://github.com/zen-rs/skyzen", branch = "main" }
skyzen-services = { git = "https://github.com/zen-rs/skyzen", branch = "main", default-features = false }
stow-types = { workspace = true, features = ["ci"] }
stow-shim.workspace = true
http = "1"
anyhow = "1"
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
# Query-string serialization for the scheduler client's admin filter —
# the same crate skyzen's `query` feature parses with.
serde_html_form = "0.4"
tracing.workspace = true
# `LegOutcome` timestamps — the same `time` stow-types exposes through
# its runs API (OffsetDateTime construction + duration reads only).
time = { version = "0.3", default-features = false, features = ["std"] }
semver.workspace = true
blake3.workspace = true
# The scheduler snapshot's bulk sections: MessagePack, carried as base64
# in a TEXT row (edge/src/scheduler/graph/snapshot.rs).
rmp-serde = { version = "1.3.1", default-features = false }
askama = "0.14"
# The wasm-bindgen family is exact-coupled (`js-sys =0.3.x` requires
# `wasm-bindgen =0.2.y` of the same release), and `skyzen dev`/`skyzen build`
# repackage the worker with the wasm-bindgen generator embedded in
# skyzen-cli (built from the pinned skyzen commit), which ships `=0.2.120`
# (see CONTRIBUTING.md). All four are
# pinned to that release line so `cargo update` cannot drift them.
wasm-bindgen = "=0.2.120"
wasm-bindgen-futures = "=0.4.70"
js-sys = "=0.3.97"
web-sys = { version = "=0.3.97", features = ["AbortSignal", "Crypto", "CryptoKey", "Headers", "Request", "RequestInit", "Response", "ResponseInit", "SubtleCrypto", "Url", "UrlSearchParams"] }
base64 = "0.23"
pem = "4"
pkcs1 = { version = "0.7", features = ["pkcs8"] }
pkcs8 = { version = "0.11", default-features = false, features = ["alloc"] }
serde-wasm-bindgen = "0.6"
utoipa.workspace = true
futures-util = "0.3"
fixedbitset = { version = "0.5.9", default-features = false }
orx-split-vec = { version = "4.1.1", default-features = false }
# A maintained semaphore for the outbound and ambient-VFS permits —
# event-listener only ever wakes tasks that returned `Pending`, which a
# hand-rolled waker queue cannot promise on the single-threaded
# js_sys::futures executor (see fetch_guard::OutboundPool).
async-lock = "3.4"
# The index-slice transcode: the `zstd` crate does not build for wasm32,
# so the worker decodes zstd with `ruzstd` (pure Rust) and re-encodes as
# gzip with `flate2` for clients without `Accept-Encoding: zstd`; the
# resolver also reads `.crate`/codeload tarballs through it.
ruzstd = "0.8"
flate2.workspace = true
hmac = "0.13"
sha2 = "0.11"
hex.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The wasm subscriber bridge in console_log.rs is the only consumer; a
# host build never installs a subscriber through this crate.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }
# Synthesized `.crate` tarballs for the sparse-unpack resolve test.
tar.workspace = true

# Host-only test deps: the sqlite test backend is `cfg(all(test, not(wasm32)))`,
# so sqlx-sqlite must not enter the wasm32 dev-dep graph.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio"] }
skyzen-services = { git = "https://github.com/zen-rs/skyzen", branch = "main", default-features = false, features = ["sqlite"] }
# The real index producer, so the transcode test decodes what a publish writes.
stow-shim = { workspace = true, features = ["zstd"] }
[lints]
workspace = true
