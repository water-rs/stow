[package]
name = "stow-edge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
skyzen = { version = "0.1.1", default-features = false, features = ["json", "form", "rt"] }
skyzen-cloudflare = "0.1"
skyzen-services = "0.1"
stow-types.workspace = true
stow-shim.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
semver.workspace = true
blake3.workspace = true
oci-spec = "0.9.0"
tar = "0.4"
toml = "0.8"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Request", "RequestInit", "Response", "ResponseInit", "Headers", "Url"] }
serde-wasm-bindgen = "0.6"
futures-util = "0.3"
subtle = "2"

[dev-dependencies]
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio-rustls"] }
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
