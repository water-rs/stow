[package]
name = "stow-edge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
skyzen = { version = "0.3.0", default-features = false, features = ["json", "query"] }
skyzen-cloudflare = "0.3.0"
skyzen-services = "0.2.1"
stow-types.workspace = true
stow-shim.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
semver.workspace = true
blake3.workspace = true
oci-spec = "0.9.0"
tar = "0.4"
toml = "0.8"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Crypto", "CryptoKey", "Headers", "Request", "RequestInit", "Response", "ResponseInit", "SubtleCrypto", "Url"] }
base64 = "0.22"
pem = "4"
pkcs1 = { version = "0.7", features = ["pkcs8"] }
pkcs8 = { version = "0.10", default-features = false, features = ["alloc"] }
serde-wasm-bindgen = "0.6"
utoipa.workspace = true
futures-util = "0.3"
subtle = "2"

[dev-dependencies]
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio-rustls"] }
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
