[package]
name = "stow-edge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
skyzen = { version = "0.3.0", default-features = false, features = ["json", "query"] }
skyzen-cloudflare = "0.3.0"
skyzen-services = "0.2.1"
stow-types.workspace = true
stow-shim.workspace = true
stow-resolve.workspace = true
flate2.workspace = true
tar.workspace = true
http = "1"
anyhow = "1"
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
# Query-string serialization for the scheduler client's admin filter —
# the same crate skyzen's `query` feature parses with.
serde_html_form = "0.4"
fixedbitset = "0.5"
tracing.workspace = true
semver.workspace = true
blake3.workspace = true
toml = "1"
askama = "0.14"
# The wasm-bindgen family is exact-coupled (`js-sys =0.3.x` requires
# `wasm-bindgen =0.2.y` of the same release), and `skyzen dev`/`skyzen build`
# repackage the worker with the wasm-bindgen generator embedded in
# skyzen-cli 0.4.1, which ships `=0.2.120` (see CONTRIBUTING.md). All four are
# pinned to that release line so `cargo update` cannot drift them.
wasm-bindgen = "=0.2.120"
wasm-bindgen-futures = "=0.4.70"
js-sys = "=0.3.97"
web-sys = { version = "=0.3.97", features = ["Crypto", "CryptoKey", "Headers", "Request", "RequestInit", "Response", "ResponseInit", "SubtleCrypto", "Url", "UrlSearchParams"] }
base64 = "0.23"
pem = "4"
pkcs1 = { version = "0.7", features = ["pkcs8"] }
pkcs8 = { version = "0.10", default-features = false, features = ["alloc"] }
serde-wasm-bindgen = "0.6"
utoipa.workspace = true
futures-util = "0.3"
hmac = "0.13"
sha2 = "0.11"
hex.workspace = true
rsa = "0.9"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The wasm subscriber bridge in console_log.rs is the only consumer; a
# host build never installs a subscriber through this crate.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
# rsa -> num-bigint-dig -> getrandom 0.2 needs the js backend to compile for
# wasm32; the OIDC path only verifies signatures and never draws entropy.
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio-rustls"] }
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
