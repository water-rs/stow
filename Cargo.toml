[workspace]
resolver = "3"

members = [
    "ci",
    "cli",
    "edge",
    "types",
    "watcher",
]

[workspace.dependencies]
zenwave = "0.3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = { version = "1.0", features = ["serde"] }
blake3 = "1"
hex = "0.4"
tracing = "0.1"
eyre = "0.6"
stow-types = { path = "types" }
