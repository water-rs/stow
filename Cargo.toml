[workspace]
resolver = "3"
default-members = [
    "ci",
    "cli",
    "edge",
    "types",
]

members = [
    "admin",
    "ci",
    "cli",
    "edge",
    "mock-registry",
    "shim",
    "types",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/water-rs/stow"

[workspace.dependencies]
zenwave = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = { version = "1.0", features = ["serde"] }
blake3 = "1"
hex = "0.4"
tracing = "0.1"
thiserror = "2"
stow-types = { path = "types", version = "0.1.0" }
stow-shim = { path = "shim", version = "0.1.0" }
target-lexicon = "0.12"
utoipa = { version = "5.4", default-features = false, features = ["macros"] }

[workspace.lints]
rust.missing_docs = "warn"
rust.missing_debug_implementations = "warn"
clippy.all = "warn"
clippy.style = "warn"
clippy.correctness = "warn"
clippy.complexity = "warn"
clippy.suspicious = "warn"
clippy.perf = "warn"
clippy.pedantic = "warn"
clippy.nursery = "warn"
clippy.cargo = "warn"
clippy.multiple_crate_versions =  { level = "allow", priority = 1 }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
