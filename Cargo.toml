[workspace]
resolver = "3"
default-members = [
    "ci",
    "cli",
    "edge",
    "types",
]

members = [
    "admin",
    "ci",
    "cli",
    "edge",
    "mock-registry",
    "oci",
    "resolver",
    "shim",
    "types",
]

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/water-rs/stow"

[workspace.dependencies]
# `default-backend` also compiles `native-tls` (OpenSSL) on every platform
# even though it is only used on Apple targets; selecting `hyper-backend` +
# `rustls` directly gives every target the same TLS stack, verified against
# the platform trust store. `http2` and `http3` let the transport negotiate
# ALPN and race an HTTP/3 connection, which is what the Cloudflare edge
# serves.
zenwave = { version = "0.7.1", default-features = false, features = [
    "hyper-backend",
    "rustls",
    "ws",
    "http2",
    "http3",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = { version = "1.0", features = ["serde"] }
blake3 = "1"
hex = "0.4"
tracing = "0.1"
thiserror = "2"
stow-types = { path = "types", version = "0.6.0" }
stow-shim = { path = "shim", version = "0.6.0" }
stow-oci = { path = "oci", version = "0.6.0" }
stow-cli = { path = "cli", version = "0.6.0" }
stow-resolver = { path = "resolver", version = "0.6.0" }
anyhow = "1.0.102"
toml = "0.9"
tempfile = "3"
target-lexicon = "0.13"
# The `.crate` tarball readers: the trusted runner unpacks a crate to build
# it, `stow-admin` reads one to decide a preheat task's resolution mode.
flate2 = "1.0"
tar = "0.4"
utoipa = { version = "5.4", default-features = false, features = ["macros"] }
rustls = { version = "0.23", default-features = false, features = [
    "std",
    "tls12",
    "logging",
    "ring",
] }

[workspace.lints]
rust.missing_docs = "warn"
rust.missing_debug_implementations = "warn"
clippy.all = "warn"
clippy.style = "warn"
clippy.correctness = "warn"
clippy.complexity = "warn"
clippy.suspicious = "warn"
clippy.perf = "warn"
clippy.pedantic = "warn"
clippy.nursery = "warn"
clippy.cargo = "warn"
clippy.multiple_crate_versions =  { level = "allow", priority = 1 }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# heel's write-ahead audit log (lexoliu/heel#39) and its Windows grant fix
# (lexoliu/heel#46: one ACL write per granted tree and no propagation from an
# ancestor's traverse entry, which cut a Windows build sandbox's creation
# from minutes to well under a second) are not in a release yet; the pin is
# the exact commit on heel's dev and moves to a crates.io version once one
# carries them.
[patch.crates-io]
# zenwave's QUIC keep-alive (zen-rs/zenwave#93): without it an HTTP/3 request
# whose server takes longer than 30 s to answer dies at quinn's idle timeout,
# which is how stow-admin's long resolve and submit calls failed. Its h2 pool
# fix (zen-rs/zenwave#96): a pooled HTTP/2 connection the server sent GOAWAY
# on was handed out again, so the first GitHub API call after an idle gap
# failed with `GoAway(NO_ERROR, Remote)`. Neither is in a release yet; the pin
# is the exact commit on zenwave's dev and moves to a crates.io version once
# one carries them.
zenwave = { git = "https://github.com/zen-rs/zenwave", rev = "f2bb056f8a52b746082400a7c4a60ba79c11b38f" }
heel = { git = "https://github.com/lexoliu/heel", rev = "da72ac1abd8a7de66b7a4540fae9e2979e9b7616" }
# cargo 0.99 (stow-resolver) pins rusqlite 0.40 → libsqlite3-sys ^0.38;
# sqlx-sqlite releases cap below it, so two `links = "sqlite3"` crates
# would conflict. sqlx main at this rev is 0.9.0 and allows
# libsqlite3-sys <0.39 — both resolve to crates.io's 0.38.x and there is
# exactly one `links` owner. Every sqlx crate in the graph is pinned to
# the same rev so exactly one sqlx-core exists. Drops once a sqlx
# release allows libsqlite3-sys 0.38.
sqlx = { git = "https://github.com/launchbadge/sqlx", rev = "b54008a329541c0ce230d8b203e0c00fc8e8ea48" }
sqlx-core = { git = "https://github.com/launchbadge/sqlx", rev = "b54008a329541c0ce230d8b203e0c00fc8e8ea48" }
sqlx-sqlite = { git = "https://github.com/launchbadge/sqlx", rev = "b54008a329541c0ce230d8b203e0c00fc8e8ea48" }
# skyzen dev at this rev moves services to sqlx 0.9 and takes services
# with default-features off, so only the pinned sqlx 0.9 graph exists.
# The rev also carries two unreleased fixes: encodeBody for
# double-encoded responses (zen-rs/skyzen#96) and CfFetch rendering a
# rejected fetch's JS `.message` (zen-rs/skyzen#100) — no 0.4.x tag or
# crates.io release carries either. Every skyzen crate the edge
# resolves is pinned to one rev so the whole graph agrees: pinning
# `skyzen-cloudflare` alone duplicates the graph, because a git
# package's in-repo path deps resolve inside its own checkout while
# stow-edge's direct deps keep the older rev's crate instances.
skyzen = { git = "https://github.com/zen-rs/skyzen", rev = "a589a326b091c5b0d66b6392e8678a3e820fb8b3" }
skyzen-cloudflare = { git = "https://github.com/zen-rs/skyzen", rev = "a589a326b091c5b0d66b6392e8678a3e820fb8b3" }
skyzen-core = { git = "https://github.com/zen-rs/skyzen", rev = "a589a326b091c5b0d66b6392e8678a3e820fb8b3" }
skyzen-hyper = { git = "https://github.com/zen-rs/skyzen", rev = "a589a326b091c5b0d66b6392e8678a3e820fb8b3" }
skyzen-macros = { git = "https://github.com/zen-rs/skyzen", rev = "a589a326b091c5b0d66b6392e8678a3e820fb8b3" }
skyzen-manifest = { git = "https://github.com/zen-rs/skyzen", rev = "a589a326b091c5b0d66b6392e8678a3e820fb8b3" }
skyzen-services = { git = "https://github.com/zen-rs/skyzen", rev = "a589a326b091c5b0d66b6392e8678a3e820fb8b3" }
sqlx-macros = { git = "https://github.com/launchbadge/sqlx", rev = "b54008a329541c0ce230d8b203e0c00fc8e8ea48" }
sqlx-macros-core = { git = "https://github.com/launchbadge/sqlx", rev = "b54008a329541c0ce230d8b203e0c00fc8e8ea48" }
sqlx-mysql = { git = "https://github.com/launchbadge/sqlx", rev = "b54008a329541c0ce230d8b203e0c00fc8e8ea48" }
sqlx-postgres = { git = "https://github.com/launchbadge/sqlx", rev = "b54008a329541c0ce230d8b203e0c00fc8e8ea48" }
