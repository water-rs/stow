[package]
name = "stow-cli"
version = "0.1.0"
edition = "2024"
default-run = "stow-cli"

[[bin]]
name = "stow-cli"
path = "src/bin/stow-cli.rs"

[[bin]]
name = "cargo-stow"
path = "src/bin/cargo-stow.rs"

[[bin]]
name = "stow"
path = "src/bin/stow.rs"

[dependencies]
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
clap = { version = "4.5", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-chrome = "0.7"
async-process = "2"
async-fs = "2"
futures-lite = "2"
futures-util = "0.3"
smol = "2"
tempfile = "3"
toml_edit = "0.22"
zenwave.workspace = true
toml = "0.8"
dirs = "6"
fs2 = "0.4"
pathdiff = "0.2"
sha2 = "0.10"
blake3.workspace = true
hex.workspace = true
tar = "0.4"
stow-types = { path = "../types" }
stow-shim.workspace = true
oci-spec = "0.9.0"
sigstore = { version = "0.13.0", default-features = false, features = ["cosign", "verify", "sigstore-trust-root", "rustls-tls"] }
tokio = { version = "1", features = ["io-std", "io-util", "rt", "rt-multi-thread", "sync", "time"] }
async-tar = { version = "0.6", default-features = false, features = ["runtime-async-std"] }
x509-cert = "0.2.5"
webpki = { package = "rustls-webpki", version = "0.103.8" }
rustls-pki-types = "1.14.0"
olpc-cjson = "0.1.4"
const-oid = "0.9.6"
cargo-lock = "10"
cargo_metadata = "0.19"
glob = "0.3"
reflink = "0.1.3"
walkdir = "2"
zstd = "0.13"
shell-words = "1.1"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio-rustls", "macros"] }

[lints]
workspace = true