name: Preheat

# Warm the public cache for the water-rs organization: every non-archived,
# non-fork repository with a Cargo.lock is analyzed with `stow predict` on
# each CI target, and the misses that analysis surfaces are submitted to the
# scheduler through the ordinary admission path. No secret is involved —
# the run acts exactly as a first-time `stow check` on that repository
# would, minus the compile.
on:
  workflow_dispatch:
    inputs:
      repos:
        description: >-
          Space-separated repository names under water-rs to preheat.
          Empty means every non-archived, non-fork repository with a
          Cargo.lock. Set `waterui` to preheat it on its own.
        required: false
        default: ""
      targets:
        description: >-
          Space-separated target triples to analyze. Defaults to
          `stow_types::CI_TARGET_TRIPLES` — every target waterui builds
          for.
        required: false
        default: >-
          aarch64-apple-darwin aarch64-apple-ios
          aarch64-apple-ios-sim aarch64-linux-android
          x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
          x86_64-pc-windows-msvc aarch64-pc-windows-msvc
          wasm32-unknown-unknown

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  preheat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: ./
        with:
          version: latest
      - name: Analyze every repository on every CI target
        env:
          GH_TOKEN: ${{ github.token }}
          REPOS: ${{ inputs.repos }}
          TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          if [ -z "$REPOS" ]; then
            REPOS="$(gh repo list water-rs --limit 200 --json name,isArchived,isFork \
              --jq '.[] | select(.isArchived == false and .isFork == false) | .name' | tr '\n' ' ')"
          fi
          mkdir -p "$RUNNER_TEMP/preheat"
          failed=""
          for repo in $REPOS; do
            dir="$RUNNER_TEMP/preheat/$repo"
            git clone --quiet --depth 1 "https://github.com/water-rs/$repo.git" "$dir"
            if [ ! -f "$dir/Cargo.lock" ]; then
              echo "::notice::$repo has no Cargo.lock, skipped"
              continue
            fi
            # The expanded-graph analysis runs `cargo metadata --offline`, so
            # the registry index and every git dependency of the lockfile
            # must already be in the local cargo cache, as they are on a
            # developer machine. One fetch per repository covers all targets.
            if ! cargo fetch --locked --manifest-path "$dir/Cargo.toml"; then
              echo "::error::cargo fetch failed for $repo"
              failed="$failed $repo(fetch)"
              continue
            fi
            for target in $TARGETS; do
              echo "::group::$repo ($target)"
              if ! stow predict --manifest-path "$dir/Cargo.toml" --target "$target"; then
                echo "::error::stow predict failed for $repo ($target)"
                failed="$failed $repo($target)"
              fi
              echo "::endgroup::"
            done
          done
          if [ -n "$failed" ]; then
            echo "::error::preheat incomplete:$failed"
            exit 1
          fi
