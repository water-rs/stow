name: deploy-site

# The Pages site deploys independently of the edge release pipeline
# (stow#1648): a push to `main` touching `site/` rebuilds `site/dist`
# (`cargo run -p stow-site`) and publishes it with `wrangler pages
# deploy` — a page edit never needs a Worker version. The Worker owns
# only the `stow.waterui.dev/api/*` route, so a Pages deploy and a Worker
# deploy cannot interfere. One-time project setup is in
# docs/DEPLOYMENT.md.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-site.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:
    inputs:
      setup:
        # The one-time stow.waterui.dev cutover (stow#1648): every step is
        # idempotent, so re-running it repairs rather than breaks.
        description: "Provision the Pages domain + DNS and drop the Worker Custom Domain"
        required: false
        type: boolean
        default: false
      setup_lookup:
        # Idempotently ensures the WAF allowlist + Cache Rule on
        # stow-index.waterui.dev and syncs the current stable rustc's
        # verified GHCR slices into R2 (stow#1688).
        description: "Ensure stow-index.waterui.dev edge rules and sync current stable lookup JSONs to R2"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency: deploy-site

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: site
      - run: cargo run --release -p stow-site -- site/dist
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - run: bun install -g wrangler@4
      - run: wrangler pages deploy site/dist --project-name stow-site --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # One-time domain cutover: the Pages project's custom domain is
  # `stow.waterui.dev` and the Worker keeps only its `/api/*` route.
  # Ordering keeps the hostname resolved throughout — the CNAME is
  # created first (it coexists with the Worker Custom Domain's managed
  # record only where the API allows it), the Custom Domain is deleted,
  # and the CNAME step repeats in case the first create conflicted.
  setup:
    if: github.event_name == 'workflow_dispatch' && inputs.setup
    runs-on: ubuntu-latest
    steps:
      - name: Migrate stow.waterui.dev to Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api() { curl -fsS -X "$1" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" ${3:+-d "$3"} "https://api.cloudflare.com/client/v4$2"; }
          ZONE=$(api GET "/zones?name=waterui.dev" | jq -r '.result[0].id')
          # The Worker's path-scoped route — API traffic keeps reaching it.
          api POST "/zones/$ZONE/workers/routes" \
            '{"pattern":"stow.waterui.dev/api/*","script":"stow-edge"}' || true
          # The Pages project's claim on the hostname.
          api POST "/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/stow-site/domains" \
            '{"name":"stow.waterui.dev"}' || true
          api POST "/zones/$ZONE/dns_records" \
            '{"type":"CNAME","name":"stow","content":"stow-site.pages.dev","proxied":true,"ttl":1}' || true
          CD=$(api GET "/zones/$ZONE/workers/domains" | jq -r '.result[] | select(.hostname == "stow.waterui.dev") | .id')
          if [ -n "$CD" ]; then
            api DELETE "/zones/$ZONE/workers/domains/$CD" >/dev/null
          fi
          api POST "/zones/$ZONE/dns_records" \
            '{"type":"CNAME","name":"stow","content":"stow-site.pages.dev","proxied":true,"ttl":1}' || true
          api PATCH "/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/stow-site/domains/stow.waterui.dev" || true
          for _ in $(seq 30); do
            status=$(api GET "/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/stow-site/domains/stow.waterui.dev" | jq -r '.result.status')
            [ "$status" = "active" ] && break
            sleep 5
          done
          [ "$status" = "active" ] || { echo "Pages domain still $status" >&2; exit 1; }
          curl -fsS -o /dev/null -w 'GET / -> %{http_code}\n' https://stow.waterui.dev/
          curl -fsS -o /dev/null -w 'GET /api/v1/stats -> %{http_code}\n' "https://stow.waterui.dev/api/v1/stats?pages-setup"

  setup_lookup:
    if: github.event_name == 'workflow_dispatch' && inputs.setup_lookup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: site-lookup
      - name: Build stow-admin
        run: cargo build --release -p stow-admin --bin stow-admin
      - name: Ensure stow-index.waterui.dev WAF allowlist and Cache Rule
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ vars.CF_ZONE_ID }}
        run: |
          set -euo pipefail
          ./target/release/stow-admin index ensure-lookup-rules --yes
      - name: Sync current stable lookup JSON slices to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          rustc_version="$(curl -fsS https://static.rust-lang.org/dist/channel-rust-stable.toml \
            | python3 -c 'import sys, tomllib; print(tomllib.load(sys.stdin.buffer)["pkg"]["rust"]["version"].split()[0])')"
          ./target/release/stow-admin index sync-lookup --rustc-version "$rustc_version"
