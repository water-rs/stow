name: Action smoke

on:
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The action installs a published `stow-cli-v*` release, so the smoke test
  # has nothing to exercise until the first one exists. This job answers that
  # once, and the matrix below runs only when it does.
  release:
    name: installable release
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.probe.outputs.exists }}
    steps:
      - id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh api 'repos/water-rs/stow/releases?per_page=100' \
            --jq '[.[] | select(.draft == false and .prerelease == false) | select(any(.assets[]; .name | startswith("stow-cli-"))) | .tag_name | select(startswith("stow-cli-v"))][0] // empty')"
          echo "exists=$([ -n "$tag" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "installable release: ${tag:-none}"

  smoke:
    name: smoke (${{ matrix.os }})
    needs: release
    if: needs.release.outputs.exists == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: ./
        with:
          version: latest
      - run: stow --version
      - name: cargo check through the wrappers
        shell: bash
        run: |
          set -euo pipefail
          # Create the throwaway crate beside the checkout, not inside it:
          # `cargo new` under the workspace root joins the workspace and
          # inherits `edition` from a `[workspace.package]` the root does
          # not define.
          cargo new ../smoke-crate
          cd ../smoke-crate
          cargo check
