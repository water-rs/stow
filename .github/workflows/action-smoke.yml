name: Action smoke

on:
  push:
    branches: [main]
  pull_request:
  # `installable release` is a required check on main, so the merge queue
  # waits for it on the merge_group ref; without this trigger the queue
  # would wait forever.
  merge_group:

# A branch pushed several times in a row only needs its newest run: the older
# ones test a tree nobody will merge. Pushes to main keep theirs, because
# those runs are the record of what the branch did.
concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Documentation cannot change what a compiler or a test observes, so the
  # jobs below skip it. The condition lives on the jobs and never on the
  # workflow's triggers: a workflow skipped by `paths-ignore` leaves its
  # checks Pending forever and the main ruleset requires it, while
  # a job skipped by `if:` reports success and satisfies them.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # On a pull request the filter reads the changed files from the API; on
      # a push it diffs against the previous tip with git, so it needs the
      # repository checked out.
      - if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          # `every` is required: with the default quantifier a negated rule
          # never excludes anything, because the rules are OR-ed and `**`
          # already matched. With `every`, a file counts as code only when it
          # matches every rule, so `code` is true exactly when some changed
          # file is not documentation.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!LICENSE*'
              - '!.gitignore'

  # The action installs a published `v<version>` release, so the smoke test
  # has nothing to exercise until the first one exists. This job answers that
  # once, and the matrix below runs only when it does.
  release:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: installable release
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.probe.outputs.exists }}
    steps:
      - id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh api 'repos/water-rs/stow/releases?per_page=100' \
            --jq '[.[] | select(.draft == false and .prerelease == false) | select(any(.assets[]; .name | startswith("stow-cli-"))) | .tag_name | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))][0] // empty')"
          echo "exists=$([ -n "$tag" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "installable release: ${tag:-none}"

  smoke:
    name: smoke (${{ matrix.os }}, ${{ matrix.mode }})
    needs: [changes, release]
    if: needs.changes.outputs.code == 'true' && needs.release.outputs.exists == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
        mode: [remote, local]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - name: create deterministic smoke workspace before cache key resolution
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ../smoke-dep ../smoke-crate
          mkdir -p ../smoke-dep/src
          cat > ../smoke-dep/Cargo.toml <<'EOF'
          [package]
          name = "smoke-dep"
          version = "0.1.0"
          edition = "2024"
          EOF
          printf 'pub const ANSWER: u32 = 42;\n' > ../smoke-dep/src/lib.rs
          (
            cd ../smoke-dep
            git init --quiet --initial-branch=main
            git add --all
            GIT_AUTHOR_DATE='2026-01-01T00:00:00Z' GIT_COMMITTER_DATE='2026-01-01T00:00:00Z' \
              git -c user.name=stow-smoke -c user.email=smoke@stow.invalid \
              commit --quiet --no-gpg-sign -m "initial"
          )
          dep_url="$(node -e 'console.log(require("node:url").pathToFileURL(require("node:path").resolve(process.argv[1])).href)' ../smoke-dep)"
          mkdir -p ../smoke-crate/src ../smoke-crate/tests
          cat > ../smoke-crate/Cargo.toml <<EOF
          [package]
          name = "smoke-crate"
          version = "0.1.0"
          edition = "2024"

          [dependencies]
          smoke-dep = { git = "${dep_url}" }
          itoa = "1.0.15"
          EOF
          printf 'fn main() { assert_eq!(smoke_dep::ANSWER, 42); let mut b = itoa::Buffer::new(); assert_eq!(b.format(42), "42"); }\n' > ../smoke-crate/src/main.rs
          printf '#[test]\nfn smoke_it() { assert_eq!(smoke_dep::ANSWER, 42); }\n' > ../smoke-crate/tests/smoke_it.rs
          (cd ../smoke-crate && cargo generate-lockfile)
      - id: stow-remote
        if: matrix.mode == 'remote'
        uses: ./
        with:
          version: latest
          shared-key: smoke-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}-${{ matrix.mode }}
          workspaces: ../smoke-crate
      - id: stow-local
        if: matrix.mode == 'local'
        uses: ./local
        with:
          version: latest
          shared-key: smoke-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}-${{ matrix.mode }}
          workspaces: ../smoke-crate
      - run: stow --version
      - name: verify local-only mode disables remote requests
        if: matrix.mode == 'local'
        shell: bash
        run: |
          set -euo pipefail
          if out="$(stow index refresh 2>&1)"; then
            echo "::error::stow index refresh unexpectedly succeeded under ./local: $out" >&2
            exit 1
          fi
          grep -q "remote cache is off" <<<"$out"
      - name: cargo check through the wrappers (cold populate)
        shell: bash
        run: |
          set -euo pipefail
          cd ../smoke-crate
          cargo check
          exe="$(cargo test --no-run --message-format=json | jq -r 'select(.reason == "compiler-artifact" and .target.name == "smoke_it") | .executable')"
          [ -f "$exe" ]
          case "${exe//\\//}" in
            */target/*) ;;
            *)
              echo "::error::expected test binary inside target/, got: $exe" >&2
              exit 1
              ;;
          esac
          [ -d "${HOME}/.stow/local" ]
          [ ! -d "${HOME}/.stow/build-dir" ]

  smoke-warm:
    name: smoke-warm (${{ matrix.os }}, ${{ matrix.mode }})
    needs: smoke
    if: always() && needs.smoke.result == 'success'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        mode: [remote, local]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - name: recreate identical smoke workspace on fresh runner
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ../smoke-dep ../smoke-crate
          mkdir -p ../smoke-dep/src
          cat > ../smoke-dep/Cargo.toml <<'EOF'
          [package]
          name = "smoke-dep"
          version = "0.1.0"
          edition = "2024"
          EOF
          printf 'pub const ANSWER: u32 = 42;\n' > ../smoke-dep/src/lib.rs
          (
            cd ../smoke-dep
            git init --quiet --initial-branch=main
            git add --all
            GIT_AUTHOR_DATE='2026-01-01T00:00:00Z' GIT_COMMITTER_DATE='2026-01-01T00:00:00Z' \
              git -c user.name=stow-smoke -c user.email=smoke@stow.invalid \
              commit --quiet --no-gpg-sign -m "initial"
          )
          dep_url="$(node -e 'console.log(require("node:url").pathToFileURL(require("node:path").resolve(process.argv[1])).href)' ../smoke-dep)"
          mkdir -p ../smoke-crate/src ../smoke-crate/tests
          cat > ../smoke-crate/Cargo.toml <<EOF
          [package]
          name = "smoke-crate"
          version = "0.1.0"
          edition = "2024"

          [dependencies]
          smoke-dep = { git = "${dep_url}" }
          itoa = "1.0.15"
          EOF
          printf 'fn main() { assert_eq!(smoke_dep::ANSWER, 42); let mut b = itoa::Buffer::new(); assert_eq!(b.format(42), "42"); }\n' > ../smoke-crate/src/main.rs
          printf '#[test]\nfn smoke_it() { assert_eq!(smoke_dep::ANSWER, 42); }\n' > ../smoke-crate/tests/smoke_it.rs
          (cd ../smoke-crate && cargo generate-lockfile)
      - id: stow-remote
        if: matrix.mode == 'remote'
        uses: ./
        with:
          version: latest
          shared-key: smoke-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}-${{ matrix.mode }}
          workspaces: ../smoke-crate
          save-if: "false"
      - id: stow-local
        if: matrix.mode == 'local'
        uses: ./local
        with:
          version: latest
          shared-key: smoke-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}-${{ matrix.mode }}
          workspaces: ../smoke-crate
          save-if: "false"
      - name: verify warm tier restoration and zero crates-io/index leakage
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
          HIT_LOCAL: ${{ steps.stow-remote.outputs.local-cache-hit || steps.stow-local.outputs.local-cache-hit }}
          HIT_CRATES: ${{ steps.stow-remote.outputs.local-crates-io-cache-hit || steps.stow-local.outputs.local-crates-io-cache-hit }}
        run: |
          set -euo pipefail
          if [ "$HIT_LOCAL" != "true" ]; then
            echo "::error::expected warm local-cache-hit=true, got '$HIT_LOCAL'" >&2
            exit 1
          fi
          [ -d "${HOME}/.stow/local" ]
          # Public network tiers must never be archived into GitHub Actions Cache.
          [ ! -d "${HOME}/.stow/crates-io" ]
          [ ! -d "${HOME}/.stow/index" ]
          if [ "$MODE" = "local" ]; then
            if [ "$HIT_CRATES" != "true" ]; then
              echo "::error::expected warm local-crates-io-cache-hit=true in local mode, got '$HIT_CRATES'" >&2
              exit 1
            fi
            [ -d "${HOME}/.stow/local-crates-io" ]
          fi
          cd ../smoke-crate
          cargo check
          hits="$(stow stats --json | jq -r '.hits')"
          if [ "${hits:-0}" -lt 1 ]; then
            echo "::error::expected restored local cache to serve at least 1 unit, got hits=${hits}" >&2
            stow stats --json >&2
            exit 1
          fi
