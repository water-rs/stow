name: toolchain-publish

# Every build-crate dispatch used to compile stow-build and stow-cli on
# the runner that also builds the task's crate — up to ~17 minutes per
# run, once per target leg of the wave. This workflow compiles them once
# per release tag per host platform and publishes the toolchain (stow-build,
# stow-cli, and on Linux and macOS stow-admin) to GHCR as a digest-addressed,
# cosign-signed OCI artifact; build-crate and the deploy/watchdog jobs pull it
# by `github.sha` instead of compiling or hunting Test-run artifacts
# (stow#431).
#
# stow-admin ships in the Linux toolchain for the jobs that pull it on
# ubuntu, and in the macOS one for the operator, who runs it from a Mac. It
# is the one binary that links stow-resolver — cargo itself — which
# dominates a cold release build, so the Windows leg leaves it out.
#
# It runs on a release tag push (`v<semver>`), so `github.sha` here is the
# release PR's head commit — the tag `<sha>-<platform>` is what a
# production workflow dispatched on that tag looks up. The signing identity
# is `…/toolchain-publish.yml@refs/tags/v<semver>`, a ref only the release
# workflow can create (a ruleset protects `refs/tags/v*`), and consumers
# additionally pin the signature's workflow-sha extension to their own
# `github.sha` — provenance at least as strong as the source build it
# replaces.
#
# GHCR/OCI rather than release assets: the manifest digest makes the pull
# itself the digest verification (a release asset would need a sidecar
# served from the same trust domain it claims to check), cosign already
# signs this registry's artifacts with the keyless identity the trust
# model is built on, and no per-commit tags or releases accrete on the
# repo. The pull runs before any stow binary exists on the runner, so
# both directions go through the oras CLI — stow-oci is a library whose
# own host is the artifact being fetched.
#
# Once every platform leg has published, the `deploy` job dispatches
# deploy-edge.yml on the same tag: the edge deploys only from a release, and
# only after the toolchain its verdict jobs pull exists.

on:
  push:
    tags: ['v[0-9]*']

permissions: {}

jobs:
  toolchain:
    name: publish stow toolchain (${{ matrix.key }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, key: linux-x64, bins: stow-build stow-cli stow-admin }
          - { os: windows-latest, key: windows-x64, bins: stow-build stow-cli }
          - { os: macos-26, key: macos-arm64, bins: stow-build stow-cli stow-admin }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write # push ghcr.io/water-rs/stow-toolchain
      id-token: write # cosign keyless
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - name: Build ${{ matrix.bins }}
        shell: bash
        env:
          BINS: ${{ matrix.bins }}
        run: |
          set -euo pipefail
          packages=()
          for bin in $BINS; do packages+=(-p "$bin"); done
          cargo build --release "${packages[@]}"
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Publish the toolchain artifact
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLATFORM_KEY: ${{ matrix.key }}
          BINS: ${{ matrix.bins }}
        run: |
          set -euo pipefail
          suffix=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            suffix=".exe"
          fi
          bins=()
          for bin in $BINS; do bins+=("${bin}${suffix}"); done
          tar -C target/release -czf stow-toolchain.tar.gz "${bins[@]}"

          ref="ghcr.io/water-rs/stow-toolchain:${GITHUB_SHA}-${PLATFORM_KEY}"
          echo "$GHCR_TOKEN" | oras login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin
          oras push "$ref" \
            "stow-toolchain.tar.gz:application/vnd.oci.image.layer.v1.tar+gzip"
          digest="$(oras manifest fetch --descriptor "$ref" | jq -r .digest)"
          # Sign by digest: the signature attests these exact bytes came
          # from this workflow on this release tag — the identity the
          # consumer pins.
          cosign sign --yes "ghcr.io/water-rs/stow-toolchain@${digest}"
          echo "published ${ref} digest ${digest}"

  # Deploys the edge from this release once every platform's toolchain is
  # published; the dispatched run's ref is the tag, so its jobs pull the
  # toolchain this workflow just signed.
  deploy:
    name: deploy the edge
    needs: toolchain
    runs-on: ubuntu-latest
    permissions:
      actions: write # dispatch deploy-edge.yml
    timeout-minutes: 5
    steps:
      - name: Dispatch deploy-edge on this tag
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-edge.yml --ref "$GITHUB_REF_NAME"
