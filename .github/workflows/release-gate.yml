name: Release gate

# The checks a release must pass but a routine merge must not wait on: the
# mock end-to-end, the traffic-cost and preheat-cost tests, the production
# wave count, and the monthly projection over what those three measured.
# Passing them certifies a commit, and a certified commit gets its release
# PR: release-plz's version bump and changelog on top of exactly that
# commit. A run certifies `inputs.sha`, or the head of the ref it was
# dispatched on, in one of two ways —
# nightly (03:00 ET): the edge Cron Trigger dispatches this workflow on its
# own release tag (`STOW_PERIODIC_WORKFLOWS`, stow#1121); that run only
# runs `trampoline`, which dispatches the certification on `main` with
# `nightly=true`, and `test.yml` on `main` so the caches saved from
# `main`'s ref stay fresh;
# by name: an operator dispatches it on `main` with `sha` set to the commit
# to release, or without it for `main`'s head, for a release during the day.
# A failed nightly files or updates the `nightly` issue and opens nothing.
#
# `release-plz.yml` releases a release PR's head commit only when its
# parent carries the `Certified` commit status this workflow sets.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit to certify; empty certifies the head of the dispatched ref"
        required: false
        default: ""
        type: string
      nightly:
        description: "Report the result on the `nightly` issue (set by the nightly trampoline)"
        required: false
        default: false
        type: boolean
      capacity_jobs:
        description: "Mock scheduler total job capacity; empty keeps the test defaults"
        required: false
        default: ""
        type: string
      capacity_macos_jobs:
        description: "Mock scheduler macOS job capacity; empty keeps the test defaults"
        required: false
        default: ""
        type: string
      traffic_rate_scale:
        description: "Peak traffic rate multiplier; empty keeps the test default"
        required: false
        default: ""
        type: string

# One certification per commit; runs are records and never cancel one
# another.
concurrency:
  group: release-gate-${{ inputs.sha || github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # No debuginfo in CI builds. A failing test reports its file and line
  # without it, and it was most of every cached target directory: a
  # workspace `cargo test --no-run` is 11 GB with it and 3.4 GB without,
  # and compiles in 128 s instead of 174 s. The per-job caches held the full
  # size, filled the repository's 10 GB cache allowance and evicted each
  # other.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # The run on the edge's release tag is the nightly tick: it certifies
  # nothing itself and only dispatches the real runs on `main`.
  trampoline:
    if: github.ref_type == 'tag'
    name: Nightly trampoline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # dispatch release-gate.yml and test.yml on main
    steps:
      - name: Dispatch the certification and the cache refresh on main
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run release-gate.yml --ref main -f nightly=true
          gh workflow run test.yml --ref main

  # Every other job needs `tools`, so a skipped `tools` (the trampoline run)
  # skips the legs; on any other run they run unconditionally: a
  # certification has no "changed paths" to scope to, and the nightly exists
  # to catch a drift no change drove.
  tools:
    if: github.ref_type != 'tag'
    name: Gate tools (${{ matrix.variant }})
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: [production, preheat, mock]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: mock-e2e
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.variant == 'production' }}
          cache-on-failure: true
      - uses: ./.github/actions/link-with-mold
      - name: Build the tools once for this workflow
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          REPO_ROOT="$GITHUB_WORKSPACE"
          source scripts/gate-tools.sh
          gate_tools "$VARIANT" "$RUNNER_TEMP/gate-tools.log" || {
            cat "$RUNNER_TEMP/gate-tools.log"
            exit 1
          }
          tar -czf "$RUNNER_TEMP/gate-tools.tar.gz" -C "$BIN" "${GATE_TOOL_FILES[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-tools-${{ matrix.variant }}
          path: ${{ runner.temp }}/gate-tools.tar.gz
          if-no-files-found: error

  mock-e2e:
    needs: tools
    name: Mock end-to-end
    runs-on: ubuntu-26.04
    permissions:
      # The local edge authenticates its write endpoints against the
      # credential's own repo permissions — GITHUB_TOKEN needs push
      # (`contents: write`) to pass. Fork pull requests still receive a
      # read-only token regardless of this block.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/gate-tools
        with:
          variant: mock
          runtime-cache: "true"
      - uses: ./.github/actions/link-with-mold
      - uses: ./.github/actions/install-skyzen-cli
      # The mock's dispatched builds link the buster glibc-2.28 sysroot
      # the way production builds do (stow#336) — same manifest hash key
      # as the build-crate job's cache; the extracted tree is large
      # enough to keep between runs.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: glibc-sysroot
        with:
          path: ~/.cache/stow
          key: glibc-sysroot-${{ hashFiles('ci/glibc-sysroot-debs.txt') }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # The mock manifest runs on the Cloudflare provider, so `skyzen dev`
      # supervises `wrangler dev --local` (workerd).
      - run: bun install -g wrangler@4
      - run: scripts/mock-e2e.sh
        env:
          STOW_E2E_WORK_DIR: ${{ runner.temp }}/stow-mock-e2e
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.glibc-sysroot.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/stow
          key: ${{ steps.glibc-sysroot.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: mock-e2e-logs
          path: ${{ runner.temp }}/stow-mock-e2e/logs
          if-no-files-found: ignore

  # The traffic-cost test (stow#772): one mock stack — the edge under
  # `wrangler dev` (workerd), the mock GHCR and the stubbed dispatch
  # endpoint — answers whether launch user traffic fits the Cloudflare
  # allowance without overloading the scheduler. It measures every
  # scheduler drive's billed rows at the 100k and 1M fixtures and Worker
  # CPU per traffic lane through the isolate's CPU profiler, then drives
  # every lane at the launch model's peak rate for thirty minutes and
  # measures the drives again. `scripts/traffic-cost.sh` fails on a row
  # or CPU budget breach, a drive whose rows grow with the stored bulk,
  # peak serialized Durable Object wall above its bound, and any overload
  # signal or 5xx under the drive. Its reports are what the `Monthly
  # projection` job prices the month from.
  traffic-cost:
    needs: tools
    name: Traffic cost
    runs-on: ubuntu-26.04
    timeout-minutes: 110
    permissions:
      # The local edge authenticates its trusted endpoints against the
      # credential's own repo permissions — GITHUB_TOKEN needs push
      # (`contents: write`) to pass.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/gate-tools
        with:
          variant: production
          runtime-cache: "true"
      - uses: ./.github/actions/link-with-mold
      - uses: ./.github/actions/install-skyzen-cli
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install -g wrangler@4
      - run: scripts/traffic-cost.sh
        env:
          STOW_TRAFFIC_WORK_DIR: ${{ runner.temp }}/stow-traffic
          STOW_TRAFFIC_MAX_JOBS: ${{ inputs.capacity_jobs }}
          STOW_TRAFFIC_MAX_MACOS_JOBS: ${{ inputs.capacity_macos_jobs }}
          STOW_TRAFFIC_RATE_SCALE: ${{ inputs.traffic_rate_scale }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The reports are the run's numbers — kept on a pass too, so the
      # budgets can be calibrated from them.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: traffic-cost-reports
          path: ${{ runner.temp }}/stow-traffic/reports
          if-no-files-found: ignore
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() || cancelled()
        with:
          name: traffic-cost-logs
          path: ${{ runner.temp }}/stow-traffic/logs
          if-no-files-found: ignore

  # The preheat-cost test (stow#773): the same mock stack drives a real
  # preheat wave through the scheduler — the production lanes submit the
  # resolved popular-crate graph across every CI target, every dispatch
  # runs the real build and publish stages with rustc answered by the
  # mock compiler, publish rounds release the graph layer by layer, and
  # the same lists are resubmitted the way the daily cron does.
  # `scripts/preheat-cost.sh` fails on a per-event cost that grows from
  # the first layer to the last, a node dispatched before its dependencies
  # were published, a node left unpublished, a resubmit that rebuilds, and
  # any overloaded answer. Monthly projection gates the combined cost.
  # The production wave's size is not counted here: resolving the
  # production lanes outran this job's timeout beside the wave's builds,
  # so the `Production wave` job counts it.
  preheat-cost:
    needs: tools
    name: Preheat cost
    runs-on: ubuntu-26.04
    # The full wave keeps the runner's four cores busy for 40 to 45
    # minutes (#1344); tool compilation runs separately.
    timeout-minutes: 60
    permissions:
      # The local edge authenticates its trusted endpoints against the
      # credential's own repo permissions — GITHUB_TOKEN needs push
      # (`contents: write`) to pass.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/gate-tools
        with:
          variant: preheat
          runtime-cache: "true"
      - uses: ./.github/actions/link-with-mold
      - uses: ./.github/actions/install-skyzen-cli
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install -g wrangler@4
      - run: scripts/preheat-cost.sh
        env:
          STOW_PREHEAT_COST_WORK_DIR: ${{ runner.temp }}/stow-preheat-cost
          STOW_PREHEAT_COST_MAX_JOBS: ${{ inputs.capacity_jobs }}
          STOW_PREHEAT_COST_MAX_MACOS_JOBS: ${{ inputs.capacity_macos_jobs }}
          STOW_PREHEAT_COST_LIMIT: 2
          STOW_PREHEAT_COST_PROJECTS: 0
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The report is the run's numbers — kept on a pass too, so the
      # budgets can be calibrated from it; the monthly projection job
      # downloads it.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: preheat-cost-report
          path: |
            ${{ runner.temp }}/stow-preheat-cost/preheat-cost-report.json
            ${{ runner.temp }}/stow-preheat-cost/cost
          if-no-files-found: ignore
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() || cancelled()
        with:
          name: preheat-cost-logs
          path: ${{ runner.temp }}/stow-preheat-cost/logs
          if-no-files-found: ignore

  # The production wave's size (stow#775): how many distinct nodes the
  # production preheat lanes submit, which the projection scales the
  # preheat-cost job's measured per-node costs to. `scripts/production-wave.sh`
  # resolves the three lanes plan-only (nothing is enqueued, no edge) at the
  # limit and targets `preheat-admin.yml` runs them with, concurrently and
  # from the start of the gate: production's resolve takes up to 100
  # minutes for the projects lane, which is why it has a job of its own
  # and a timeout of its own. It fails when a lane fails or plans nothing.
  production-wave:
    needs: tools
    name: Production wave
    runs-on: ubuntu-26.04
    # Measured 37 minutes (the projects lane dominates), plus half.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: ./.github/actions/gate-tools
        with:
          variant: production
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: ./.github/actions/link-with-mold
      # The resolve homes are not cached between runs: the packed tree is
      # 13.9 GB against the repository's 10 GB Actions allowance, and a run
      # that restored it resolved no faster than a cold one (#1409).
      - run: scripts/production-wave.sh
        env:
          STOW_PRODUCTION_WAVE_WORK_DIR: ${{ runner.temp }}/stow-production-wave
          # Full projects lane: 29m51s at 16 workers (run 41703355413);
          # four workers had not completed the list after 55 minutes.
          STOW_RESOLVE_CONCURRENCY: 16
      # The count is the run's number — kept on a pass too; the monthly
      # projection job downloads it.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: production-wave
          path: ${{ runner.temp }}/stow-production-wave/production-wave.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() || cancelled()
        with:
          name: production-wave-logs
          path: |
            ${{ runner.temp }}/stow-production-wave/logs
            ${{ runner.temp }}/stow-production-wave/lanes/*/stderr.log
            ${{ runner.temp }}/stow-production-wave/lanes/*/exit
          if-no-files-found: ignore

  # The monthly projection (stow#452, stow#775): what a month costs each
  # Cloudflare product against its allowance: 90% for DO requests, 80%
  # for every other dimension. It needs the three
  # measurements, so it runs after them: user traffic from the
  # traffic-cost job's budget and Worker CPU reports at the launch
  # model's rates, plus the preheat from the preheat-cost job's report —
  # one full wave per stable rustc release (the cadence `launch-model.toml`
  # records from Rust's release history) and one resubmit per day, at the
  # node count the production-wave job counted. `stow-admin traffic-cost
  # project` prints the traffic, preheat and total beside the bound for
  # each product and fails when any total is over it.
  projection:
    needs:
      - tools
      - traffic-cost
      - preheat-cost
      - production-wave
    name: Monthly projection
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: ./.github/actions/gate-tools
        with:
          variant: production
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: traffic-cost-reports
          path: ${{ runner.temp }}/traffic-cost-reports
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preheat-cost-report
          path: ${{ runner.temp }}/preheat-cost-report
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-wave
          path: ${{ runner.temp }}/production-wave
      - run: |
          "$STOW_GATE_BIN_DIR/stow-admin" traffic-cost project \
            --small "$RUNNER_TEMP/traffic-cost-reports/budget-small.json" \
            --after "$RUNNER_TEMP/traffic-cost-reports/budget-after.json" \
            --cpu "$RUNNER_TEMP/traffic-cost-reports/worker-cpu.json" \
            --preheat "$RUNNER_TEMP/preheat-cost-report/preheat-cost-report.json" \
            --production "$RUNNER_TEMP/production-wave/production-wave.json" \
            --model launch-model.toml

  # One verdict for the certification, built like test.yml's `CI gate`: it
  # needs every leg, `if: always()` runs it past a failed or cancelled need,
  # and the verdict reads `needs.*.result` so such a leg turns the gate red.
  # `release-pr` and the nightly report read it.
  gate:
    needs:
      - tools
      - mock-e2e
      - traffic-cost
      - preheat-cost
      - production-wave
      - projection
    if: always() && github.ref_type != 'tag'
    name: Release gate
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The gate covers every job only because it needs every job; a new
      # job that forgets to join `needs:` would certify ungated. Read the
      # workflow itself and fail if any job other than this one, the
      # trampoline and the jobs that need the gate — so the gate cannot
      # need them — is absent from the list.
      - name: Needs covers every job
        run: |
          needed=$(yq '.jobs.gate.needs.[]' .github/workflows/release-gate.yml | sort)
          declared=$(yq '.jobs | keys.[]' .github/workflows/release-gate.yml | sort | grep -vx -e gate -e trampoline -e release-pr -e nightly-report)
          if [ "$needed" != "$declared" ]; then
            diff <(echo "$declared") <(echo "$needed") || true
            echo "Release gate needs: must name every other job in release-gate.yml" >&2
            exit 1
          fi
      - name: Every leg succeeded or skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e '[.[].result] | all(. == "success" or . == "skipped")' > /dev/null

  # A passed gate certifies the commit: release-plz opens the release PR from
  # it and the `Certified` status is set on it. The release PR's head is the
  # certified commit plus the version bump, and `release-plz.yml` releases
  # that head only. The release PR App's token opens the PR so its own
  # checks run; the status is written with the run's GITHUB_TOKEN, the one
  # identity the release job accepts it from.
  release-pr:
    needs: gate
    if: needs.gate.result == 'success'
    name: Release PR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      statuses: write # the Certified status
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.STOW_APP_ID }}
          private-key: ${{ secrets.STOW_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: release-plz@0.3.169
      - name: Open the release PR from the certified commit
        env:
          CERTIFIED_SHA: ${{ inputs.sha || github.sha }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          STATUS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/release-pr.sh "$CERTIFIED_SHA"

  # The nightly run alone (`nightly=true`, set by the trampoline), after the
  # gate: a failure comments on the open `nightly` issue — filing one when
  # none is open — and a pass closes every open one. It needs the legs and
  # the gate so `needs` carries their results; `if: always()` because a
  # failed leg must not silence it. The gate's needs-cover check exempts
  # this job.
  nightly-report:
    needs:
      - mock-e2e
      - traffic-cost
      - preheat-cost
      - production-wave
      - projection
      - gate
    if: always() && inputs.nightly
    name: Nightly report
    runs-on: ubuntu-26.04
    permissions:
      issues: write
    steps:
      - name: Report the nightly result
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEEDS: ${{ toJSON(needs) }}
          CERTIFIED_SHA: ${{ inputs.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          failed=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')
          open_issues=$(gh issue list --label nightly --state open --json number --jq '.[].number')
          if [ -n "$failed" ]; then
            body=$(printf 'Nightly release gate failed on commit %s.\n\nFailed jobs: %s\nRun: %s\n' "$CERTIFIED_SHA" "$failed" "$RUN_URL")
            if [ -n "$open_issues" ]; then
              gh issue comment "$(echo "$open_issues" | head -n 1)" --body "$body"
            else
              gh issue create --title "Nightly release gate failed" --label nightly --body "$body"
            fi
          elif [ -n "$open_issues" ]; then
            body=$(printf 'Nightly release gate passed on commit %s.\n\nRun: %s\n' "$CERTIFIED_SHA" "$RUN_URL")
            while read -r issue; do
              gh issue comment "$issue" --body "$body"
              gh issue close "$issue"
            done <<< "$open_issues"
          fi
