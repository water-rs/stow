name: Index publish cron

# Scheduled and `workflow_run` workflows run on the default branch (`dev`),
# but the artifact index must be signed under
# `index-publish.yml@refs/heads/main`
# (`stow_types::trusted_builder::INDEX_CERTIFICATE_IDENTITY`), so this
# lane only ticks: it dispatches `index-publish.yml` on `main`, the same
# way `preheat-cron.yml` dispatches the admin lane.
#
# The tick is event-driven: every completed `build-crate` run — the only
# thing that lands records in GHCR — dispatches a publish, so a newly
# pushed records artifact reaches the index within one publish run. The
# schedule is the backstop for a `workflow_run` event GitHub failed to
# deliver; GitHub delivers `*/10` ticks hours apart on
# this repository, so it cannot be the primary trigger.

on:
  workflow_run:
    workflows: [build-crate]
    types: [completed]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  # `gh workflow run` mints the dispatch with the run's own GITHUB_TOKEN.
  actions: write

# A wave of build completions queues one dispatch per run; a pending tick
# is superseded by the next, and `index-publish.yml`'s own concurrency
# group collapses the dispatches into at most one queued publish.
concurrency:
  group: index-publish-cron
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The edge URL rides the dispatch input: configured, the publish
      # run syncs the D1 catalog and reports each slice; unset, it
      # publishes the index and skips both — the workflow never probes.
      # A `workflow_run` tick also forwards the rustc the completed run's
      # `<rustc>-<task_id>` title names; a schedule or manual tick leaves
      # the input empty and index-publish takes the stable channel.
      - name: Dispatch index-publish on main
        env:
          GH_TOKEN: ${{ github.token }}
          STOW_EDGE_URL: ${{ vars.STOW_EDGE_URL }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_TITLE: ${{ github.event.workflow_run.display_title }}
        run: |
          set -euo pipefail
          args=(--repo "$GITHUB_REPOSITORY" --ref main -f stow_edge_url="$STOW_EDGE_URL")
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            args+=(-f "rustc_version=${RUN_TITLE%%-*}")
          fi
          gh workflow run index-publish.yml "${args[@]}"
