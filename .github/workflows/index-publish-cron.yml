name: Index publish cron

# Scheduled and `workflow_run` workflows run on the default branch (`dev`),
# but the artifact index must be signed under
# `index-publish.yml@refs/heads/main`
# (`stow_types::trusted_builder::INDEX_CERTIFICATE_IDENTITY`), so this
# lane only ticks: it dispatches `index-publish.yml` on `main`, the same
# way `preheat-cron.yml` dispatches the admin lane.
#
# The tick is event-driven: every completed `build-crate` run — the only
# thing that changes the catalog — dispatches a publish, so a freshly
# registered artifact reaches the index within one publish run. The
# schedule is the backstop for catalog changes that arrive any other way
# (backfills, pruned rows); GitHub delivers `*/10` ticks hours apart on
# this repository, so it cannot be the primary trigger.

on:
  workflow_run:
    workflows: [build-crate]
    types: [completed]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  # `gh workflow run` mints the dispatch with the run's own GITHUB_TOKEN.
  actions: write

# A wave of build completions queues one dispatch per run; a pending tick
# is superseded by the next, and `index-publish.yml`'s own concurrency
# group collapses the dispatches into at most one queued publish.
concurrency:
  group: index-publish-cron
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch index-publish on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run index-publish.yml --repo "$GITHUB_REPOSITORY" --ref main
