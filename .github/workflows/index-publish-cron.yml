name: Index publish cron

# `workflow_run` workflows run on the default branch, but the artifact
# index must be signed under `index-publish.yml@refs/tags/v<semver>`
# (`stow_types::trusted_builder`), so this lane only ticks: it
# dispatches `index-publish.yml` on the release tag of the build run
# that completed (a `workflow_run` tick) or on its own tag (a dispatched
# tick), the same way `preheat-cron.yml` dispatches the admin lane.
#
# The tick is event-driven: every completed `build-crate` run — the only
# thing that lands records in GHCR — dispatches a publish, so a newly
# pushed records artifact reaches the index within one publish run. The
# edge Cron Trigger is the backstop for a `workflow_run` event GitHub
# failed to deliver (`*/10 * * * *`, dispatched on the edge's release tag through
# `STOW_PERIODIC_WORKFLOWS`, stow#1121): GitHub's own `schedule`
# delivered those ticks hours apart, so it cannot be the primary trigger.

on:
  workflow_run:
    workflows: [build-crate]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  # Dispatch with the run's own GITHUB_TOKEN.
  actions: write

# Keep the active dispatch alive during a wave of build completions.
# GitHub supersedes only the pending tick; `index-publish.yml`'s own
# concurrency group likewise retains one running and one pending publish.
concurrency:
  group: index-publish-cron
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A configured edge URL turns the publish run's `report` on: it
      # reports each slice to the scheduler; unset, it publishes the
      # index and skips reporting — the workflow never probes.
      # A `workflow_run` tick also forwards the rustc the completed run's
      # `<rustc>-<task_id>` title names; a Cron Trigger or manual tick leaves
      # the input empty and index-publish takes the stable channel.
      - name: Dispatch index-publish on the release tag
        env:
          GH_TOKEN: ${{ github.token }}
          STOW_EDGE_URL: ${{ vars.STOW_EDGE_URL }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_TITLE: ${{ github.event.workflow_run.display_title }}
          # A tag-triggered run's `head_branch` is the tag name.
          RUN_REF: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            ref="$RUN_REF"
          else
            ref="$GITHUB_REF_NAME"
          fi
          args=(--method POST -f "ref=$ref")
          if [ -n "$STOW_EDGE_URL" ]; then
            args+=(-f 'inputs[report]=true')
          fi
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            args+=(-f "inputs[rustc_version]=${RUN_TITLE%%-*}")
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/index-publish.yml/dispatches" "${args[@]}"
