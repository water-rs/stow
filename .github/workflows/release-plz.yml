name: Release

# A release ships the release PR's head commit: the certified commit plus
# release-plz's version bump (release-gate.yml opens the PR from a commit that
# passed the gate and sets its `Certified` status). The merge of that PR into
# `main` starts this workflow; `release` resolves the PR's head commit H,
# requires H to be exactly one commit on a certified parent, checks H out and
# lets release-plz publish the crates and push the release tags at H. Nothing
# merged to `main` after the certification is in H, so nothing ships
# uncertified. Any other push to `main` releases nothing.
on:
  push:
    branches: [main]

permissions: {}

concurrency: release-plz-${{ github.ref_name }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # The release App's key lives in this environment, which admits `main`
    # only, and only the release App may create the protected `v*` tags.
    environment: release
    permissions:
      contents: read
      pull-requests: read # the PR a pushed commit merged
      statuses: read # the Certified status
      id-token: write # crates.io trusted publishing
    steps:
      # Identifies the App that opens release PRs; the token reads nothing
      # but the App's own metadata.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: pr-app
        with:
          app-id: ${{ vars.STOW_APP_ID }}
          private-key: ${{ secrets.STOW_APP_PRIVATE_KEY }}
          permission-metadata: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the certified release commit
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR_AUTHOR: ${{ steps.pr-app.outputs.app-slug }}[bot]
        run: scripts/release-resolve.sh "$GITHUB_SHA"
      # The tag is created with the release App's token: the `v*` tag ruleset
      # admits that App alone, and a tag created by an App installation token
      # (unlike GITHUB_TOKEN) starts the dist, toolchain and deploy runs.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: release-app
        if: steps.resolve.outputs.head != ''
        with:
          app-id: ${{ vars.STOW_RELEASE_APP_ID }}
          private-key: ${{ secrets.STOW_RELEASE_APP_PRIVATE_KEY }}
      - name: Check out the release commit
        if: steps.resolve.outputs.head != ''
        env:
          RELEASE_HEAD: ${{ steps.resolve.outputs.head }}
        run: git checkout --detach "$RELEASE_HEAD"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        if: steps.resolve.outputs.head != ''
        with:
          toolchain: stable
      # Mint a short-lived crates.io token from the GitHub OIDC identity
      # instead of a stored CARGO_REGISTRY_TOKEN. Trusted publishing is
      # configured per crate on crates.io; a crate that has never been
      # published cannot be configured, so the step stays non-blocking
      # until the first `cargo publish` bootstrap lands it.
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: crates-io-auth
        if: steps.resolve.outputs.head != ''
        continue-on-error: true
      - uses: MarcoIeni/release-plz-action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        if: steps.resolve.outputs.head != ''
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.release-app.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
