name: Preheat popular crates

# Submit build tasks for the most-downloaded crates directly to the
# scheduler, which the public admission path cannot reach: `Preheat` walks
# real repositories and enqueues what their graphs miss, while this lane
# seeds the base pool every project draws from. It authenticates to the
# edge with its own Actions OIDC identity, so it is `workflow_dispatch`
# only.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: How many crates to enqueue per target.
        required: false
        default: "100"
      rustc_version:
        description: >-
          Stable rustc the tasks target. Must match the channel the
          scheduler resolves, or the artifacts serve nothing.
        required: true
      top_binaries:
        description: >-
          Also seed the top-N binary crates, each built against its own
          published Cargo.lock so the whole closure a user installing
          that binary compiles lands in the cache.
        type: boolean
        required: false
        default: true
      targets:
        description: >-
          Space-separated target triples to enqueue. Defaults to
          `stow_types::CI_TARGET_TRIPLES` — every target waterui builds
          for.
        required: false
        default: >-
          aarch64-apple-darwin aarch64-apple-ios
          aarch64-apple-ios-sim aarch64-linux-android
          x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
          x86_64-pc-windows-msvc aarch64-pc-windows-msvc
          wasm32-unknown-unknown

permissions:
  contents: read
  # Mints the run's OIDC token — the edge accepts any workflow OIDC minted
  # inside water-rs/stow for the scheduler endpoints.
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  preheat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
      - name: Build stow-admin
        run: cargo build --release -p stow-admin
      # stow-admin sends GH_TOKEN as its edge bearer; the run's OIDC JWT is
      # JWT-shaped, so the edge validates it on the OIDC path and the
      # RepoWriter policy admits any workflow inside the trusted repo.
      - name: Mint the edge OIDC token
        env:
          STOW_OIDC_AUDIENCE: ${{ vars.STOW_OIDC_AUDIENCE }}
        run: |
          set -euo pipefail
          audience="$(jq -rn --arg a "$STOW_OIDC_AUDIENCE" '$a|@uri')"
          token="$(curl -fsS "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$audience" \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            -H 'Accept: application/json' | jq -r .value)"
          echo "::add-mask::$token"
          echo "GH_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Enqueue the top crates and the top binaries
        env:
          STOW_EDGE_URL: ${{ vars.STOW_EDGE_URL }}
          LIMIT: ${{ inputs.limit }}
          RUSTC_VERSION: ${{ inputs.rustc_version }}
          TOP_BINARIES: ${{ inputs.top_binaries }}
          TARGETS: ${{ inputs.targets }}
        # One target's failure must not cost the rest of the fleet their
        # wave: the crates.io lookups this walks are a few hundred requests
        # per target, so a single transient error would otherwise drop every
        # later triple. Failures are collected and reported at the end, and
        # the next daily wave re-submits whatever this one missed.
        run: |
          set -uo pipefail
          failed=""
          for target in $TARGETS; do
            echo "::group::$target"
            if ! ./target/release/stow-admin preheat top \
              --target "$target" --rustc-version "$RUSTC_VERSION" --limit "$LIMIT" --yes; then
              echo "::error::preheat top failed for $target"
              failed="$failed $target(top)"
            fi
            if [ "$TOP_BINARIES" = "true" ]; then
              if ! ./target/release/stow-admin preheat top-binaries \
                --target "$target" --rustc-version "$RUSTC_VERSION" --limit "$LIMIT" --yes; then
                echo "::error::preheat top-binaries failed for $target"
                failed="$failed $target(top-binaries)"
              fi
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::preheat incomplete:$failed"
            exit 1
          fi
