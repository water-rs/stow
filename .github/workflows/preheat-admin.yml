name: Preheat popular crates

# Submit build tasks for the most-downloaded crates directly to the
# scheduler, which the public admission path cannot reach: `Preheat` walks
# real repositories and enqueues what their graphs miss, while this lane
# seeds the base pool every project draws from. It authenticates to the
# edge with its own Actions OIDC identity, so it is `workflow_dispatch`
# only.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: How many crates to enqueue per target.
        required: false
        default: "100"
      rustc_version:
        description: >-
          Stable rustc the tasks target. Must match the channel the
          scheduler resolves, or the artifacts serve nothing.
        required: true
      top_binaries:
        description: >-
          Also seed the top-N binary crates' resolves: the edge
          fetches each `.crate` tarball and runs cargo's resolver per
          target — every crates.io node an ordinary crate task
          carrying its crates.io edges as `depends_on`.
        type: boolean
        required: false
        default: true
      targets:
        description: >-
          Space-separated target triples to enqueue. Defaults to
          `stow_types::CI_TARGET_TRIPLES` — every target waterui builds
          for.
        required: false
        default: >-
          aarch64-apple-darwin aarch64-apple-ios
          aarch64-apple-ios-sim aarch64-linux-android
          x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
          x86_64-pc-windows-msvc aarch64-pc-windows-msvc
          wasm32-unknown-unknown
      projects:
        description: >-
          Also submit the projects lane: for every repository the
          reviewed `preheat/projects.toml` lists, the edge fetches the
          codeload tarball, drops the committed Cargo.lock so cargo
          re-resolves the latest semver-compatible versions, and
          enqueues its crates.io graph — ordinary crate tasks carrying
          their crates.io edges as `depends_on`.
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  # Mints the run's OIDC token — the edge accepts any workflow OIDC minted
  # inside water-rs/stow for the scheduler endpoints.
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  preheat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
      - name: Build stow-admin
        run: cargo build --release -p stow-admin
      # stow-admin mints a fresh Actions OIDC JWT for every edge request
      # — a lane that resolves a few hundred sources outlives one token's
      # ~10-minute lifetime. The JWT shape is how the edge tells the OIDC
      # caller apart, and the RepoWriter policy admits any workflow
      # inside the trusted repo.
      - name: Enqueue the top crates and the top binaries
        env:
          STOW_EDGE_URL: ${{ vars.STOW_EDGE_URL }}
          STOW_OIDC_AUDIENCE: ${{ vars.STOW_OIDC_AUDIENCE }}
          LIMIT: ${{ inputs.limit }}
          RUSTC_VERSION: ${{ inputs.rustc_version }}
          TOP_BINARIES: ${{ inputs.top_binaries }}
          TARGETS: ${{ inputs.targets }}
        # The ranked list and each crate's detail are walked once for the
        # whole matrix — one crates.io pass at the crawler's pace rather
        # than nine.
        run: |
          set -uo pipefail
          failed=""
          if ! ./target/release/stow-admin preheat top \
            --targets "${TARGETS// /,}" --rustc-version "$RUSTC_VERSION" --limit "$LIMIT" --yes; then
            echo "::error::preheat top failed"
            failed="$failed (top)"
          fi
          # One tarball per binary resolves the whole matrix, so this
          # lane is one invocation rather than nine.
          if [ "$TOP_BINARIES" = "true" ]; then
            if ! ./target/release/stow-admin preheat top-binaries \
              --targets "${TARGETS// /,}" --rustc-version "$RUSTC_VERSION" --limit "$LIMIT" --yes; then
              echo "::error::preheat top-binaries failed"
              failed="$failed (top-binaries)"
            fi
          fi
          if [ -n "$failed" ]; then
            echo "::error::preheat incomplete:$failed"
            exit 1
          fi
      - name: Enqueue the projects lane
        # A top-lane failure is a skip signal for that step, not a reason
        # to drop this lane — the top step's own contract is that one
        # target's failure never costs the fleet its wave. `!cancelled()`
        # keeps only a real cancellation from running it.
        if: ${{ !cancelled() && inputs.projects }}
        env:
          STOW_EDGE_URL: ${{ vars.STOW_EDGE_URL }}
          STOW_OIDC_AUDIENCE: ${{ vars.STOW_OIDC_AUDIENCE }}
          RUSTC_VERSION: ${{ inputs.rustc_version }}
          TARGETS: ${{ inputs.targets }}
        # One codeload tarball per repository resolved in the edge, and
        # each repository's tasks post right after it resolves — a token
        # or network failure mid-lane keeps everything before it.
        run: |
          set -euo pipefail
          ./target/release/stow-admin preheat projects submit \
            --file preheat/projects.toml --rustc-version "$RUSTC_VERSION" \
            --targets "${TARGETS// /,}" --yes
