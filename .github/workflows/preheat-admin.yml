name: Preheat popular crates

# Submit build tasks for the most-downloaded crates directly to the
# scheduler, which the public admission path cannot reach: `Preheat` walks
# real repositories and enqueues what their graphs miss, while this lane
# seeds the base pool every project draws from. It authenticates to the
# edge with its own Actions OIDC identity, so it is `workflow_dispatch`
# only.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: How many crates to enqueue per target.
        required: false
        default: "100"
      rustc_version:
        description: >-
          Stable rustc the tasks target. Must match the channel the
          scheduler resolves, or the artifacts serve nothing.
        required: true
      targets:
        description: >-
          Space-separated target triples to enqueue. Defaults to
          `stow_types::CI_TARGET_TRIPLES` — every target waterui builds
          for.
        required: false
        default: >-
          aarch64-apple-darwin aarch64-apple-ios
          aarch64-apple-ios-sim aarch64-linux-android
          x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
          x86_64-pc-windows-msvc aarch64-pc-windows-msvc
          wasm32-unknown-unknown
      projects:
        description: >-
          Also submit the projects lane: for every repository the
          reviewed `preheat/projects.toml` lists, stow-admin fetches
          the codeload tarball, drops the committed Cargo.lock so
          cargo re-resolves the latest semver-compatible versions, and
          enqueues its crates.io graph — ordinary crate tasks carrying
          their crates.io edges as `depends_on`.
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  # Mints the run's OIDC token — the edge's submit routes admit this
  # workflow's runs on main.
  id-token: write

env:
  CARGO_TERM_COLOR: always
  # The lanes' shared resolve root — each lane's workers shard their
  # CARGO_HOMEs under it; cached whole below so the sparse crates.io
  # index and fetched manifests stay warm between dispatches.
  STOW_RESOLVE_CARGO_HOME: ${{ github.workspace }}/.stow-preheat-cargo

jobs:
  preheat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The scheduler dispatches this workflow on a newreleases.io
      # delivery that only claims a version (stow#880) — the official
      # channel manifest is the authority, so the input is confirmed
      # before a toolchain installs or a resolve spends anything. A
      # forged or stale delivery costs exactly this check.
      - name: Confirm the input is the live stable rustc
        env:
          RUSTC_VERSION: ${{ inputs.rustc_version }}
        run: |
          set -euo pipefail
          version="$(curl -fsS https://static.rust-lang.org/dist/channel-rust-stable.toml \
            | python3 -c 'import sys, tomllib; print(tomllib.load(sys.stdin.buffer)["pkg"]["rust"]["version"].split()[0])')"
          if [ "$version" != "$RUSTC_VERSION" ]; then
            echo "::error::dispatched for rustc $RUSTC_VERSION, but the stable channel serves $version"
            exit 1
          fi
      # Resolution runs in-process now: stow-resolver probes `rustc -vV`
      # and `--print cfg`, so the toolchain must be the same version the
      # tasks target, not floating `stable`.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ inputs.rustc_version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
      # One cache entry per UTC day per rustc: the key lands once a day,
      # `actions/cache` skips the save on an exact-key hit, and the
      # restore-key prefixes hand every run the most recent index — the
      # repo's 10 GB Actions allowance is not spent on per-request saves.
      - name: Cache stamp
        id: cache-stamp
        run: echo "day=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.STOW_RESOLVE_CARGO_HOME }}
          key: preheat-cargo-${{ runner.os }}-${{ inputs.rustc_version }}-${{ steps.cache-stamp.outputs.day }}
          restore-keys: |
            preheat-cargo-${{ runner.os }}-${{ inputs.rustc_version }}-
            preheat-cargo-${{ runner.os }}-
      - name: Build stow-admin
        run: cargo build --release -p stow-admin
      # stow-admin mints a fresh Actions OIDC JWT for every edge request
      # — a lane that resolves a few hundred sources outlives one token's
      # ~10-minute lifetime. The JWT shape is how the edge tells the OIDC
      # caller apart, and the submit routes admit this workflow on main.
      - name: Enqueue the top binary crates
        env:
          STOW_EDGE_URL: ${{ vars.STOW_EDGE_URL }}
          STOW_OIDC_AUDIENCE: ${{ vars.STOW_OIDC_AUDIENCE }}
          LIMIT: ${{ inputs.limit }}
          RUSTC_VERSION: ${{ inputs.rustc_version }}
          TARGETS: ${{ inputs.targets }}
          # Resolver scratch (source trees, submodules) goes on the
          # runner's disk: /tmp is size-capped on the image (#972).
          TMPDIR: ${{ runner.temp }}
        # The lane fetches the crates.io database dump once — the
        # ranking and the binary check come from it — then resolves one
        # `.crate` tarball per binary for the whole matrix, so the lane
        # is one invocation rather than nine.
        run: |
          set -euo pipefail
          ./target/release/stow-admin preheat top-binaries \
            --targets "${TARGETS// /,}" --rustc-version "$RUSTC_VERSION" --limit "$LIMIT" --yes
      - name: Enqueue the projects lane
        # A top-lane failure is a skip signal for that step, not a reason
        # to drop this lane — the top step's own contract is that one
        # target's failure never costs the fleet its wave. `!cancelled()`
        # keeps only a real cancellation from running it.
        if: ${{ !cancelled() && inputs.projects }}
        env:
          STOW_EDGE_URL: ${{ vars.STOW_EDGE_URL }}
          STOW_OIDC_AUDIENCE: ${{ vars.STOW_OIDC_AUDIENCE }}
          RUSTC_VERSION: ${{ inputs.rustc_version }}
          TARGETS: ${{ inputs.targets }}
          TMPDIR: ${{ runner.temp }}
        # One codeload tarball per repository resolved in-process, and
        # each repository's tasks post right after it resolves — a token
        # or network failure mid-lane keeps everything before it.
        run: |
          set -euo pipefail
          ./target/release/stow-admin preheat projects submit \
            --file preheat/projects.toml --rustc-version "$RUSTC_VERSION" \
            --targets "${TARGETS// /,}" --yes