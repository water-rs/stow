name: Preheat popular crates

# Submit build tasks for the most-downloaded crates directly to the
# scheduler, which the public admission path cannot reach: `Preheat` walks
# real repositories and enqueues what their graphs miss, while this lane
# seeds the base pool every project draws from. It holds the scheduler
# token, so it is `workflow_dispatch` only.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: How many crates to enqueue per target.
        required: false
        default: "100"
      rustc_version:
        description: >-
          Stable rustc the tasks target. Must match the channel the
          scheduler resolves, or the artifacts serve nothing.
        required: true
      overlay:
        description: Also seed the binary overlay (built with --locked).
        type: boolean
        required: false
        default: true
      targets:
        description: >-
          Space-separated target triples to enqueue. Defaults to
          `stow_types::CI_TARGET_TRIPLES` — every target waterui builds
          for.
        required: false
        default: >-
          aarch64-apple-darwin x86_64-apple-darwin aarch64-apple-ios
          aarch64-apple-ios-sim aarch64-linux-android
          armv7-linux-androideabi x86_64-linux-android
          x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
          x86_64-pc-windows-msvc aarch64-pc-windows-msvc
          wasm32-unknown-unknown
      project:
        description: >-
          Repository name under water-rs to seed as a project-source task
          per target (e.g. `waterui`). The runner clones the repo and
          builds its workspace against its own Cargo.lock, so captured
          artifacts carry the dependency c_metadata chain the project's
          consumers compute. Empty skips project seeding.
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  preheat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Build stow-admin
        run: cargo build --release -p stow-admin
      - name: Enqueue the library base pool and the binary overlay
        env:
          STOW_EDGE_URL: ${{ vars.STOW_EDGE_URL }}
          SCHEDULER_AUTH_TOKEN: ${{ secrets.STOW_SCHEDULER_AUTH_TOKEN }}
          LIMIT: ${{ inputs.limit }}
          RUSTC_VERSION: ${{ inputs.rustc_version }}
          OVERLAY: ${{ inputs.overlay }}
          TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          for target in $TARGETS; do
            echo "::group::$target"
            ./target/release/stow-admin preheat-t100 \
              --target "$target" --rustc-version "$RUSTC_VERSION" --limit "$LIMIT"
            if [ "$OVERLAY" = "true" ]; then
              ./target/release/stow-admin preheat-binary-overlay \
                --target "$target" --rustc-version "$RUSTC_VERSION" --limit "$LIMIT"
            fi
            echo "::endgroup::"
          done

      # Project-source seeding submits one task per target whose source is
      # the repository itself pinned at HEAD — the runner's build resolves
      # against the project's own Cargo.lock.
      - name: Seed the project's lockfile-resolved artifacts
        if: inputs.project != ''
        env:
          STOW_EDGE_URL: ${{ vars.STOW_EDGE_URL }}
          SCHEDULER_AUTH_TOKEN: ${{ secrets.STOW_SCHEDULER_AUTH_TOKEN }}
          RUSTC_VERSION: ${{ inputs.rustc_version }}
          TARGETS: ${{ inputs.targets }}
          PROJECT: ${{ inputs.project }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/project-seed"
          git clone --quiet --depth 1 "https://github.com/water-rs/$PROJECT.git" "$dir"
          commit="$(git -C "$dir" rev-parse HEAD)"
          for target in $TARGETS; do
            echo "::group::$PROJECT ($target)"
            ./target/release/stow-admin preheat-binary-overlay \
              --target "$target" --rustc-version "$RUSTC_VERSION" \
              --manifest-path "$dir/Cargo.toml" \
              --repo "https://github.com/water-rs/$PROJECT.git" \
              --commit "$commit"
            echo "::endgroup::"
          done
