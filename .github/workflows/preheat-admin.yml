name: Preheat popular crates

# Submit build tasks for the most-downloaded crates directly to the
# scheduler, which the public admission path cannot reach: `Preheat` walks
# real repositories and enqueues what their graphs miss, while this lane
# seeds the base pool every project draws from. It authenticates to the
# edge with its own Actions OIDC identity, so it is `workflow_dispatch`
# only.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: How many crates to enqueue per target.
        required: false
        default: "100"
      rustc_version:
        description: >-
          Stable rustc the tasks target. Must match the channel the
          scheduler resolves, or the artifacts serve nothing.
        required: true
      overlay:
        description: Also seed the binary overlay (built with --locked).
        type: boolean
        required: false
        default: true
      targets:
        description: >-
          Space-separated target triples to enqueue. Defaults to
          `stow_types::CI_TARGET_TRIPLES` — every target waterui builds
          for.
        required: false
        default: >-
          aarch64-apple-darwin aarch64-apple-ios
          aarch64-apple-ios-sim aarch64-linux-android
          x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
          x86_64-pc-windows-msvc aarch64-pc-windows-msvc
          wasm32-unknown-unknown
      project:
        description: >-
          Repository name under water-rs to seed as a project-source task
          per target (e.g. `waterui`). The runner clones the repo and
          builds its workspace against its own Cargo.lock, so captured
          artifacts carry the dependency c_metadata chain the project's
          consumers compute. Empty skips project seeding.
        required: false
        default: ""
      projects_file:
        description: >-
          Path to the checked-in showcase list (`preheat/projects.toml`):
          one project-source task per `[[project]]` entry per target,
          each resolved to an immutable commit at dispatch time. Empty
          skips the file; a missing file skips the step.
        required: false
        default: "preheat/projects.toml"

permissions:
  contents: read
  # Mints the run's OIDC token — the edge accepts any workflow OIDC minted
  # inside water-rs/stow for the scheduler endpoints.
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  preheat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
      - name: Build stow-admin
        run: cargo build --release -p stow-admin
      # stow-admin sends GH_TOKEN as its edge bearer; the run's OIDC JWT is
      # JWT-shaped, so the edge validates it on the OIDC path and the
      # RepoWriter policy admits any workflow inside the trusted repo.
      - name: Mint the edge OIDC token
        env:
          STOW_OIDC_AUDIENCE: ${{ vars.STOW_OIDC_AUDIENCE }}
        run: |
          set -euo pipefail
          audience="$(jq -rn --arg a "$STOW_OIDC_AUDIENCE" '$a|@uri')"
          token="$(curl -fsS "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$audience" \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            -H 'Accept: application/json' | jq -r .value)"
          echo "::add-mask::$token"
          echo "GH_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Enqueue the library base pool and the binary overlay
        env:
          STOW_EDGE_URL: ${{ vars.STOW_EDGE_URL }}
          LIMIT: ${{ inputs.limit }}
          RUSTC_VERSION: ${{ inputs.rustc_version }}
          OVERLAY: ${{ inputs.overlay }}
          TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          for target in $TARGETS; do
            echo "::group::$target"
            ./target/release/stow-admin preheat-t100 \
              --target "$target" --rustc-version "$RUSTC_VERSION" --limit "$LIMIT"
            if [ "$OVERLAY" = "true" ]; then
              ./target/release/stow-admin preheat-binary-overlay \
                --target "$target" --rustc-version "$RUSTC_VERSION" --limit "$LIMIT"
            fi
            echo "::endgroup::"
          done

      # The checked-in showcase list seeds one project-source task per
      # entry per target; `preheat-projects` resolves each repo's ref
      # policy to an immutable commit with `git ls-remote` before
      # submitting.
      - name: Seed the checked-in projects list
        if: inputs.projects_file != ''
        env:
          STOW_EDGE_URL: ${{ vars.STOW_EDGE_URL }}
          RUSTC_VERSION: ${{ inputs.rustc_version }}
          TARGETS: ${{ inputs.targets }}
          PROJECTS_FILE: ${{ inputs.projects_file }}
        run: |
          set -euo pipefail
          if [ ! -f "$PROJECTS_FILE" ]; then
            echo "::notice::$PROJECTS_FILE does not exist, skipped"
            exit 0
          fi
          for target in $TARGETS; do
            echo "::group::projects ($target)"
            ./target/release/stow-admin preheat-projects \
              --file "$PROJECTS_FILE" \
              --target "$target" --rustc-version "$RUSTC_VERSION"
            echo "::endgroup::"
          done

      # Project-source seeding submits one task per target whose source is
      # the repository itself pinned at HEAD — the runner's build resolves
      # against the project's own Cargo.lock.
      - name: Seed the project's lockfile-resolved artifacts
        if: inputs.project != ''
        env:
          STOW_EDGE_URL: ${{ vars.STOW_EDGE_URL }}
          RUSTC_VERSION: ${{ inputs.rustc_version }}
          TARGETS: ${{ inputs.targets }}
          PROJECT: ${{ inputs.project }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/project-seed"
          git clone --quiet --depth 1 "https://github.com/water-rs/$PROJECT.git" "$dir"
          commit="$(git -C "$dir" rev-parse HEAD)"
          for target in $TARGETS; do
            echo "::group::$PROJECT ($target)"
            ./target/release/stow-admin preheat-binary-overlay \
              --target "$target" --rustc-version "$RUSTC_VERSION" \
              --manifest-path "$dir/Cargo.toml" \
              --repo "https://github.com/water-rs/$PROJECT.git" \
              --commit "$commit"
            echo "::endgroup::"
          done
