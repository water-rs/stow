name: Registry gc

# Deletes every version of the `stow-cache` GHCR package that no kept
# toolchain's published state reaches (water-rs/stow#730): superseded
# index/folded manifests, records artifacts of dropped toolchains or
# superseded exports, the artifact and bundle manifests they name, and
# the cosign `sha256-<digest>[.sig]` signatures of deleted manifests —
# plus every untagged manifest a republish left behind.
#
# `--keep-rustc` is spelled out by the operator: a new stable's slices
# may not exist yet while the previous toolchain still serves users, so
# there is no default. `--delete` performs the deletions; without it the
# run only reports. A package version created or updated within the last
# 24 hours is never deleted — a build pushes its bundle before its
# records, so a fresh bundle is legitimately unreferenced for a while.
#
# The order after an index-format change: ship the release, run this
# with `--delete` for the rustc still serving, `index export --full` for
# that rustc, then this again to collect what the old format held.

on:
  workflow_dispatch:
    inputs:
      keep_rustc:
        description: "Space-separated rustc versions whose published state survives (e.g. \"1.98.1\")"
        required: true
        type: string
      delete:
        description: "Delete the garbage versions; unset only reports"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  # Deletes stow-cache package versions.
  packages: write

concurrency:
  group: registry-gc
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  gc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Refuse to run on any ref but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::registry-gc runs on refs/heads/main only; dispatched on ${{ github.ref }}"
          exit 1
      # A local action resolves from the workspace, so its directory has
      # to be checked out; nothing else in the tree is needed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      # stow-admin is pulled, not compiled — the same signed toolchain
      # artifact index-publish.yml pulls for this run's sha.
      - uses: ./.github/actions/stow-toolchain
        with:
          sha: ${{ github.sha }}
          binaries: stow-admin
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Garbage-collect the stow-cache package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_RUSTC: ${{ inputs.keep_rustc }}
          DELETE: ${{ inputs.delete }}
        run: |
          set -euo pipefail
          args=()
          for rustc in $KEEP_RUSTC; do
            args+=(--keep-rustc "$rustc")
          done
          if [ "$DELETE" = "true" ]; then
            args+=(--delete)
          fi
          stow-admin registry gc "${args[@]}" >> "$GITHUB_STEP_SUMMARY"
