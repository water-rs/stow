name: build-crate

# The scheduler dispatches this workflow on `main` with the whole task as one
# JSON input. Three jobs, two trust levels:
#
#   build          — compiles third-party code. Read-only token, no secrets,
#                    no OIDC. Everything it produces is handed over as a
#                    workflow artifact.
#   publish        — success path only. Never runs third-party code. Holds the
#                    GHCR token and the OIDC grant (`id-token: write`): the
#                    same grant that signs artifacts with cosign also mints
#                    the JWT the edge accepts on its trusted endpoints — there
#                    is no shared secret to hold. Validates the build output
#                    against the task and an independently resolved dependency
#                    closure before it pushes, signs, registers, or reports
#                    anything.
#   report-failure — the failure path. A bare runner holding only the OIDC
#                    grant: no checkout, no toolchain. It mints the same JWT
#                    and POSTs the failure report the publish stage used to
#                    send, so a failed build does not pay a Rust toolchain and
#                    a stow-build compile to deliver one HTTP request.
#
# The certificate identity clients trust is this file on refs/heads/main
# (stow_types::trusted_builder); dispatching any other ref produces artifacts
# no client accepts.

on:
  workflow_dispatch:
    inputs:
      task:
        description: JSON-encoded BuildTaskPayload
        required: true
        type: string

permissions: {}

concurrency:
  group: build-crate-${{ fromJSON(inputs.task).task_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

# Every target `stow_types::CI_TARGET_TRIPLES` builds for, mapped to the
# runner that carries its toolchain: Apple triples on macOS, Android and
# GNU/Linux cross triples on Ubuntu (the NDK lives under /usr/local, a GNU
# aarch64 toolchain installs via apt), Windows triples on Windows, wasm32
# anywhere since rust-lld ships with the toolchain. `runs-on` cannot read
# `env`, so the map is inline in both jobs.
jobs:
  build:
    name: build ${{ fromJSON(inputs.task).crate_name }} ${{ fromJSON(inputs.task).version }} (${{ fromJSON(inputs.task).target }})
    runs-on: ${{ fromJSON('{"aarch64-apple-darwin":"macos-14","aarch64-apple-ios":"macos-14","aarch64-apple-ios-sim":"macos-14","aarch64-linux-android":"ubuntu-latest","x86_64-unknown-linux-gnu":"ubuntu-latest","aarch64-unknown-linux-gnu":"ubuntu-latest","x86_64-pc-windows-msvc":"windows-latest","aarch64-pc-windows-msvc":"windows-latest","wasm32-unknown-unknown":"ubuntu-latest"}')[fromJSON(inputs.task).target] }}
    permissions:
      contents: read
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The build pins RUSTUP_TOOLCHAIN=<task.rustc_version>, which rustup
      # resolves as a distinct toolchain from `stable`; installing `stable`
      # here would leave the pinned toolchain without the target's std.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ fromJSON(inputs.task).rustc_version }}
          targets: ${{ fromJSON(inputs.task).target }}
      # This cache only warms the stow-build/stow-cli host compile below,
      # which is identical for every target on the same runner OS, so one
      # entry per OS serves the whole wave. Nothing under `target/` is
      # cached: the untrusted phase builds in its own per-run target
      # directory, and the host binaries live in the stow-bins cache.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: build-crate-${{ runner.os }}
          cache-targets: false
      # The sandboxed phases inherit these CARGO_TARGET_*/CC_*/AR_* variables
      # through stow-build's toolchain passthrough; a variable that is not set
      # for the task's target is simply absent there too.
      #
      # The linker a unit's artifacts pass through is part of its compile
      # key, so it is a choice this job makes, not an observation of the
      # runner image. GNU/Linux units link with mold — installed below and
      # selected for host and target units alike by the capture wrapper,
      # whose argv append is what lands the choice in the key — Android
      # through the NDK clang pinned here, Apple targets through Xcode's
      # `cc`, Windows through the MSVC toolchain lookup, and wasm32 through
      # the rust-lld the toolchain itself ships.
      - name: Configure the cross toolchain
        shell: bash
        env:
          TASK_TARGET: ${{ fromJSON(inputs.task).target }}
        run: |
          set -euo pipefail
          target_key="$(echo "$TASK_TARGET" | tr 'a-z-' 'A-Z_')"
          case "$TASK_TARGET" in
            *-linux-android*)
              # The API level in the NDK clang wrapper name is WaterUI's
              # android-min-api-level floor.
              ndk_bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
              linker="$ndk_bin/${TASK_TARGET}26-clang"
              for exe in "$linker" "${linker}++" "$ndk_bin/llvm-ar"; do
                [ -x "$exe" ] || { echo "::error::missing NDK tool $exe"; exit 1; }
              done
              cc_key="$(echo "$TASK_TARGET" | tr '-' '_')"
              {
                echo "CARGO_TARGET_${target_key}_LINKER=$linker"
                echo "CC_${cc_key}=$linker"
                echo "CXX_${cc_key}=${linker}++"
                echo "AR_${cc_key}=$ndk_bin/llvm-ar"
              } >> "$GITHUB_ENV"
              ;;
            x86_64-unknown-linux-gnu)
              # Native-target system libraries crate build scripts probe
              # through pkg-config — cros-libva needs libva.pc and the
              # libva headers, which the runner image does not ship.
              sudo apt-get update -qq
              sudo apt-get install -y --no-install-recommends libva-dev mold
              ;;
            aarch64-unknown-linux-gnu)
              sudo apt-get update -qq
              sudo apt-get install -y --no-install-recommends \
                gcc-aarch64-linux-gnu g++-aarch64-linux-gnu mold
              # `-fuse-ld=mold` asks collect2 for `ld.mold` on the cross
              # toolchain's own search path, which /usr/bin does not reach
              # — link the apt install's `ld.mold` in where it looks.
              sudo ln -sf /usr/bin/ld.mold /usr/aarch64-linux-gnu/bin/ld.mold
              {
                echo "CARGO_TARGET_${target_key}_LINKER=aarch64-linux-gnu-gcc"
                echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
                echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++"
                echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar"
              } >> "$GITHUB_ENV"
              ;;
            aarch64-apple-ios)
              echo "SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)" >> "$GITHUB_ENV"
              ;;
            aarch64-apple-ios-sim)
              echo "SDKROOT=$(xcrun --sdk iphonesimulator --show-sdk-path)" >> "$GITHUB_ENV"
              ;;
          esac
      # stow#336: rustc dlopen's proc-macros and linked dylibs on the
      # *user's* machine, so every ELF the cache serves must load on the
      # glibc floor stow promises — 2.28, the manylinux_2_28 / RHEL 8
      # baseline. A manylinux container would re-provision rustup, mold
      # and the runner toolchain on every run; the cheaper setup keeps
      # ubuntu-latest and redirects only *link-input resolution* to a
      # Debian buster (glibc 2.28) sysroot: twelve version-pinned,
      # sha256-verified debs — libc6/libc6-dev plus the gcc-8 runtime
      # libs and headers, amd64 and arm64 — extracted under
      # /opt/stow-glibc-2.28/<arch>, with `cc` wrappers that prepend the
      # sysroot's -L directories. Compilation keeps the host headers;
      # nothing about the sysroot enters rustc argv or the compile key,
      # and the mold pin still arrives inside "$@" (the capture wrapper
      # appends -C link-arg=-fuse-ld=mold). Host-loaded units on every
      # ubuntu leg are x86_64, so the x86_64 wrapper is exported
      # unconditionally; the aarch64 leg additionally wraps its cross
      # gcc, overriding the LINKER the configure step set.
      - name: Install the glibc-2.28 link sysroot
        if: runner.os == 'Linux'
        shell: bash
        env:
          TASK_TARGET: ${{ fromJSON(inputs.task).target }}
        run: |
          set -euo pipefail
          sysroot=/opt/stow-glibc-2.28
          sudo mkdir -p "$sysroot"
          mkdir -p "$RUNNER_TEMP/debs"
          cd "$RUNNER_TEMP/debs"
          glibc_base="https://snapshot.debian.org/archive/debian-security/20240630T105336Z/pool/updates/main/g/glibc"
          gcc_base="https://snapshot.debian.org/archive/debian/20190407T033332Z/pool/main/g/gcc-8"
          # url-path-with-escapes, package base name for local files, sha256, arch
          while IFS=' ' read -r url file sha; do
            curl -fsSL --retry 3 -o "$file" "$url"
            echo "$sha  $file" | sha256sum -c --quiet
          done <<DEBS
          $glibc_base/libc6_2.28-10%2Bdeb10u4_amd64.deb libc6_amd64.deb 80b59743f7b47f0644d211d56918851404e66ab7fbba17e60e90664c12fc5822
          $glibc_base/libc6-dev_2.28-10%2Bdeb10u4_amd64.deb libc6-dev_amd64.deb d759a8102b932dc51e3a25b8cc3b91f3718adda774b0c42b431117662b4750cc
          $glibc_base/libc6_2.28-10%2Bdeb10u4_arm64.deb libc6_arm64.deb 299556e1d1bf80617b417c82521f1f0bcb111933c40016fbe8a303b73e6a6a22
          $glibc_base/libc6-dev_2.28-10%2Bdeb10u4_arm64.deb libc6-dev_arm64.deb 353477d4bf9f766826231b30fde1a5941f177a4c5f27a60def988aaaca3c8437
          $gcc_base/libgcc1_8.3.0-6_amd64.deb libgcc1_amd64.deb b1bb7611f3372732889d502cb1d09fe572b5fbb5288a4a8b1ed0363fecc3555a
          $gcc_base/libgcc-8-dev_8.3.0-6_amd64.deb libgcc-8-dev_amd64.deb a52d5216858c7185bc245e52ad95a6ad515d087bc25e8556df06c5626b41a837
          $gcc_base/libstdc%2B%2B6_8.3.0-6_amd64.deb libstdc++6_amd64.deb 5cc70625329655ff9382580971d4616db8aa39af958b7c995ee84598f142a4ee
          $gcc_base/libstdc%2B%2B-8-dev_8.3.0-6_amd64.deb libstdc++-8-dev_amd64.deb 79965b74e6c839e7b90d24ac5b61840f57872ecb1e4ac1007937036c85364f82
          $gcc_base/libgcc1_8.3.0-6_arm64.deb libgcc1_arm64.deb 2851ac25d12958586c035de5ec4f2fc17272dec48f776dd0dd24c62f62674fd9
          $gcc_base/libgcc-8-dev_8.3.0-6_arm64.deb libgcc-8-dev_arm64.deb d8385c0106d4ac559ada75b162aecb9d507a67da3ac8742eb32258f501d07c7e
          $gcc_base/libstdc%2B%2B6_8.3.0-6_arm64.deb libstdc++6_arm64.deb 52cf36333a405867a079a695f6a37cb63558859d7d19cef40fc7d112c39fefd6
          $gcc_base/libstdc%2B%2B-8-dev_8.3.0-6_arm64.deb libstdc++-8-dev_arm64.deb bb30dd9591c956a7cfed8f5449d82756dbafa91cee644c7309cbe4fa0b9ddaa7
          DEBS
          for arch in x86_64 aarch64; do
            case "$arch" in
              x86_64) pkg=amd64; triplet=x86_64-linux-gnu; driver=cc;;
              aarch64) pkg=arm64; triplet=aarch64-linux-gnu; driver=aarch64-linux-gnu-gcc;;
            esac
            root="$sysroot/$arch"
            for deb in *_${pkg}.deb; do
              sudo dpkg-deb -x "$deb" "$root"
            done
            # GNU ld scripts carry absolute /lib and /usr/lib paths —
            # repoint them into the sysroot.
            for script in "$root/usr/lib/$triplet"/*.so "$root/lib/$triplet"/*.so; do
              if [ -f "$script" ] && [ ! -L "$script" ]; then
                sudo sed -i "s| /| $root/|g" "$script"
              fi
            done
            # Absolute symlinks (the dynamic loader, linker scripts)
            # resolve on the host — repoint them into the sysroot.
            sudo find "$root" -type l -lname '/*' | while read -r link; do
              sudo ln -sfn "$root$(readlink "$link")" "$link"
            done
            sudo mkdir -p "$sysroot/bin"
            sudo tee "$sysroot/bin/$arch-unknown-linux-gnu-cc" >/dev/null <<WRAPPER
          #!/bin/sh
          exec $driver -L$root/usr/lib/$triplet -L$root/lib/$triplet -L$root/lib64 -L$root/usr/lib/gcc/$triplet/8 "\$@"
          WRAPPER
            sudo chmod +x "$sysroot/bin/$arch-unknown-linux-gnu-cc"
          done
          # Host-loaded units on every ubuntu leg are x86_64 — the
          # proc-macro a wasm or android task compiles still dlopens on
          # the runner — so the x86_64 wrapper is always set; the aarch64
          # leg adds its cross wrapper for target units.
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=$sysroot/bin/x86_64-unknown-linux-gnu-cc" >> "$GITHUB_ENV"
          if [ "$TASK_TARGET" = "aarch64-unknown-linux-gnu" ]; then
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=$sysroot/bin/aarch64-unknown-linux-gnu-cc" >> "$GITHUB_ENV"
          fi
      # Every task in a dispatch wave compiles the same commit's stow-build
      # and stow-cli — cache the binaries so only the first run pays it.
      # The key pins the checkout SHA, so a cached binary is always exactly
      # the reviewed source this workflow was dispatched on. The key is
      # specific to this job: the cache is written by the job that runs
      # third-party code, so the trusted publish job never reads it.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: stow-bins
        with:
          path: |
            target/release/stow-build
            target/release/stow-build.exe
            target/release/stow-cli
            target/release/stow-cli.exe
          key: stow-bins-build-${{ github.sha }}-${{ runner.os }}-${{ runner.arch }}-${{ fromJSON(inputs.task).rustc_version }}
      - name: Build stow-build and stow-cli
        if: steps.stow-bins.outputs.cache-hit != 'true'
        run: cargo build --release -p stow-build -p stow-cli
      # Saved before the untrusted stage runs, so nothing that stage does
      # can reach the cached binaries.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.stow-bins.outputs.cache-hit != 'true'
        # A wave's parallel tasks race the immutable key — first writer
        # wins, and a losing save must not fail a healthy build.
        continue-on-error: true
        with:
          path: |
            target/release/stow-build
            target/release/stow-build.exe
            target/release/stow-cli
            target/release/stow-cli.exe
          key: stow-bins-build-${{ github.sha }}-${{ runner.os }}-${{ runner.arch }}-${{ fromJSON(inputs.task).rustc_version }}
      - name: Run the untrusted build stage
        run: ./target/release/stow-build build --output-dir "${{ runner.temp }}/stow-build-output"
        env:
          STOW_BUILD_TASK_JSON: ${{ inputs.task }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-output
          path: ${{ runner.temp }}/stow-build-output
          if-no-files-found: error
          retention-days: 1
      # The sandboxed phases' network audit log — uploaded even when the build
      # fails, since the attempts themselves are the evidence.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: build-network-audit
          path: ${{ runner.temp }}/stow-build-output/network-audit.jsonl
          if-no-files-found: warn
          retention-days: 1

  publish:
    name: publish
    needs: build
    if: needs.build.result == 'success'
    runs-on: ${{ fromJSON('{"aarch64-apple-darwin":"macos-14","aarch64-apple-ios":"macos-14","aarch64-apple-ios-sim":"macos-14","aarch64-linux-android":"ubuntu-latest","x86_64-unknown-linux-gnu":"ubuntu-latest","aarch64-unknown-linux-gnu":"ubuntu-latest","x86_64-pc-windows-msvc":"windows-latest","aarch64-pc-windows-msvc":"windows-latest","wasm32-unknown-unknown":"ubuntu-latest"}')[fromJSON(inputs.task).target] }}
    permissions:
      contents: read
      packages: write
      id-token: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      # The trusted job compiles its own stow-build under a key no other
      # job writes, and restores no dependency cache at all: a `target/`
      # saved by the untrusted build job must never be linked into the
      # binary that holds the publish credentials. The compile is paid
      # once per dispatch commit and runner OS — the restore and save path
      # lists are identical, and actions/cache derives the cache version
      # from the path list, so a mismatch never hits.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: stow-bins
        with:
          path: |
            target/release/stow-build
            target/release/stow-build.exe
          key: stow-bins-publish-${{ github.sha }}-${{ runner.os }}-${{ runner.arch }}
      - name: Build stow-build
        if: steps.stow-bins.outputs.cache-hit != 'true'
        run: cargo build --release -p stow-build
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.stow-bins.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: |
            target/release/stow-build
            target/release/stow-build.exe
          key: stow-bins-publish-${{ github.sha }}-${{ runner.os }}-${{ runner.arch }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output
          path: ${{ runner.temp }}/stow-build-output
      - name: Run the trusted publish stage
        run: ./target/release/stow-build publish --input-dir "${{ runner.temp }}/stow-build-output"
        env:
          STOW_BUILD_TASK_JSON: ${{ inputs.task }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STOW_EDGE_URL: ${{ vars.STOW_EDGE_URL }}
          SCHEDULER_URL: ${{ vars.SCHEDULER_URL }}
          # The audience edge pins on OIDC tokens — mirrors
          # STOW_OIDC_AUDIENCE in edge/Skyzen.toml.
          STOW_OIDC_AUDIENCE: ${{ vars.STOW_OIDC_AUDIENCE }}

  # A failed, cancelled, or skipped build still owes the scheduler a
  # `/complete` report. It is one authenticated POST, so it runs on a bare
  # runner with only the OIDC grant — no checkout, no toolchain — instead
  # of paying the publish job's setup for it. The edge pins
  # `job_workflow_ref` to this workflow, so the token this job mints is
  # the same identity the publish job's is.
  report-failure:
    name: report failure
    needs: build
    # `always()` is required: a job-level `if` without a status check
    # function is implicitly `success() && …`, which can never hold when
    # `build` failed.
    if: always() && needs.build.result != 'success'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          STOW_BUILD_TASK_JSON: ${{ inputs.task }}
          BUILD_RESULT: ${{ needs.build.result }}
          SCHEDULER_URL: ${{ vars.SCHEDULER_URL }}
          STOW_OIDC_AUDIENCE: ${{ vars.STOW_OIDC_AUDIENCE }}
        with:
          # The same POST `stow-build publish` sent on a failed build:
          # BuildCompleteReport JSON with a Bearer OIDC JWT.
          script: |
            const task = JSON.parse(process.env.STOW_BUILD_TASK_JSON);
            const token = await core.getIDToken(process.env.STOW_OIDC_AUDIENCE);
            const url = `${process.env.SCHEDULER_URL.replace(/\/+$/, '')}/complete`;
            const result = process.env.BUILD_RESULT;
            const response = await fetch(url, {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                task_id: task.task_id,
                attempt: task.attempt,
                success: false,
                error: `build job ended with result ${result.charAt(0).toUpperCase()}${result.slice(1)}`,
                artifacts_uploaded: 0,
                github_run_id: process.env.GITHUB_RUN_ID,
              }),
            });
            if (!response.ok) {
              core.setFailed(`scheduler rejected completion report at ${url}: HTTP ${response.status} ${await response.text()}`);
            }
