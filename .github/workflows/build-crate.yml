name: build-crate

# The webhook completion parses `display_title` back into the run's
# rustc and task id (`stow_types::records::run_title`). A repack run
# titles itself `<rustc>-repack`: no scheduler task carries that id, so
# the completion is an orphan run the scheduler answers with a logged
# 404, the way it answers any run it never dispatched.
run-name: ${{ inputs.repack_rustc != '' && format('{0}-repack', inputs.repack_rustc) || format('{0}-{1}', fromJSON(inputs.task).rustc_version, fromJSON(inputs.task).task_id) }}

# The scheduler (or `stow-admin preheat manual`) dispatches this workflow on
# `main` with the whole task as one JSON input. Isolated jobs, two trust levels,
# and no Cloudflare dependency at all (stow#455):
#
#   build   — compiles third-party code. Read-only token, no secrets,
#             no OIDC. Everything it produces is handed over as a workflow
#             artifact.
#   verify-failure — failure path only, under read-only permissions. A fresh
#             sandbox replays the same task and frozen lockfile without cached
#             artifacts. A successful job certifies matching source diagnostics;
#             the original build and the workflow still fail.
#   publish — success path only. Never runs third-party code. Holds the GHCR
#             token and the OIDC grant (`id-token: write`) keyless signing
#             uses. Validates the build output against the task and
#             an independently resolved dependency closure, then pushes the
#             bundles and the task's ArtifactRecord set — signed keyless under
#             this workflow's identity — to GHCR (the
#             `records-<rustc>-<task_id hash>-<run_id>-<run_attempt>` tag).
#             GHCR is the only record store; the task talks to no edge route.
#
#   repack  — dispatched by an operator instead of a task. Compiles
#             nothing: it reads published nodes back from GHCR, verifies
#             their signatures and every file's hash, repacks nodes still
#             stored one layer per file into the single-pack layout, and
#             publishes them and their records under this workflow's
#             identity (`stow-build repack`). The identity clients trust
#             is a property of this file on main, so the re-signature has
#             to come from here and from no other workflow.
#
# Completion reaches the scheduler through GitHub itself: `run-name`
# above stamps `<rustc>-<task_id>`, so the `workflow_run` `completed`
# webhook the edge receives carries both in `display_title` — no
# completion POST from a runner, no failure-report job.
#
# The certificate identity clients trust is this file on refs/heads/main
# (stow_types::trusted_builder): Fulcio's SAN for a reusable workflow is
# (stow_types::trusted_builder); dispatching any other ref produces artifacts
# no client accepts.

on:
  workflow_dispatch:
    inputs:
      task:
        description: JSON-encoded BuildTaskPayload (a build run; unused by a repack run)
        required: false
        type: string
        default: '{}'
      repack_rustc:
        description: Rustc whose published nodes are repacked into the single-pack layout (a repack run)
        required: false
        type: string
        default: ''
      repack_concurrency:
        description: Tasks a repack run repacks at once
        required: false
        type: string
        default: '4'

permissions: {}

# A repack run serializes per rustc: a second dispatch for the same rustc
# queues behind the sweep in flight instead of racing it.
concurrency:
  group: ${{ inputs.repack_rustc != '' && format('repack-{0}', inputs.repack_rustc) || format('build-crate-{0}', fromJSON(inputs.task).task_id) }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

# Every target `stow_types::CI_TARGET_TRIPLES` builds for, mapped to the
# runner that carries its toolchain: Apple triples on macOS, Android and
# GNU/Linux cross triples on Ubuntu (the NDK lives under /usr/local, a GNU
# aarch64 toolchain installs via apt), Windows triples on Windows, wasm32
# anywhere since rust-lld ships with the toolchain. `runs-on` cannot read
# `env`, so the map is inline in both jobs.
jobs:
  build:
    if: inputs.repack_rustc == ''
    name: build ${{ fromJSON(inputs.task).crate_name }} ${{ fromJSON(inputs.task).version }} (${{ fromJSON(inputs.task).target }})
    outputs:
      records-exist: ${{ steps.records-exist.outputs.found }}
    runs-on: ${{ fromJSON('{"aarch64-apple-darwin":"macos-26","aarch64-apple-ios":"macos-26","aarch64-apple-ios-sim":"macos-26","aarch64-linux-android":"ubuntu-26.04","x86_64-unknown-linux-gnu":"ubuntu-26.04","aarch64-unknown-linux-gnu":"ubuntu-26.04","x86_64-pc-windows-msvc":"windows-latest","aarch64-pc-windows-msvc":"windows-latest","wasm32-unknown-unknown":"ubuntu-26.04"}')[fromJSON(inputs.task).target] }}
    permissions:
      contents: read
      packages: read # pull the pinned stow toolchain from GHCR
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-environment
        with:
          task: ${{ inputs.task }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # stow#877: a duplicate dispatch — two submitters naming the same
      # task, or the concurrency group re-running a queued run — must not
      # compile twice. `records-exist` reads the task's
      # `built-<rustc>-<task_id hash>` marker in GHCR; on `found` the
      # untrusted stage and its artifact skip, and the trusted publish
      # job re-tags the proven manifest under this run's records tag.
      # The check is a trusted binary under a read-only token — the
      # untrusted stage never sees the credential.
      - name: Check for existing records
        id: records-exist
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "found=$(stow-build records-exist)" >> "$GITHUB_OUTPUT"
      - name: Run the untrusted build stage
        id: compile
        if: steps.records-exist.outputs.found != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            eval "$(ci/glibc-sysroot/env.sh "$HOME/stow-glibc-2.28" "$HOME/stow-system-libs")"
          fi
          stow-build build --output-dir "${{ runner.temp }}/stow-build-output"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.records-exist.outputs.found != 'true'
        with:
          name: build-output
          path: ${{ runner.temp }}/stow-build-output
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() && steps.compile.outcome == 'failure'
        with:
          name: failure-candidate
          path: ${{ runner.temp }}/stow-build-output/failure-candidate.json
          if-no-files-found: warn
          retention-days: 1
      # The sandboxed phases' network audit log — uploaded even when the build
      # fails, since the attempts themselves are the evidence.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: build-network-audit
          path: ${{ runner.temp }}/stow-build-output/network-audit.jsonl
          if-no-files-found: warn
          retention-days: 1
      # The host-loaded ELFs this leg produced are what stow#336 gates —
      # print the highest GLIBC_x.y any of them needs so a real run shows
      # the 2.28 baseline held. The publish stage hard-fails on anything
      # higher, so this line is evidence, not a check.
      - name: Report the built outputs' glibc floor
        if: runner.os == 'Linux' && always()
        shell: bash
        run: |
          set -euo pipefail
          blobs="${{ runner.temp }}/stow-build-output/blobs"
          highest=
          if [ -d "$blobs" ]; then
            # Only ELF shared objects — proc-macros, dylibs, cdylibs —
            # carry a dynamic symbol table; an rlib or a C object has
            # none, so a pure-rlib leg reports "none".
            mapfile -d '' shared < <(find "$blobs" -type f \
              -exec sh -c 'readelf -h "$1" 2>/dev/null | grep -q "Type:[[:space:]]*DYN"' _ {} \; \
              -print0)
            if [ "${#shared[@]}" -gt 0 ]; then
              highest=$(objdump -T "${shared[@]}" \
                | awk 'match($0, /GLIBC_[0-9]+\.[0-9]+(\.[0-9]+)?/) { print substr($0, RSTART, RLENGTH) }' \
                | sort -Vu | tail -1)
            fi
          fi
          echo "highest glibc required by host-loaded outputs: ${highest:-none}"

  verify-failure:
    name: verify source failure
    needs: build
    if: always() && inputs.repack_rustc == '' && needs.build.result == 'failure'
    runs-on: ${{ fromJSON('{"aarch64-apple-darwin":"macos-26","aarch64-apple-ios":"macos-26","aarch64-apple-ios-sim":"macos-26","aarch64-linux-android":"ubuntu-26.04","x86_64-unknown-linux-gnu":"ubuntu-26.04","aarch64-unknown-linux-gnu":"ubuntu-26.04","x86_64-pc-windows-msvc":"windows-latest","aarch64-pc-windows-msvc":"windows-latest","wasm32-unknown-unknown":"ubuntu-26.04"}')[fromJSON(inputs.task).target] }}
    permissions:
      contents: read
      packages: read
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: failure-candidate
          path: ${{ runner.temp }}/stow-failure-candidate
      - uses: ./.github/actions/build-environment
        with:
          task: ${{ inputs.task }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Replay without cached artifacts
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            eval "$(ci/glibc-sysroot/env.sh "$HOME/stow-glibc-2.28" "$HOME/stow-system-libs")"
          fi
          stow-build verify-failure --input-dir "${{ runner.temp }}/stow-failure-candidate" --output-dir "${{ runner.temp }}/stow-failure-replay"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: failure-replay
          path: ${{ runner.temp }}/stow-failure-replay
          if-no-files-found: warn
          retention-days: 1

  publish:
    name: publish
    needs: build
    if: inputs.repack_rustc == '' && needs.build.result == 'success'
    runs-on: ${{ fromJSON('{"aarch64-apple-darwin":"macos-26","aarch64-apple-ios":"macos-26","aarch64-apple-ios-sim":"macos-26","aarch64-linux-android":"ubuntu-26.04","x86_64-unknown-linux-gnu":"ubuntu-26.04","aarch64-unknown-linux-gnu":"ubuntu-26.04","x86_64-pc-windows-msvc":"windows-latest","aarch64-pc-windows-msvc":"windows-latest","wasm32-unknown-unknown":"ubuntu-26.04"}')[fromJSON(inputs.task).target] }}
    permissions:
      contents: read
      packages: write
      id-token: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # This job executes only a binary trusted CI built from this commit:
      # the action pulls the toolchain artifact by manifest digest and
      # cosign-verifies it against toolchain-publish.yml's merge-queue
      # identity bound to `github.sha` — cryptographic provenance the
      # compile-in-job path it replaces never had (stow#431).
      - uses: ./.github/actions/stow-toolchain
        with:
          binaries: stow-build
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # The publish stage re-resolves the task's closure under the pinned
      # toolchain (ci/src/closure.rs) and refuses a rustc that is not the pin.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ fromJSON(inputs.task).rustc_version }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.build.outputs.records-exist != 'true'
        with:
          name: build-output
          path: ${{ runner.temp }}/stow-build-output
      - name: Run the trusted publish stage
        run: stow-build publish --input-dir "${{ runner.temp }}/stow-build-output"
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  repack:
    name: repack ${{ inputs.repack_rustc }}
    if: inputs.repack_rustc != ''
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write
    # A sweep is idempotent and resumes where the last stopped, so the
    # job's bound is GitHub's own job limit rather than an estimate of
    # the registry's size.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/stow-toolchain
        with:
          binaries: stow-build
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Repack the published nodes
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPACK_RUSTC: ${{ inputs.repack_rustc }}
          REPACK_CONCURRENCY: ${{ inputs.repack_concurrency }}
        run: stow-build repack --rustc-version "$REPACK_RUSTC" --concurrency "$REPACK_CONCURRENCY"
