name: build-crate

# Every leg of a `build-batch.yml` run calls this file (stow#833). Two
# jobs, two trust levels, and no Cloudflare dependency at all (stow#455):
#
#   build   — compiles third-party code. Read-only token, no secrets,
#             no OIDC. Everything it produces is handed over as a workflow
#             artifact.
#   publish — success path only. Never runs third-party code. Holds the GHCR
#             token and the OIDC grant (`id-token: write`) cosign's keyless
#             signing uses. Validates the build output against the task and
#             an independently resolved dependency closure, then pushes the
#             bundles and the task's ArtifactRecord set — cosign-signed under
#             this workflow's identity — to GHCR (the
#             `records-<rustc>-<task_id hash>-<run_id>-<run_attempt>` tag).
#             GHCR is the only record store; the task talks to no edge route.
#
# The task never travels through this file's inputs: a called workflow's
# `github.event` is the caller's `workflow_dispatch`, so `stow-build`
# reads leg `--leg` of the batch from `$GITHUB_EVENT_PATH`
# (`.inputs.batch`) — a Windows env var's 32,767-char cap would already
# break a task carried by `env:` on a large subgraph.
#
# The job names carry the leg binding — `build #<leg> <label>
# (<target>) <task hash>` and `publish #<leg> <task hash>` — the shape
# `stow_types::runs::LegJobName` parses the run's jobs page back into
# legs with.
#
# The certificate identity clients trust is this file on refs/heads/main
# (stow_types::trusted_builder): Fulcio's SAN for a reusable workflow is
# the called workflow's `job_workflow_ref`, so batching changes nothing a
# client verifies; dispatching any other ref produces artifacts no client
# accepts.

on:
  workflow_call:
    inputs:
      leg:
        description: The leg's index into the batch's tasks list
        required: true
        type: number
      task_hash:
        description: First 16 hex of blake3(task_id) — the leg's job-name binding
        required: true
        type: string
      target:
        description: The leg's compilation target triple
        required: true
        type: string
      rustc_version:
        description: The batch's pinned rustc version
        required: true
        type: string
      label:
        description: The leg's crate name and version, for the build job name
        required: true
        type: string

permissions: {}

env:
  CARGO_TERM_COLOR: always

# Every target `stow_types::CI_TARGET_TRIPLES` builds for, mapped to the
# runner that carries its toolchain: Apple triples on macOS, Android and
# GNU/Linux cross triples on Ubuntu (the NDK lives under /usr/local, a GNU
# aarch64 toolchain installs via apt), Windows triples on Windows, wasm32
# anywhere since rust-lld ships with the toolchain. `runs-on` cannot read
# `env`, so the map is inline in both jobs.
jobs:
  build:
    name: "build #${{ inputs.leg }} ${{ inputs.label }} (${{ inputs.target }}) ${{ inputs.task_hash }}"
    runs-on: ${{ fromJSON('{"aarch64-apple-darwin":"macos-14","aarch64-apple-ios":"macos-14","aarch64-apple-ios-sim":"macos-14","aarch64-linux-android":"ubuntu-latest","x86_64-unknown-linux-gnu":"ubuntu-latest","aarch64-unknown-linux-gnu":"ubuntu-latest","x86_64-pc-windows-msvc":"windows-latest","aarch64-pc-windows-msvc":"windows-latest","wasm32-unknown-unknown":"ubuntu-latest"}')[inputs.target] }}
    permissions:
      contents: read
      packages: read # pull the pinned stow toolchain from GHCR
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The build pins RUSTUP_TOOLCHAIN=<task.rustc_version>, which rustup
      # resolves as a distinct toolchain from `stable`; installing `stable`
      # here would leave the pinned toolchain without the target's std.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ inputs.rustc_version }}
          targets: ${{ inputs.target }}
      # The sandboxed phases inherit these CARGO_TARGET_*/CC_*/AR_* variables
      # through stow-build's toolchain passthrough; a variable that is not set
      # for the task's target is simply absent there too.
      #
      # The linker a unit's artifacts pass through is part of its compile
      # key, so it is a choice this job makes, not an observation of the
      # runner image. GNU/Linux units link with mold — installed below and
      # selected for host and target units alike by the capture wrapper,
      # whose argv append is what lands the choice in the key — Android
      # through the NDK clang pinned here, Apple targets through Xcode's
      # `cc`, Windows through the MSVC toolchain lookup, and wasm32 through
      # the rust-lld the toolchain itself ships.
      # The debs ci/system-libs/install.sh verifies and extracts —
      # one cache entry per lock version, restored like the glibc
      # sysroot's, but re-verified against the lock's sha256 on every
      # hit (stow#850). aarch64 only for now; B1/B2 extend the same
      # mechanism to the toolchain sets and the x86_64 leg.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: endsWith(inputs.target, '-unknown-linux-gnu')
        id: system-debs
        with:
          path: ~/stow-system-debs
          key: system-debs-${{ inputs.target }}-${{ hashFiles('ci/system-libs/lock.txt') }}
      - name: Configure the cross toolchain
        shell: bash
        env:
          TASK_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          target_key="$(echo "$TASK_TARGET" | tr 'a-z-' 'A-Z_')"
          case "$TASK_TARGET" in
            *-linux-android*)
              # The API level in the NDK clang wrapper name is WaterUI's
              # android-min-api-level floor.
              ndk_bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
              linker="$ndk_bin/${TASK_TARGET}26-clang"
              for exe in "$linker" "${linker}++" "$ndk_bin/llvm-ar"; do
                [ -x "$exe" ] || { echo "::error::missing NDK tool $exe"; exit 1; }
              done
              cc_key="$(echo "$TASK_TARGET" | tr '-' '_')"
              {
                echo "CARGO_TARGET_${target_key}_LINKER=$linker"
                echo "CC_${cc_key}=$linker"
                echo "CXX_${cc_key}=${linker}++"
                echo "AR_${cc_key}=$ndk_bin/llvm-ar"
              } >> "$GITHUB_ENV"
              ;;
            x86_64-unknown-linux-gnu)
              # The system libraries crate build scripts link through
              # pkg-config — the image ships only some (stow#729) — and
              # mold: all from the sha256 lock (stow#850, stow#862),
              # never through apt.
              ci/system-libs/install.sh "$TASK_TARGET" \
                "$HOME/stow-system-debs" "$HOME/stow-system-libs"
              ;;
            aarch64-unknown-linux-gnu)
              # Both architectures' system libraries come from the
              # sha256 lock (stow#850): extracted into
              # ~/stow-system-libs, never dpkg-installed, so the
              # ports/multiarch coupling with the image is gone. The
              # cross pkg-config is the sysroot-written
              # aarch64-linux-gnu-pkg-config, not pkgconf:arm64.
              ci/system-libs/install.sh "$TASK_TARGET" \
                "$HOME/stow-system-debs" "$HOME/stow-system-libs"
              # The sysroot shims drive GCC 12 (stow#693) — installed from
              # the lock too; install.sh links ld.mold into the cross
              # toolchain's search path and smoke-tests the set.
              {
                echo "CARGO_TARGET_${target_key}_LINKER=aarch64-linux-gnu-gcc"
                echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
                echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++"
                echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar"
                # Per target, so a build script compiling for the host
                # keeps the native pkg-config.
                echo "PKG_CONFIG_aarch64_unknown_linux_gnu=aarch64-linux-gnu-pkg-config"
              } >> "$GITHUB_ENV"
              ;;
            aarch64-apple-ios)
              echo "SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)" >> "$GITHUB_ENV"
              ;;
            aarch64-apple-ios-sim)
              echo "SDKROOT=$(xcrun --sdk iphonesimulator --show-sdk-path)" >> "$GITHUB_ENV"
              ;;
          esac
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: endsWith(inputs.target, '-unknown-linux-gnu') && steps.system-debs.outputs.cache-hit != 'true'
        with:
          path: ~/stow-system-debs
          key: ${{ steps.system-debs.outputs.cache-primary-key }}
      # The sysroot setup — install, compiler wrappers, untrusted-build
      # env — lives in ci/glibc-sysroot/*.sh so the mock end-to-end runs
      # build the way this job builds (stow#336).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: runner.os == 'Linux'
        id: glibc-sysroot
        with:
          path: ~/stow-glibc-2.28
          key: glibc-sysroot-${{ hashFiles('ci/glibc-sysroot-debs.txt') }}
      - name: Install the glibc-2.28 sysroot
        if: runner.os == 'Linux' && steps.glibc-sysroot.outputs.cache-hit != 'true'
        shell: bash
        run: ci/glibc-sysroot/install.sh "$HOME/stow-glibc-2.28"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: runner.os == 'Linux' && steps.glibc-sysroot.outputs.cache-hit != 'true'
        with:
          path: ~/stow-glibc-2.28
          key: ${{ steps.glibc-sysroot.outputs.cache-primary-key }}
      - name: Write the sysroot compiler wrappers
        if: runner.os == 'Linux'
        shell: bash
        run: ci/glibc-sysroot/wrappers.sh "$HOME/stow-glibc-2.28" "$HOME/stow-system-libs"
      # toolchain-publish.yml publishes stow-build and stow-cli (and on
      # Linux stow-admin) once per main commit per host platform from the merge queue; this
      # job pulls that artifact — digest-pinned, cosign-verified against the
      # merge-queue identity and this commit — instead of compiling
      # (stow#431). An absent artifact fails the step; there is no
      # source-build fallback.
      - uses: ./.github/actions/stow-toolchain
        with:
          binaries: stow-build stow-cli
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run the untrusted build stage
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            eval "$(ci/glibc-sysroot/env.sh "$HOME/stow-glibc-2.28" "$HOME/stow-system-libs")"
          fi
          stow-build build --leg ${{ inputs.leg }} --output-dir "${{ runner.temp }}/stow-build-output"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-output-${{ inputs.leg }}
          path: ${{ runner.temp }}/stow-build-output
          if-no-files-found: error
          retention-days: 1
      # The sandboxed phases' network audit log — uploaded even when the build
      # fails, since the attempts themselves are the evidence.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: build-network-audit-${{ inputs.leg }}
          path: ${{ runner.temp }}/stow-build-output/network-audit.jsonl
          if-no-files-found: warn
          retention-days: 1
      # The host-loaded ELFs this leg produced are what stow#336 gates —
      # print the highest GLIBC_x.y any of them needs so a real run shows
      # the 2.28 baseline held. The publish stage hard-fails on anything
      # higher, so this line is evidence, not a check.
      - name: Report the built outputs' glibc floor
        if: runner.os == 'Linux' && always()
        shell: bash
        run: |
          set -euo pipefail
          blobs="${{ runner.temp }}/stow-build-output/blobs"
          highest=
          if [ -d "$blobs" ]; then
            # Only ELF shared objects — proc-macros, dylibs, cdylibs —
            # carry a dynamic symbol table; an rlib or a C object has
            # none, so a pure-rlib leg reports "none".
            mapfile -d '' shared < <(find "$blobs" -type f \
              -exec sh -c 'readelf -h "$1" 2>/dev/null | grep -q "Type:[[:space:]]*DYN"' _ {} \; \
              -print0)
            if [ "${#shared[@]}" -gt 0 ]; then
              highest=$(objdump -T "${shared[@]}" \
                | awk 'match($0, /GLIBC_[0-9]+\.[0-9]+(\.[0-9]+)?/) { print substr($0, RSTART, RLENGTH) }' \
                | sort -Vu | tail -1)
            fi
          fi
          echo "highest glibc required by host-loaded outputs: ${highest:-none}"

  publish:
    name: "publish #${{ inputs.leg }} ${{ inputs.task_hash }}"
    needs: build
    if: needs.build.result == 'success'
    runs-on: ${{ fromJSON('{"aarch64-apple-darwin":"macos-14","aarch64-apple-ios":"macos-14","aarch64-apple-ios-sim":"macos-14","aarch64-linux-android":"ubuntu-latest","x86_64-unknown-linux-gnu":"ubuntu-latest","aarch64-unknown-linux-gnu":"ubuntu-latest","x86_64-pc-windows-msvc":"windows-latest","aarch64-pc-windows-msvc":"windows-latest","wasm32-unknown-unknown":"ubuntu-latest"}')[inputs.target] }}
    permissions:
      contents: read
      packages: write
      id-token: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # This job executes only a binary trusted CI built from this commit:
      # the action pulls the toolchain artifact by manifest digest and
      # cosign-verifies it against toolchain-publish.yml's merge-queue
      # identity bound to `github.sha` — cryptographic provenance the
      # compile-in-job path it replaces never had (stow#431).
      - uses: ./.github/actions/stow-toolchain
        with:
          binaries: stow-build
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # The publish stage re-resolves the task's closure under the pinned
      # toolchain (ci/src/closure.rs) and refuses a rustc that is not the pin.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ inputs.rustc_version }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output-${{ inputs.leg }}
          path: ${{ runner.temp }}/stow-build-output
      - name: Run the trusted publish stage
        run: stow-build publish --leg ${{ inputs.leg }} --input-dir "${{ runner.temp }}/stow-build-output"
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
