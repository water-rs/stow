name: build-crate

# The webhook completion parses `display_title` back into the run's
# rustc and task id (`stow_types::records::run_title`).
run-name: ${{ fromJSON(inputs.task).rustc_version }}-${{ fromJSON(inputs.task).task_id }}

# The scheduler (or `stow-admin preheat manual`) dispatches this workflow on
# `main` with the whole task as one JSON input. Two jobs, two trust levels,
# and no Cloudflare dependency at all (stow#455):
#
#   build   — compiles third-party code. Read-only token, no secrets,
#             no OIDC. Everything it produces is handed over as a workflow
#             artifact.
#   publish — success path only. Never runs third-party code. Holds the GHCR
#             token and the OIDC grant (`id-token: write`) cosign's keyless
#             signing uses. Validates the build output against the task and
#             an independently resolved dependency closure, then pushes the
#             bundles and the task's ArtifactRecord set — cosign-signed under
#             this workflow's identity — to GHCR (the `records-<rustc>-<task_id>`
#             tag). GHCR is the only record store; the task talks to no edge
#             route.
#
# Completion reaches the scheduler through GitHub itself: `run-name`
# above stamps `<rustc>-<task_id>`, so the `workflow_run` `completed`
# webhook the edge receives carries both in `display_title` — no
# completion POST from a runner, no failure-report job.
#
# The certificate identity clients trust is this file on refs/heads/main
# (stow_types::trusted_builder); dispatching any other ref produces artifacts
# no client accepts.

on:
  workflow_dispatch:
    inputs:
      task:
        description: JSON-encoded BuildTaskPayload
        required: true
        type: string

permissions: {}

concurrency:
  group: build-crate-${{ fromJSON(inputs.task).task_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

# Every target `stow_types::CI_TARGET_TRIPLES` builds for, mapped to the
# runner that carries its toolchain: Apple triples on macOS, Android and
# GNU/Linux cross triples on Ubuntu (the NDK lives under /usr/local, a GNU
# aarch64 toolchain installs via apt), Windows triples on Windows, wasm32
# anywhere since rust-lld ships with the toolchain. `runs-on` cannot read
# `env`, so the map is inline in both jobs.
jobs:
  build:
    name: build ${{ fromJSON(inputs.task).crate_name }} ${{ fromJSON(inputs.task).version }} (${{ fromJSON(inputs.task).target }})
    runs-on: ${{ fromJSON('{"aarch64-apple-darwin":"macos-14","aarch64-apple-ios":"macos-14","aarch64-apple-ios-sim":"macos-14","aarch64-linux-android":"ubuntu-latest","x86_64-unknown-linux-gnu":"ubuntu-latest","aarch64-unknown-linux-gnu":"ubuntu-latest","x86_64-pc-windows-msvc":"windows-latest","aarch64-pc-windows-msvc":"windows-latest","wasm32-unknown-unknown":"ubuntu-latest"}')[fromJSON(inputs.task).target] }}
    permissions:
      contents: read
      packages: read # pull the pinned stow toolchain from GHCR
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The build pins RUSTUP_TOOLCHAIN=<task.rustc_version>, which rustup
      # resolves as a distinct toolchain from `stable`; installing `stable`
      # here would leave the pinned toolchain without the target's std.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ fromJSON(inputs.task).rustc_version }}
          targets: ${{ fromJSON(inputs.task).target }}
      # The sandboxed phases inherit these CARGO_TARGET_*/CC_*/AR_* variables
      # through stow-build's toolchain passthrough; a variable that is not set
      # for the task's target is simply absent there too.
      #
      # The linker a unit's artifacts pass through is part of its compile
      # key, so it is a choice this job makes, not an observation of the
      # runner image. GNU/Linux units link with mold — installed below and
      # selected for host and target units alike by the capture wrapper,
      # whose argv append is what lands the choice in the key — Android
      # through the NDK clang pinned here, Apple targets through Xcode's
      # `cc`, Windows through the MSVC toolchain lookup, and wasm32 through
      # the rust-lld the toolchain itself ships.
      - name: Configure the cross toolchain
        shell: bash
        env:
          TASK_TARGET: ${{ fromJSON(inputs.task).target }}
        run: |
          set -euo pipefail
          target_key="$(echo "$TASK_TARGET" | tr 'a-z-' 'A-Z_')"
          case "$TASK_TARGET" in
            *-linux-android*)
              # The API level in the NDK clang wrapper name is WaterUI's
              # android-min-api-level floor.
              ndk_bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
              linker="$ndk_bin/${TASK_TARGET}26-clang"
              for exe in "$linker" "${linker}++" "$ndk_bin/llvm-ar"; do
                [ -x "$exe" ] || { echo "::error::missing NDK tool $exe"; exit 1; }
              done
              cc_key="$(echo "$TASK_TARGET" | tr '-' '_')"
              {
                echo "CARGO_TARGET_${target_key}_LINKER=$linker"
                echo "CC_${cc_key}=$linker"
                echo "CXX_${cc_key}=${linker}++"
                echo "AR_${cc_key}=$ndk_bin/llvm-ar"
              } >> "$GITHUB_ENV"
              ;;
            x86_64-unknown-linux-gnu)
              # Native-target system libraries crate build scripts probe
              # through pkg-config — cros-libva needs libva.pc and the
              # libva headers, which the runner image does not ship.
              sudo apt-get update -qq
              sudo apt-get install -y --no-install-recommends libva-dev mold
              ;;
            aarch64-unknown-linux-gnu)
              sudo apt-get update -qq
              sudo apt-get install -y --no-install-recommends \
                gcc-aarch64-linux-gnu g++-aarch64-linux-gnu mold
              # `-fuse-ld=mold` asks collect2 for `ld.mold` on the cross
              # toolchain's own search path, which /usr/bin does not reach
              # — link the apt install's `ld.mold` in where it looks.
              sudo ln -sf /usr/bin/ld.mold /usr/aarch64-linux-gnu/bin/ld.mold
              {
                echo "CARGO_TARGET_${target_key}_LINKER=aarch64-linux-gnu-gcc"
                echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
                echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++"
                echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar"
              } >> "$GITHUB_ENV"
              ;;
            aarch64-apple-ios)
              echo "SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)" >> "$GITHUB_ENV"
              ;;
            aarch64-apple-ios-sim)
              echo "SDKROOT=$(xcrun --sdk iphonesimulator --show-sdk-path)" >> "$GITHUB_ENV"
              ;;
          esac
      # The sysroot setup — install, compiler wrappers, untrusted-build
      # env — lives in ci/glibc-sysroot/*.sh so the mock end-to-end runs
      # build the way this job builds (stow#336).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: runner.os == 'Linux'
        id: glibc-sysroot
        with:
          path: ~/stow-glibc-2.28
          key: glibc-sysroot-${{ hashFiles('ci/glibc-sysroot-debs.txt') }}
      - name: Install the glibc-2.28 sysroot
        if: runner.os == 'Linux' && steps.glibc-sysroot.outputs.cache-hit != 'true'
        shell: bash
        run: ci/glibc-sysroot/install.sh "$HOME/stow-glibc-2.28"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: runner.os == 'Linux' && steps.glibc-sysroot.outputs.cache-hit != 'true'
        with:
          path: ~/stow-glibc-2.28
          key: ${{ steps.glibc-sysroot.outputs.cache-primary-key }}
      - name: Write the sysroot compiler wrappers
        if: runner.os == 'Linux'
        shell: bash
        run: ci/glibc-sysroot/wrappers.sh "$HOME/stow-glibc-2.28"
      # toolchain-publish.yml publishes stow-build, stow-cli and stow-admin
      # once per main commit per host platform from the merge queue; this
      # job pulls that artifact — digest-pinned, cosign-verified against the
      # merge-queue identity and this commit — instead of compiling
      # (stow#431). An absent artifact fails the step; there is no
      # source-build fallback.
      - uses: ./.github/actions/stow-toolchain
        with:
          binaries: stow-build stow-cli
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run the untrusted build stage
        shell: bash
        env:
          STOW_BUILD_TASK_JSON: ${{ inputs.task }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            eval "$(ci/glibc-sysroot/env.sh "$HOME/stow-glibc-2.28")"
          fi
          stow-build build --output-dir "${{ runner.temp }}/stow-build-output"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-output
          path: ${{ runner.temp }}/stow-build-output
          if-no-files-found: error
          retention-days: 1
      # The sandboxed phases' network audit log — uploaded even when the build
      # fails, since the attempts themselves are the evidence.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: build-network-audit
          path: ${{ runner.temp }}/stow-build-output/network-audit.jsonl
          if-no-files-found: warn
          retention-days: 1
      # The host-loaded ELFs this leg produced are what stow#336 gates —
      # print the highest GLIBC_x.y any of them needs so a real run shows
      # the 2.28 baseline held. The publish stage hard-fails on anything
      # higher, so this line is evidence, not a check.
      - name: Report the built outputs' glibc floor
        if: runner.os == 'Linux' && always()
        shell: bash
        run: |
          set -euo pipefail
          blobs="${{ runner.temp }}/stow-build-output/blobs"
          highest=
          if [ -d "$blobs" ]; then
            # Only ELF shared objects — proc-macros, dylibs, cdylibs —
            # carry a dynamic symbol table; an rlib or a C object has
            # none, so a pure-rlib leg reports "none".
            mapfile -d '' shared < <(find "$blobs" -type f \
              -exec sh -c 'readelf -h "$1" 2>/dev/null | grep -q "Type:[[:space:]]*DYN"' _ {} \; \
              -print0)
            if [ "${#shared[@]}" -gt 0 ]; then
              highest=$(objdump -T "${shared[@]}" \
                | awk 'match($0, /GLIBC_[0-9]+\.[0-9]+(\.[0-9]+)?/) { print substr($0, RSTART, RLENGTH) }' \
                | sort -Vu | tail -1)
            fi
          fi
          echo "highest glibc required by host-loaded outputs: ${highest:-none}"

  publish:
    name: publish
    needs: build
    if: needs.build.result == 'success'
    runs-on: ${{ fromJSON('{"aarch64-apple-darwin":"macos-14","aarch64-apple-ios":"macos-14","aarch64-apple-ios-sim":"macos-14","aarch64-linux-android":"ubuntu-latest","x86_64-unknown-linux-gnu":"ubuntu-latest","aarch64-unknown-linux-gnu":"ubuntu-latest","x86_64-pc-windows-msvc":"windows-latest","aarch64-pc-windows-msvc":"windows-latest","wasm32-unknown-unknown":"ubuntu-latest"}')[fromJSON(inputs.task).target] }}
    permissions:
      contents: read
      packages: write
      id-token: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # This job executes only a binary trusted CI built from this commit:
      # the action pulls the toolchain artifact by manifest digest and
      # cosign-verifies it against toolchain-publish.yml's merge-queue
      # identity bound to `github.sha` — cryptographic provenance the
      # compile-in-job path it replaces never had (stow#431).
      - uses: ./.github/actions/stow-toolchain
        with:
          binaries: stow-build
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output
          path: ${{ runner.temp }}/stow-build-output
      - name: Run the trusted publish stage
        run: stow-build publish --input-dir "${{ runner.temp }}/stow-build-output"
        env:
          STOW_BUILD_TASK_JSON: ${{ inputs.task }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
