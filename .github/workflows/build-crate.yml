name: build-crate

on:
  repository_dispatch:
    types:
      - build-crate

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-linux:
    if: ${{ github.event.client_payload.target == 'x86_64-unknown-linux-gnu' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - name: Run stow-build
        run: cargo run -p stow-build
        env:
          STOW_PUSH_GHCR: "1"
          STOW_SIGN_GHCR: "1"
          STOW_REGISTER_D1: "1"
          STOW_BUILD_TASK_JSON: ${{ toJson(github.event.client_payload) }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          SCHEDULER_URL: ${{ secrets.SCHEDULER_URL }}

  build-macos:
    if: ${{ github.event.client_payload.target == 'aarch64-apple-darwin' }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - name: Run stow-build
        run: cargo run -p stow-build
        env:
          STOW_PUSH_GHCR: "1"
          STOW_SIGN_GHCR: "1"
          STOW_REGISTER_D1: "1"
          STOW_BUILD_TASK_JSON: ${{ toJson(github.event.client_payload) }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          SCHEDULER_URL: ${{ secrets.SCHEDULER_URL }}

  build-windows:
    if: ${{ github.event.client_payload.target == 'x86_64-pc-windows-msvc' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - name: Run stow-build
        shell: bash
        run: cargo run -p stow-build
        env:
          STOW_PUSH_GHCR: "1"
          STOW_SIGN_GHCR: "1"
          STOW_REGISTER_D1: "1"
          STOW_BUILD_TASK_JSON: ${{ toJson(github.event.client_payload) }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          SCHEDULER_URL: ${{ secrets.SCHEDULER_URL }}
