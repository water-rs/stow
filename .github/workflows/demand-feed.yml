name: Demand feed

# The hourly demand feed (stow#523): once an hour one job runs
# `stow-admin scheduler demand-feed`, which resumes the durable feed
# cursor first — an unfinished staging attempt restarts from scratch,
# a frozen `complete` hour delivers its original immutable pages with
# no new Analytics Engine query — and only then materializes the next
# closed hour: one `analytics_engine/sql` FORMAT JSON query streamed to
# disk, staged to the Durable Object as bounded manifest-chained pages,
# frozen, then delivered to `delivered` and retired through the bounded
# cleanup drain. State lives in the object, so a failed job is visible
# here and the next tick resumes the cursor exactly — no runner-side
# state, no background timers in the object.
#
# The job pulls the toolchain published for its own release tag's
# commit; there is no per-hour toolchain build and no fallback.

# The edge Cron Trigger dispatches it on its own release tag at five past every hour
# (`5 * * * *`, `STOW_PERIODIC_WORKFLOWS`, stow#1121): Analytics Engine
# closes a hour's writes at the boundary, and the small skew absorbs the
# delay Cloudflare reports on sampled rows.
on:
  workflow_dispatch:

permissions: {}

# One invocation at a time, and a pending tick is never cancelled: the
# next cron resumes the durable cursor, so queueing stale ticks only
# repeats the same hour's drain.
concurrency:
  group: demand-feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    # The explicit deadline bounds one invocation's resume, query,
    # staging, delivery and retirement work — a huge hour posts more
    # bounded calls, and a run that cannot finish inside the window
    # leaves the durable cursor for the next tick to resume.
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read # pull the pinned stow toolchain from GHCR
      # Mints the run's OIDC token — the edge's demand routes admit only
      # this workflow's and operations.yml's runs on a release tag, and
      # stow-admin refreshes it per request.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The signed toolchain artifact exists for release-tag commits;
      # this run's own commit is one, so pull its verified toolchain,
      # never a per-job source build.
      - uses: ./.github/actions/stow-toolchain
        with:
          sha: ${{ github.sha }}
          binaries: stow-admin
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run the hourly demand feed
        env:
          STOW_EDGE_URL: ${{ vars.STOW_EDGE_URL }}
          STOW_OIDC_AUDIENCE: ${{ vars.STOW_OIDC_AUDIENCE }}
        run: |
          set -euo pipefail
          stow-admin scheduler demand-feed
