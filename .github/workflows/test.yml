name: Test

on:
  push:
    branches: [main, dev]
  pull_request:
  merge_group:
  workflow_call:

# A branch pushed several times in a row only needs its newest run: the older
# ones test a tree nobody will merge. Pushes to main and dev keep theirs,
# because those runs are the record of what the branch did.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # No debuginfo in CI builds. A failing test reports its file and line
  # without it, and it was most of every cached target directory: a
  # workspace `cargo test --no-run` is 11 GB with it and 3.4 GB without,
  # and compiles in 128 s instead of 174 s. The per-job caches held the full
  # size, filled the repository's 10 GB cache allowance and evicted each
  # other.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # Documentation cannot change what a compiler or a test observes, so the
  # jobs below skip it. The condition lives on the jobs and never on the
  # workflow's triggers: a workflow skipped by `paths-ignore` leaves its
  # checks Pending forever, and the dev ruleset requires the gate below,
  # while a job skipped by `if:` reports success and the gate passes it.
  #
  # A pull request runs none of them. The merge queue runs this workflow on
  # the merge-group ref — the tree that actually lands — and the ruleset
  # requires only the gate, which passes over skipped legs, so a pull request
  # enters the queue at once instead of testing the same change a first time
  # on its own merge ref and then again in the queue.
  changes:
    if: github.event_name != 'pull_request'
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # The filter diffs against the previous tip (or the merge group's base)
      # with git, so it needs the repository checked out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          # `every` is required: with the default quantifier a negated rule
          # never excludes anything, because the rules are OR-ed and `**`
          # already matched. With `every`, a file counts as code only when it
          # matches every rule, so `code` is true exactly when some changed
          # file is not documentation.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!LICENSE*'
              - '!.gitignore'

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      # Linux artifacts link with mold, the linker the project recommends.
      - uses: ./.github/actions/link-with-mold
        if: matrix.os == 'ubuntu-latest'
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test-${{ matrix.os }}
          # Pull requests restore the `dev` cache and never save their own:
          # a per-PR copy of every job's cache duplicated the whole set
          # under the PR ref and evicted the build-crate caches (#177).
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - run: cargo nextest run --workspace --no-fail-fast
      - run: cargo test --doc --workspace

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      # Host build scripts compile for x86_64-unknown-linux-gnu, so they
      # link with mold too.
      - uses: ./.github/actions/link-with-mold
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: lint
          # Pull requests restore the `dev` cache and never save their own:
          # a per-PR copy of every job's cache duplicated the whole set
          # under the PR ref and evicted the build-crate caches (#177).
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p stow-edge --target wasm32-unknown-unknown -- -D warnings

  publish-dry-run:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Publish dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      # `cargo publish --dry-run` compiles for x86_64-unknown-linux-gnu, so
      # it links with mold too.
      - uses: ./.github/actions/link-with-mold
      # `cargo publish --dry-run` resolves in-workspace dependency versions
      # against crates.io, so it fails for stow-shim/stow-oci/stow-cli while
      # stow-types, stow-shim and stow-oci are unpublished. `cargo package`
      # checks manifest publishability (versioned path deps, license,
      # description) entirely locally, so it covers the whole published set;
      # the registry-facing `--dry-run` then covers stow-types, the
      # dependency-free root of the publish graph.
      - run: cargo package -p stow-types -p stow-shim -p stow-oci -p stow-cli --no-verify
      - run: cargo publish --dry-run -p stow-types

  mock-e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Mock end-to-end
    runs-on: ubuntu-latest
    permissions:
      # The local edge authenticates its write endpoints against the
      # credential's own repo permissions — GITHUB_TOKEN needs push
      # (`contents: write`) to pass. Fork pull requests still receive a
      # read-only token regardless of this block.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: mock-e2e
          # Pull requests restore the `dev` cache and never save their own:
          # a per-PR copy of every job's cache duplicated the whole set
          # under the PR ref and evicted the build-crate caches (#177).
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      # skyzen-cli ships cargo-dist binaries; install-action does not know
      # the tool and its cargo-binstall fallback compiles it from source
      # (about eight minutes), so the pinned, digest-checked archive is used.
      # The workspace build and the consumer projects the e2e script drives
      # link with mold too.
      - uses: ./.github/actions/link-with-mold
      - uses: ./.github/actions/install-skyzen-cli
      # The mock's dispatched builds link the buster glibc-2.28 sysroot
      # the way production builds do (stow#336) — same manifest hash key
      # as the build-crate job's cache; the extracted tree is large
      # enough to keep between runs.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: glibc-sysroot
        with:
          path: ~/.cache/stow
          key: glibc-sysroot-${{ hashFiles('ci/glibc-sysroot-debs.txt') }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.glibc-sysroot.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/stow
          key: ${{ steps.glibc-sysroot.outputs.cache-primary-key }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # The mock manifest runs on the Cloudflare provider, so `skyzen dev`
      # supervises `wrangler dev --local` (workerd).
      - run: bun install -g wrangler@4
      # Both binaries take the mock trust root: the build job now consumes
      # the cache through the same verified-download chain the CLI uses, and
      # a builder that cannot verify the mock key would quietly skip it.
      - run: cargo build --features stow-cli/mock-verify,stow-build/mock-verify -p stow-cli -p stow-build -p stow-mock-registry -p stow-admin
      - run: scripts/mock-e2e.sh
        env:
          STOW_E2E_WORK_DIR: ${{ runner.temp }}/stow-mock-e2e
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: mock-e2e-logs
          path: ${{ runner.temp }}/stow-mock-e2e/logs
          if-no-files-found: ignore

  # The merge gate for scheduler cost (stow#433): the host test is the
  # fast pre-check, but the numbers Cloudflare bills — the cursor's
  # `rowsRead`/`rowsWritten` — only exist under workerd. This job seeds
  # the production-shaped fixture through the Durable Object's probe
  # route and fails when any route or the alarm pass exceeds its
  # in-code budget.
  scheduler-budget:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Scheduler budget (workerd)
    runs-on: ubuntu-latest
    permissions:
      # Same operator auth as mock-e2e: the budget probe rides the
      # trusted admin endpoints, which authenticate the credential's own
      # repo permissions — GITHUB_TOKEN needs push (`contents: write`).
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      # The same stow-admin and edge bundle build as mock-e2e, so it
      # restores that job's cache instead of saving a second copy of it.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: mock-e2e
          save-if: false
      - uses: ./.github/actions/link-with-mold
      - uses: ./.github/actions/install-skyzen-cli
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install -g wrangler@4
      - run: cargo build -p stow-admin
      - run: scripts/scheduler-budget.sh
        env:
          STOW_BUDGET_WORK_DIR: ${{ runner.temp }}/stow-budget
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: scheduler-budget-logs
          path: |
            ${{ runner.temp }}/stow-budget/logs
            ${{ runner.temp }}/stow-budget/budget-report.json
          if-no-files-found: ignore

  # The resolver is cargo's own code carried into `stow-resolve`; this job
  # proves it: for every corpus entry and target it diffs the stow-resolve
  # output against `cargo build --unit-graph` (per-unit
  # platform/kind/features) and `cargo metadata --filter-platform`, run on
  # the same manifest by the pinned stable cargo (`RUSTC_BOOTSTRAP` lets it
  # take `-Z unstable-options` for the unit graph). Each job replays the
  # recorded fixture in `resolve/tests/resolve-diff-fixture` — the corpus
  # versions are frozen in the fixture, so a crates.io release cannot flip
  # CI — on the runner matching that family's host triple, because host
  # units must land on it. A scheduled live run keeps watching upstream in
  # `resolve-diff-live.yml`.
  resolve-diff:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Resolver differential test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: resolve-diff
          # Pull requests restore the `dev` cache and never save their own:
          # a per-PR copy of every job's cache duplicated the whole set
          # under the PR ref and evicted the build-crate caches (#177).
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - run: cargo run --release -p stow-resolve --features harness --bin resolve-diff -- --replay resolve/tests/resolve-diff-fixture --family linux

  # The same replay on the runner whose host triple is the macOS family's:
  # host units for darwin/ios targets resolve on aarch64-apple-darwin.
  resolve-diff-macos:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Resolver differential test (macOS family)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: resolve-diff-macos
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - run: cargo run --release -p stow-resolve --features harness --bin resolve-diff -- --replay resolve/tests/resolve-diff-fixture --family macos

  # And the Windows family host, x86_64-pc-windows-msvc.
  resolve-diff-windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Resolver differential test (Windows family)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: resolve-diff-windows
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - run: cargo run --release -p stow-resolve --features harness --bin resolve-diff -- --replay resolve/tests/resolve-diff-fixture --family windows

  # One check to require. Rulesets and the merge queue name this job instead
  # of every leg: it needs all of them, `if: always()` runs it past a failed
  # or cancelled need, and the verdict reads `needs.*.result` so such a leg
  # turns the gate red. `skipped` passes — a leg skipped by the paths
  # contract above reported success, which is what the ruleset sees too.
  gate:
    needs:
      - changes
      - test
      - lint
      - publish-dry-run
      - mock-e2e
      - scheduler-budget
      - resolve-diff
      - resolve-diff-macos
      - resolve-diff-windows
    if: always()
    name: CI gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The gate covers every job only because it needs every job; a new job
      # that forgets to join `needs:` would ship ungated. Read the workflow
      # itself and fail if any job other than this one is absent from the
      # list.
      - name: Needs covers every job
        run: |
          needed=$(yq '.jobs.gate.needs.[]' .github/workflows/test.yml | sort)
          declared=$(yq '.jobs | keys.[]' .github/workflows/test.yml | sort | grep -vx gate)
          if [ "$needed" != "$declared" ]; then
            diff <(echo "$declared") <(echo "$needed") || true
            echo "CI gate needs: must name every other job in test.yml" >&2
            exit 1
          fi
      - name: Every leg succeeded or skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e '[.[].result] | all(. == "success" or . == "skipped")' > /dev/null
