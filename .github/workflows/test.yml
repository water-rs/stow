name: Test

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_call:

# A branch pushed several times in a row only needs its newest run: the older
# ones test a tree nobody will merge. Pushes to main and dev keep theirs,
# because those runs are the record of what the branch did.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Documentation cannot change what a compiler or a test observes, so the
  # jobs below skip it. The condition lives on the jobs and never on the
  # workflow's triggers: a workflow skipped by `paths-ignore` leaves its
  # checks Pending forever and the dev ruleset requires seven of them, while
  # a job skipped by `if:` reports success and satisfies them.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          # `every` is required: with the default quantifier a negated rule
          # never excludes anything, because the rules are OR-ed and `**`
          # already matched. With `every`, a file counts as code only when it
          # matches every rule, so `code` is true exactly when some changed
          # file is not documentation.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!LICENSE*'
              - '!.gitignore'

  # This job carries the condition on its steps rather than on itself. The
  # `dev` ruleset requires `ubuntu-latest`, `macos-latest` and
  # `windows-latest`, and those contexts exist only once the matrix expands:
  # a matrix job skipped by a job-level `if:` reports one check named after
  # the unexpanded expression, so all three required contexts never report
  # and the pull request can never merge. Expanding and doing nothing costs
  # three runner boots and keeps the contexts honest.
  test:
    needs: changes
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        if: needs.changes.outputs.code == 'true'
        with:
          toolchain: stable
      # Linux artifacts link with mold, the linker the project recommends.
      - uses: ./.github/actions/link-with-mold
        if: needs.changes.outputs.code == 'true' && matrix.os == 'ubuntu-latest'
      - uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2.87.16
        if: needs.changes.outputs.code == 'true'
        with:
          tool: nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: needs.changes.outputs.code == 'true'
        with:
          shared-key: test-${{ matrix.os }}
          # Pull requests restore the `dev` cache and never save their own:
          # a per-PR copy of every job's cache duplicated the whole set
          # under the PR ref and evicted the build-crate caches (#177).
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - run: cargo nextest run --workspace --no-fail-fast
        if: needs.changes.outputs.code == 'true'
      - run: cargo test --doc --workspace
        if: needs.changes.outputs.code == 'true'

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      # Host build scripts compile for x86_64-unknown-linux-gnu, so they
      # link with mold too.
      - uses: ./.github/actions/link-with-mold
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: lint
          # Pull requests restore the `dev` cache and never save their own:
          # a per-PR copy of every job's cache duplicated the whole set
          # under the PR ref and evicted the build-crate caches (#177).
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p stow-edge --target wasm32-unknown-unknown -- -D warnings

  edge-wasm:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Edge wasm32 check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      # Host build scripts compile for x86_64-unknown-linux-gnu, so they
      # link with mold too.
      - uses: ./.github/actions/link-with-mold
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: edge-wasm
          # Pull requests restore the `dev` cache and never save their own:
          # a per-PR copy of every job's cache duplicated the whole set
          # under the PR ref and evicted the build-crate caches (#177).
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - run: cargo check -p stow-edge --target wasm32-unknown-unknown

  publish-dry-run:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Publish dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      # `cargo publish --dry-run` compiles for x86_64-unknown-linux-gnu, so
      # it links with mold too.
      - uses: ./.github/actions/link-with-mold
      # `cargo publish --dry-run` resolves in-workspace dependency versions
      # against crates.io, so it fails for stow-shim/stow-oci/stow-cli while
      # stow-types, stow-shim and stow-oci are unpublished. `cargo package`
      # checks manifest publishability (versioned path deps, license,
      # description) entirely locally, so it covers the whole published set;
      # the registry-facing `--dry-run` then covers stow-types, the
      # dependency-free root of the publish graph.
      - run: cargo package -p stow-types -p stow-shim -p stow-oci -p stow-cli --no-verify
      - run: cargo publish --dry-run -p stow-types

  mock-e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Mock end-to-end
    runs-on: ubuntu-latest
    permissions:
      # The local edge authenticates its write endpoints against the
      # credential's own repo permissions — GITHUB_TOKEN needs push
      # (`contents: write`) to pass. Fork pull requests still receive a
      # read-only token regardless of this block.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: mock-e2e
          # Pull requests restore the `dev` cache and never save their own:
          # a per-PR copy of every job's cache duplicated the whole set
          # under the PR ref and evicted the build-crate caches (#177).
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      # skyzen-cli ships cargo-dist binaries; install-action does not know
      # the tool and its cargo-binstall fallback compiles it from source
      # (about eight minutes), so the pinned, digest-checked archive is used.
      # The workspace build and the consumer projects the e2e script drives
      # link with mold too.
      - uses: ./.github/actions/link-with-mold
      - uses: ./.github/actions/install-skyzen-cli
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # The mock manifest runs on the Cloudflare provider, so `skyzen dev`
      # supervises `wrangler dev --local` (workerd).
      - run: bun install -g wrangler@4
      - run: cargo build -p stow-cli --features mock-verify -p stow-build -p stow-mock-registry -p stow-admin
      - run: scripts/mock-e2e.sh
        env:
          STOW_E2E_WORK_DIR: ${{ runner.temp }}/stow-mock-e2e
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: mock-e2e-logs
          path: ${{ runner.temp }}/stow-mock-e2e/logs
          if-no-files-found: ignore
