name: Test

# The checks every merge waits on: nextest on the three platforms, lint and
# the `CI gate` job the rulesets require. The slow lanes — `Mock end-to-end`
# and `Traffic cost` — live in
# release-gate.yml, which runs them on demand, nightly on dev and as the
# release gate for main. A push to dev runs nothing: the dev merge queue
# already tested the tree that lands. A nightly run on dev keeps the rust
# caches fresh — they are saved only from dev's ref, the one every pull
# request and merge group can restore from.
on:
  push:
    # deploy-edge.yml waits on this workflow's green run of a main push.
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    # 03:00 America/New_York; scheduled runs land on the default branch, dev.
    - cron: "0 7 * * *"

# A branch pushed several times in a row only needs its newest run: the older
# ones test a tree nobody will merge. Pushes to main keep theirs, because
# those runs are the record of what the branch did.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # No debuginfo in CI builds. A failing test reports its file and line
  # without it, and it was most of every cached target directory: a
  # workspace `cargo test --no-run` is 11 GB with it and 3.4 GB without,
  # and compiles in 128 s instead of 174 s. The per-job caches held the full
  # size, filled the repository's 10 GB cache allowance and evicted each
  # other.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # Documentation cannot change what a compiler or a test observes, so the
  # jobs below skip it. The condition lives on the jobs and never on the
  # workflow's triggers: a workflow skipped by `paths-ignore` leaves its
  # checks Pending forever, and the dev ruleset requires the gate below,
  # while a job skipped by `if:` reports success and the gate passes it.
  #
  # A pull request runs none of them. The merge queue runs this workflow on
  # the merge-group ref — the tree that actually lands — and the ruleset
  # requires only the gate, which passes over skipped legs, so a pull request
  # enters the queue at once instead of testing the same change a first time
  # on its own merge ref and then again in the queue.
  changes:
    if: github.event_name != 'pull_request'
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code == 'true' && steps.bump.outputs.only != 'true' }}
    steps:
      # The filter diffs against the previous tip (or the merge group's base)
      # with git, so it needs the repository checked out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          # `every` is required: with the default quantifier a negated rule
          # never excludes anything, because the rules are OR-ed and `**`
          # already matched. With `every`, a file counts as code only when it
          # matches every rule, so `code` is true exactly when some changed
          # file is not documentation.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!LICENSE*'
              - '!.gitignore'
      # A release-plz bump changes workspace versions and changelogs and
      # nothing else, so it cannot change what a compiler or a test observes
      # beyond the version string. The script reads the diff rather than the
      # branch name: code pushed onto a release branch runs every leg.
      - name: Version-only diff
        id: bump
        if: github.event_name != 'schedule'
        env:
          BASE: ${{ github.event.merge_group.base_sha || github.event.before }}
        run: |
          only=$(python3 -I scripts/version-only.py "$BASE" "$GITHUB_SHA")
          echo "only=$only" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs.code == 'true'
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      # Linux artifacts link with mold, the linker the project recommends.
      - uses: ./.github/actions/link-with-mold
        if: matrix.os == 'ubuntu-latest'
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test-${{ matrix.os }}
          # Pull requests restore the `dev` cache and never save their own:
          # a per-PR copy of every job's cache duplicated the whole set
          # under the PR ref and evicted the build-crate caches (#177).
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - run: cargo nextest run --workspace --no-fail-fast
      - run: cargo test --doc --workspace

  lint:
    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs.code == 'true'
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      # Host build scripts compile for x86_64-unknown-linux-gnu, so they
      # link with mold too.
      - uses: ./.github/actions/link-with-mold
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: lint
          # Pull requests restore the `dev` cache and never save their own:
          # a per-PR copy of every job's cache duplicated the whole set
          # under the PR ref and evicted the build-crate caches (#177).
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p stow-edge --target wasm32-unknown-unknown -- -D warnings

  # The scheduler idle proof (stow#593): the real workerd build under
  # @cloudflare/vitest-plugin, proving an empty scheduler deletes its
  # alarm instead of re-arming. It lives here rather than release-gate
  # because a regression must block a merge, not a release.
  edge-idle:
    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs.code == 'true'
    name: Edge idle suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/link-with-mold
      # The same wasm edge bundle the mock-e2e lane builds, so this job
      # restores that cache instead of saving a second copy of it.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: mock-e2e
          save-if: false
      - uses: ./.github/actions/install-skyzen-cli
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: skyzen build --provider cloudflare --manifest edge/Skyzen.mock.toml
      - run: bun install
        working-directory: edge/tests/idle
      - run: bun run test
        working-directory: edge/tests/idle

  # One check to require. Rulesets and the merge queue name this job instead
  # of every leg: it needs all of them, `if: always()` runs it past a failed
  # or cancelled need, and the verdict reads `needs.*.result` so such a leg
  # turns the gate red. `skipped` passes — a leg skipped by the paths
  # contract above reported success, which is what the ruleset sees too.
  gate:
    needs:
      - changes
      - test
      - lint
      - edge-idle
    if: always()
    name: CI gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The gate covers every job only because it needs every job; a new job
      # that forgets to join `needs:` would ship ungated. Read the workflow
      # itself and fail if any job other than this one is absent from the
      # list.
      - name: Needs covers every job
        run: |
          needed=$(yq '.jobs.gate.needs.[]' .github/workflows/test.yml | sort)
          declared=$(yq '.jobs | keys.[]' .github/workflows/test.yml | sort | grep -vx gate)
          if [ "$needed" != "$declared" ]; then
            diff <(echo "$declared") <(echo "$needed") || true
            echo "CI gate needs: must name every other job in test.yml" >&2
            exit 1
          fi
      - name: Every leg succeeded or skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e '[.[].result] | all(. == "success" or . == "skipped")' > /dev/null