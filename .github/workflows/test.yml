name: Test

# The checks every merge waits on: nextest on the three platforms, lint and
# the `CI gate` job the rulesets require. The slow lanes — `Mock end-to-end`
# and `Traffic cost` — live in
# release-gate.yml, which certifies a commit nightly or by name. A push to
# main runs nothing: the merge queue already tested the tree that lands. The
# nightly certification dispatches a run on main that keeps the rust caches
# fresh — they are saved only from main's ref, the one every pull request
# and merge group can restore from.
on:
  pull_request:
  merge_group:
  # The nightly run (03:00 America/New_York): release-gate.yml's trampoline
  # dispatches it on `main`, and it runs every leg regardless of the changed
  # paths.
  workflow_dispatch:

# A branch pushed several times in a row only needs its newest run: the older
# ones test a tree nobody will merge.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # No debuginfo in CI builds. A failing test reports its file and line
  # without it, and it was most of every cached target directory: a
  # workspace `cargo test --no-run` is 11 GB with it and 3.4 GB without,
  # and compiles in 128 s instead of 174 s. The per-job caches held the full
  # size, filled the repository's 10 GB cache allowance and evicted each
  # other. It is passed as `--config` rather than `CARGO_PROFILE_DEV_DEBUG`
  # so the cargo a test spawns keeps the default profile a consumer's build
  # has (stow#723).
  NO_DEBUGINFO: --config=profile.dev.debug=0

jobs:
  # Documentation cannot change what a compiler or a test observes, so the
  # jobs below skip it. The condition lives on the jobs and never on the
  # workflow's triggers: a workflow skipped by `paths-ignore` leaves its
  # checks Pending forever, and the main ruleset requires the gate below,
  # while a job skipped by `if:` reports success and the gate passes it.
  #
  # A pull request runs none of them. The merge queue runs this workflow on
  # the merge-group ref — the tree that actually lands — and the ruleset
  # requires only the gate, which passes over skipped legs, so a pull request
  # enters the queue at once instead of testing the same change a first time
  # on its own merge ref and then again in the queue.
  scope:
    if: github.event_name != 'pull_request'
    name: Affected scope
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.compute.outputs.packages }}
      package-args: ${{ steps.compute.outputs.package-args }}
      doc-package-args: ${{ steps.compute.outputs.doc-package-args }}
      workspace: ${{ steps.compute.outputs.workspace }}
      has-scope: ${{ steps.compute.outputs.has-scope }}
      wasm-edge: ${{ steps.compute.outputs.wasm-edge }}
      edge-idle: ${{ steps.compute.outputs.edge-idle }}
    steps:
      # The determinator and version-only diff both read git history against the
      # merge-group base, so the checkout needs full history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A release-plz bump changes workspace versions and changelogs and
      # nothing else, so it cannot change what a compiler or a test observes
      # beyond the version string. The script reads the diff rather than the
      # branch name: code pushed onto a release branch runs every leg.
      - name: Version-only diff
        id: bump
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          only=$(python3 -I scripts/version-only.py "$BASE" "$GITHUB_SHA")
          echo "only=$only" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        if: steps.bump.outputs.only != 'true'
        with:
          toolchain: stable
      - name: Select affected packages
        id: affected
        if: steps.bump.outputs.only != 'true'
        uses: lexoliu/affected-crates@1a475cb34d6a6f29fb98d65fd4f88471e8749d31 # v0.0.1
        with:
          version: v0.0.1
          base: ${{ github.event.merge_group.base_sha }}
          rules: .github/affected-rules.toml
          locked: "true"
      - name: Compute scope outputs
        id: compute
        env:
          REPORT_JSON: ${{ steps.affected.outputs.report }}
          BASE: ${{ github.event.merge_group.base_sha }}
          VERSION_ONLY: ${{ steps.bump.outputs.only || 'false' }}
        run: |
          report_file="$RUNNER_TEMP/affected-report.json"
          if [ "$VERSION_ONLY" = "true" ]; then
            : > "$report_file"
          else
            printf '%s\n' "$REPORT_JSON" > "$report_file"
          fi
          python3 .github/scripts/affected-scope.py \
            --report-file "$report_file" \
            --base "$BASE" \
            --head HEAD \
            --version-only "$VERSION_ONLY"

  test:
    needs: scope
    if: github.event_name == 'workflow_dispatch' || needs.scope.outputs.has-scope == 'true'
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          targets: ${{ matrix.os == 'windows-latest' && 'aarch64-pc-windows-msvc' || '' }}
      # Linux artifacts link with mold, the linker the project recommends.
      - uses: ./.github/actions/link-with-mold
        if: matrix.os == 'ubuntu-latest'
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test-${{ matrix.os }}
          # Pull requests restore the `main` cache and never save their own:
          # a per-PR copy of every job's cache duplicated the whole set
          # under the PR ref and evicted the build-crate caches (#177).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo nextest run ${{ env.NO_DEBUGINFO }} ${{ (github.event_name == 'workflow_dispatch' || needs.scope.outputs.workspace == 'true') && '--workspace' || needs.scope.outputs.package-args }} --no-fail-fast
      - if: github.event_name == 'workflow_dispatch' || needs.scope.outputs.workspace == 'true' || needs.scope.outputs.doc-package-args != ''
        run: cargo test ${{ env.NO_DEBUGINFO }} --doc ${{ (github.event_name == 'workflow_dispatch' || needs.scope.outputs.workspace == 'true') && '--workspace' || needs.scope.outputs.doc-package-args }}

  lint:
    needs: scope
    if: github.event_name == 'workflow_dispatch' || needs.scope.outputs.has-scope == 'true'
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: ${{ (github.event_name == 'workflow_dispatch' || needs.scope.outputs.wasm-edge == 'true') && 'wasm32-unknown-unknown' || '' }}
      # Host build scripts compile for x86_64-unknown-linux-gnu, so they
      # link with mold too.
      - uses: ./.github/actions/link-with-mold
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: lint
          # Pull requests restore the `main` cache and never save their own:
          # a per-PR copy of every job's cache duplicated the whole set
          # under the PR ref and evicted the build-crate caches (#177).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - name: Verify publishable crate manifests
        run: |
          for pkg in $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.publish == null or (.publish | length) > 0) | .name'); do
            cargo package --list --locked -p "$pkg" > /dev/null
          done
      - run: cargo clippy ${{ env.NO_DEBUGINFO }} ${{ (github.event_name == 'workflow_dispatch' || needs.scope.outputs.workspace == 'true') && '--workspace' || needs.scope.outputs.package-args }} --all-targets -- -D warnings
      - if: github.event_name == 'workflow_dispatch' || needs.scope.outputs.wasm-edge == 'true'
        run: cargo clippy ${{ env.NO_DEBUGINFO }} -p stow-edge --target wasm32-unknown-unknown -- -D warnings

  # The scheduler idle proof (stow#593): the real workerd build under
  # @cloudflare/vitest-plugin, proving an empty scheduler deletes its
  # alarm instead of re-arming. It lives here rather than release-gate
  # because a regression must block a merge, not a release.
  edge-idle:
    needs: scope
    if: github.event_name == 'workflow_dispatch' || needs.scope.outputs.edge-idle == 'true'
    name: Edge idle suite
    runs-on: ubuntu-latest
    # The profile release-gate builds the mock-e2e cache under, which
    # rust-cache folds into the key this job restores.
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/link-with-mold
      # The same wasm edge bundle the mock-e2e lane builds, so this job
      # restores that cache instead of saving a second copy of it.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: mock-e2e
          save-if: false
      - uses: ./.github/actions/install-skyzen-cli
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - run: skyzen build --provider cloudflare --manifest edge/Skyzen.mock.toml
      - run: bun install
        working-directory: edge/tests/idle
      - run: bun run test
        working-directory: edge/tests/idle

  # One check to require. Rulesets and the merge queue name this job instead
  # of every leg: it needs all of them, `if: always()` runs it past a failed
  # or cancelled need, and the verdict reads `needs.*.result` so such a leg
  # turns the gate red. `skipped` passes — a leg skipped by the paths
  # contract above reported success, which is what the ruleset sees too.
  gate:
    needs:
      - scope
      - test
      - lint
      - edge-idle
    if: always()
    name: CI gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The gate covers every job only because it needs every job; a new job
      # that forgets to join `needs:` would ship ungated. Read the workflow
      # itself and fail if any job other than this one is absent from the
      # list.
      - name: Needs covers every job
        run: |
          needed=$(yq '.jobs.gate.needs.[]' .github/workflows/test.yml | sort)
          declared=$(yq '.jobs | keys.[]' .github/workflows/test.yml | sort | grep -vx gate)
          if [ "$needed" != "$declared" ]; then
            diff <(echo "$declared") <(echo "$needed") || true
            echo "CI gate needs: must name every other job in test.yml" >&2
            exit 1
          fi
      - name: Every leg succeeded or skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e '[.[].result] | all(. == "success" or . == "skipped")' > /dev/null