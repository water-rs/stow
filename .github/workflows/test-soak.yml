name: Test soak

# Runs the Linux test leg of test.yml N times, each on a fresh runner, so a
# timing-sensitive test — the never-slower-than-cargo gate above all — is
# judged on many independent runs instead of the one a merge gets
# (stow#608). Manual only: nothing schedules it and no push or pull request
# triggers it, so it costs nothing until someone asks a question a single
# run cannot answer. The steps mirror test.yml's `test` job on
# ubuntu-latest; keep the two copies in step.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: How many independent runs of the Linux test leg
        required: true
        default: "20"
        type: number
      parallel:
        description: How many of them may hold a runner at once
        required: true
        default: "10"
        type: number

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      runs: ${{ steps.runs.outputs.runs }}
    steps:
      - id: runs
        env:
          RUNS: ${{ inputs.runs }}
        run: echo "runs=$(seq 1 "$RUNS" | jq -cs .)" >> "$GITHUB_OUTPUT"

  soak:
    needs: plan
    name: run ${{ matrix.run }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      # `max-parallel` takes a number and a dispatch input reaches an
      # expression as a string: unconverted, the matrix fails to start.
      max-parallel: ${{ fromJSON(inputs.parallel) }}
      matrix:
        run: ${{ fromJSON(needs.plan.outputs.runs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: ./.github/actions/link-with-mold
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: nextest
      # Restores the cache the test job saves on `dev` and never saves one
      # of its own: N legs writing N copies would evict the caches the
      # merge queue depends on.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test-ubuntu-latest
          save-if: false
      - run: cargo nextest run --workspace --no-fail-fast
