name: Release re-heat

# The cache identity pins the exact stable rustc version, so every stable
# release invalidates the whole pool. This lane polls the stable channel
# manifest; the first run that sees a new version re-heats the pool by
# dispatching the admin lane (base pool, binary overlay, the waterui
# project source, and the checked-in `preheat/projects.toml` showcase
# list) plus a `Preheat` org pass. An actions/cache entry keyed by the
# version is the "already re-heated" marker, so the poll is idempotent.
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # `gh workflow run` mints the dispatches below with the run's own
  # GITHUB_TOKEN.
  actions: write

concurrency:
  group: release-reheat

jobs:
  reheat:
    runs-on: ubuntu-latest
    steps:
      - name: Read the current stable rustc version
        id: channel
        run: |
          set -euo pipefail
          version="$(curl -fsS https://static.rust-lang.org/dist/channel-rust-stable.toml \
            | python3 -c 'import sys, tomllib; print(tomllib.load(sys.stdin.buffer)["pkg"]["rust"]["version"].split()[0])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check whether this release already re-heated
        id: marker
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .release-reheat-marker
          key: release-reheat-${{ steps.channel.outputs.version }}
      - name: Already re-heated
        if: steps.marker.outputs.cache-hit == 'true'
        run: echo "rustc ${{ steps.channel.outputs.version }} already re-heated"
      - name: Dispatch the re-heat wave
        if: steps.marker.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUSTC_VERSION: ${{ steps.channel.outputs.version }}
        run: |
          set -euo pipefail
          gh workflow run preheat-admin.yml \
            -f rustc_version="$RUSTC_VERSION" \
            -f project=waterui \
            -f projects_file=preheat/projects.toml \
            -f overlay=true
          gh workflow run preheat.yml
          echo "$RUSTC_VERSION" > .release-reheat-marker
      - name: Record the re-heat marker
        if: steps.marker.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .release-reheat-marker
          key: release-reheat-${{ steps.channel.outputs.version }}
