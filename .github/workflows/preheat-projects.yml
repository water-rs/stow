name: Regenerate the projects list

# `preheat/projects.toml` is a reviewed list — generated by a job, merged
# by a human. Weekly, this rebuilds it from GitHub's most-starred Rust
# repositories (the `Cargo.lock` admission filter and the full rejection
# report are `stow-admin preheat projects generate`'s) and opens the pull
# request a maintainer reviews. The wave itself never queries the list
# live: preheat-admin.yml reads the merged file.
#
# The pull request is created through GitHub's API rather than `git
# commit` + `gh pr`, because `dev`'s ruleset requires signed commits and
# a `github-actions[bot]` commit is unsigned: peter-evans/create-pull-request
# writes the commit through the GraphQL `createCommitOnBranch` mutation
# (`sign-commits: true`), which GitHub signs itself. It also refreshes a
# still-open regeneration PR in place and no-ops on an empty diff, which
# replaces the hand-written branch/force-push/`gh pr` shell entirely.
on:
  schedule:
    - cron: "30 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write      # push the regeneration branch
  pull-requests: write # open the pull request

concurrency:
  group: preheat-projects

env:
  CARGO_TERM_COLOR: always

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
      - name: Build stow-admin
        run: cargo build --release -p stow-admin
      # The search and git-trees calls authenticate with the run's own
      # GITHUB_TOKEN — no edge access exists on this path by design.
      - name: Regenerate preheat/projects.toml
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./target/release/stow-admin preheat projects generate \
            --output preheat/projects.toml | tee /tmp/projects-report.txt
      # The rejection report is the pull request's body; preparing it is
      # free even when nothing changed, so it runs unconditionally.
      - name: Prepare the pull-request body
        run: |
          {
            echo '### `stow-admin preheat projects generate`'
            echo
            echo '```'
            cat /tmp/projects-report.txt
            echo '```'
            echo
            echo "_Regenerated by preheat-projects.yml — review the diff before merging._"
          } > /tmp/pr-body.md
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "preheat: regenerate the projects list"
          title: "preheat: regenerate the projects list"
          body-path: /tmp/pr-body.md
          branch: preheat/projects-list
          sign-commits: true
