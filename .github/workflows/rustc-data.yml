name: Regenerate rustc data

# The worker resolves host units for every runner family, so it needs a
# `rustc -vV` of each family's host — a file that only a real rustc on that
# OS can produce — plus `rustc --print cfg` per CI target. Each matrix leg
# runs `scripts/gen-rustc-data.sh` on the current stable and uploads its
# host's `verbose` file and the `cfg` set; the merge job lays them into
# `resolve/rustc-data/`, regenerates the `rustc_data.rs` table, and opens
# the bump as a pull request when the channel moved. The edge reads this
# tree from `dev` through `STOW_RUSTC_DATA_BASE_URL`, so a stable release
# reaches the worker without a code change.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - run: scripts/gen-rustc-data.sh
        shell: bash
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustc-data-${{ matrix.os }}
          path: resolve/rustc-data/

  open-pr:
    name: Open refresh PR
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rustc-data-*
          merge-multiple: true
          path: resolve/rustc-data/
      # The scan over `resolve/rustc-data/` folds the three hosts' verbose
      # files into `rustc_data.rs` — the same generator the legs ran.
      - run: scripts/gen-rustc-data.sh
      - name: Read the stable release
        id: rustc
        run: |
          echo "version=$(rustc -vV | sed -n 's/^release: //p')" >> "$GITHUB_OUTPUT"
      # The App installation token makes both halves of the refresh land:
      # its API-created commit is signed, which `dev` requires, and the pull
      # request it opens runs its own checks — one opened with the default
      # GITHUB_TOKEN triggers no workflows.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.STOW_APP_ID }}
          private-key: ${{ secrets.STOW_APP_PRIVATE_KEY }}
      # Commits and opens (or updates) the PR only when the regenerated
      # tree differs from `dev`; an unchanged channel is a no-op.
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          base: dev
          branch: rustc-data/${{ steps.rustc.outputs.version }}
          add-paths: |
            resolve/rustc-data
            resolve/src/rustc_data.rs
          commit-message: "chore(resolve): vendor rustc ${{ steps.rustc.outputs.version }} data for all runner-family hosts"
          title: "chore(resolve): vendor rustc ${{ steps.rustc.outputs.version }} runner data"
          body: >-
            Scheduled regeneration of `resolve/rustc-data/` for stable
            ${{ steps.rustc.outputs.version }} across all three runner-family
            hosts, plus the regenerated `resolve/src/rustc_data.rs` table. The
            worker picks this up through `STOW_RUSTC_DATA_BASE_URL` once it
            lands on `dev`.
