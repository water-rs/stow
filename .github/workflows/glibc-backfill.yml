name: glibc backfill

on:
  push:
    branches: [ops/glibc-backfill]

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false
      - run: cargo build --release -p stow-admin
      - name: Preview
        env:
          STOW_EDGE_URL: ${{ vars.STOW_EDGE_URL }}
          GH_TOKEN: ${{ github.token }}
        run: ./target/release/stow-admin index backfill-min-glibc
      - name: Apply
        env:
          STOW_EDGE_URL: ${{ vars.STOW_EDGE_URL }}
          GH_TOKEN: ${{ github.token }}
        run: ./target/release/stow-admin index backfill-min-glibc --yes
