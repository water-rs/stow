name: build-batch
run-name: ${{ fromJSON(inputs.batch).rustc_version }}-b${{ fromJSON(inputs.batch).batch_id }}

# The one build entrypoint: the scheduler (or `stow-admin preheat
# manual`) dispatches this workflow on `main` with the whole batch as
# the single `batch` input — a JSON-encoded `BuildBatchPayload`. Each
# matrix leg calls `build-crate.yml`, which stays the signer: Fulcio's
# SAN for a reusable workflow is the *called* workflow's
# `job_workflow_ref`, so the caller changes nothing a client verifies
# (stow#833).
#
# The matrix fans the batch's `tasks` out over `parallelism` slots
# under `fail-fast: false` — one failed leg must not cancel the rest
# — and each leg's build → publish chain runs inside its own call,
# since `needs:` on a matrix job would wait for every leg.
#
# Completion reaches the scheduler through GitHub itself: `run-name`
# stamps `<rustc>-b<batch_id>`, so the `workflow_run` `completed`
# webhook the edge receives carries both in `display_title`
# (`stow_types::records::parse_batch_run_title`) — no completion POST
# from a runner, no failure-report job.
#
# The `leg <i>` job name is the jobs-page contract: GitHub names a
# reusable-workflow matrix job `<caller job name> / <called job name>`,
# so the jobs page reads `leg <i> / build #<i> <label> (<target>)
# <hash>` and `leg <i> / publish #<i> <hash>` — the shape
# `stow_types::runs::LegJobName` parses back into legs.

on:
  workflow_dispatch:
    inputs:
      batch:
        description: JSON-encoded BuildBatchPayload
        required: true
        type: string

permissions: {}

jobs:
  leg:
    name: leg ${{ matrix.task.i }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.batch).parallelism }}
      matrix:
        task: ${{ fromJSON(inputs.batch).tasks }}
    # The union of what the called jobs need; each called job narrows it.
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/build-crate.yml
    with:
      leg: ${{ matrix.task.i }}
      task_hash: ${{ matrix.task.h }}
      target: ${{ matrix.task.target }}
      rustc_version: ${{ fromJSON(inputs.batch).rustc_version }}
      label: ${{ matrix.task.crate_name }} ${{ matrix.task.version }}
