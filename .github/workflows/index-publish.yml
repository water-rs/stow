name: Index publish

# Publishes the signed artifact index the CLI resolves against
# (water-rs/stow#188, #455): each slice is folded from the registry's
# signed records artifacts — `stow-admin index export --out-dir
# --rustc-version` pulls and verifies the previous `index`/`folded` pair
# per slice of that rustc, then only the `records-<rustc>-*` artifacts
# the union of folded sets does not already cover, no edge round-trip —
# pushed to GHCR as single-layer OCI
# artifacts (`index.<target>.<rustc>` plus the `folded.<target>.<rustc>`
# companion listing every records tag already folded, both on
# ghcr.io/water-rs/stow-cache) and cosign-signed keyless under this
# workflow's identity on `main`
# (`stow_types::trusted_builder::INDEX_CERTIFICATE_IDENTITY`).
#
# The D1 catalog is a mirror of those records, not the source: the
# `index sync` step replays the delta the export just folded —
# `new-records.json`, not a re-pull — into the edge's
# `/api/v1/admin/artifacts/sync` route. It is gated on the
# `stow_edge_url` dispatch input — an edge URL given by configuration,
# never probed at runtime — so a dispatch while Cloudflare is offline
# simply publishes the index and skips the sync.
#
# A `schedule` or `workflow_run` trigger would run on the default branch
# (`dev`) and sign under an identity the CLI rejects, so this workflow is
# dispatch-only: `index-publish-cron.yml` dispatches it on `main` after
# every completed `build-crate` run (and on a schedule as backstop), and
# the first step refuses any other ref.
#
# The index header stamps `generated_at`, so every export's blob bytes —
# and therefore its layer digest — differ even when the slice did not
# change. The skip check instead compares `content_sha256`, the digest
# `stow-admin index export` computes over everything but the timestamp,
# carried on the pushed manifest as the `dev.stow.index.content-sha256`
# annotation: a run that finds the annotation equal to the fresh export's
# leaves tag and signature untouched.

on:
  workflow_dispatch:
    inputs:
      stow_edge_url:
        description: "Edge base URL the D1 catalog sync posts to; the sync step runs only when set"
        required: false
        default: ""
        type: string
      rustc_version:
        description: "Rustc the export pass scopes to; defaults to the current stable channel"
        required: false
        default: ""
        type: string
      full:
        description: "Rebuild the scoped rustc's slices from every records artifact, ignoring the published index/folded pairs — the recovery for a slice in an unreadable format"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  # Pushes the index artifacts and their cosign signature images.
  packages: write
  # Mints the run's OIDC token — the edge bearer the admin index endpoint
  # accepts — and the Fulcio identity cosign signs under.
  id-token: write

concurrency:
  group: index-publish
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Refuse to sign under any identity but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::index-publish signs under refs/heads/main only; dispatched on ${{ github.ref }}"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build stow-admin
        run: cargo build --release -p stow-admin
      # cosign is still what signs — `stow-admin index publish` shells out
      # to it exactly as `stow-build publish` does.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # The export pass is scoped to one rustc: only `records-<rustc>-*`
      # artifacts and `index.<t>.<rustc>`/`folded.<t>.<rustc>` pairs are
      # touched. `index-publish-cron` forwards the rustc the completed
      # run's title names; an unset input takes the stable channel, the
      # same resolution preheat-cron.yml does.
      - name: Resolve the rustc the export scopes to
        env:
          INPUT_RUSTC: ${{ inputs.rustc_version }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_RUSTC" ]; then
            rustc_version="$INPUT_RUSTC"
          else
            rustc_version="$(curl -fsS https://static.rust-lang.org/dist/channel-rust-stable.toml \
              | python3 -c 'import sys, tomllib; print(tomllib.load(sys.stdin.buffer)["pkg"]["rust"]["version"].split()[0])')"
          fi
          echo "RUSTC_VERSION=$rustc_version" >> "$GITHUB_ENV"
      # One export pass for every slice of this rustc: `index export
      # --out-dir --rustc-version` lists the registry once, pulls the
      # published `index`/`folded` pairs for R's slices, and verifies
      # only the records tags no folded set covers — the pass is
      # O(new work), not O(store). It writes `index.<t>.<r>` +
      # `folded.<t>.<r>` per changed slice, `slices.json` describing them,
      # and `new-records.json` for `index sync`. The publish loop then
      # pushes each pair (`index publish` signs both under this
      # workflow's identity) and `index report` tells the edge what the
      # live slice serves — the scheduler's dependency gate learns
      # servability from the publish path itself, not from task
      # completions.
      - name: Export every index slice in one pass
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_FULL: ${{ inputs.full }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/index-export"
          mkdir -p "$out"
          args=(--out-dir "$out" --rustc-version "$RUSTC_VERSION")
          # A full pass stays scoped the way the export is: the resolved
          # rustc's slices and records, no other rustc's tags.
          if [[ "$INPUT_FULL" == "true" ]]; then
            args+=(--full)
          fi
          ./target/release/stow-admin index export "${args[@]}"
          cp "$out/slices.json" "$RUNNER_TEMP/slices.json"
          cp "$out/new-records.json" "$RUNNER_TEMP/new-records.json"
          echo "export_dir=$out" >> "$GITHUB_ENV"
      - name: Publish and sign each changed slice
        env:
          # The dispatch input, not a runtime probe: when the edge URL is
          # configured the loop reports each slice to the edge's
          # scheduler gate; when it is absent (Cloudflare offline) the
          # report simply does not run.
          STOW_EDGE_URL: ${{ inputs.stow_edge_url }}
          # stow-admin mints a fresh Actions OIDC JWT for every edge
          # request under this audience; the RepoWriter policy admits any
          # workflow inside water-rs/stow.
          STOW_OIDC_AUDIENCE: ${{ vars.STOW_OIDC_AUDIENCE }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A slice whose publish fails must not cost every later slice its
        # update: slices are independent, and a stale slice is what every
        # CLI on that target resolves against until the next run.
        # Failures are collected and reported at the end.
        run: |
          python3 - "$export_dir" <<'EOF'
          import json, os, subprocess, sys
          out = sys.argv[1]
          slices = json.load(open(os.path.join(out, "slices.json")))
          failed = []
          for s in slices:
              print(f"::group::{s['tag']}", flush=True)
              file = os.path.join(out, s["index_file"])
              folded = os.path.join(out, s["folded_file"])
              steps = [["./target/release/stow-admin", "index", "publish",
                        "--file", file, "--folded", folded]]
              if os.environ.get("STOW_EDGE_URL"):
                  steps.append(["./target/release/stow-admin", "index", "report", "--file", file])
              ok = all(subprocess.run(step).returncode == 0 for step in steps)
              print("::endgroup::", flush=True)
              if not ok:
                  print(f"::error::index publish failed for {s['tag']}", flush=True)
                  failed.append(s["tag"])
          if failed:
              print(f"::error::index publish incomplete: {' '.join(failed)}", flush=True)
              sys.exit(1)
          EOF
      # D1's `artifacts` table is a read model of the same GHCR records —
      # populated only here, and only the delta this pass folded —
      # `new-records.json` — never written by CI itself.
      - name: Sync the new records into the edge catalog
        if: inputs.stow_edge_url != ''
        env:
          STOW_EDGE_URL: ${{ inputs.stow_edge_url }}
          STOW_OIDC_AUDIENCE: ${{ vars.STOW_OIDC_AUDIENCE }}
        run: ./target/release/stow-admin index sync --file "$export_dir/new-records.json"
