name: Preheat the public cache

# The pool nobody asks for. stow's coverage promise is that a first-time
# `stow check` on a popular crate or a popular binary already hits, so
# the top of crates.io is preheated unattended rather than waiting for a
# user's miss to teach the scheduler what to build.
#
# Two things make a wave necessary: a new stable rustc invalidates the
# whole pool (the cache identity pins the exact version), and the top-N
# lists move as crates publish. The release half is the newreleases.io
# webhook — its delivery reaches the edge, and the scheduler dispatches
# `preheat-admin.yml` for it (stow#880). This lane is the other half: a
# once-per-UTC-day refresh for the moving lists. The marker is a
# successful run of this workflow created on the UTC day, which makes a
# same-day re-run a no-op unless dispatched with `refresh` (a scheduler
# reset's refill, stow#1094). The runs list is read, not an actions/cache
# entry: every release tag runs this workflow, and a cache saved on one
# tag is not readable from another tag's runs. The edge Worker's Cron
# Trigger dispatches this workflow once a day at 00:17 UTC, off the top of the hour (stow#1100;
# GitHub's own `schedule` skipped ticks); the newreleases.io wake covers
# a new stable rustc in between, and a manual dispatch the same day is
# that no-op.
#
# Re-submitting the whole list is cheap on purpose: the scheduler
# deduplicates on task identity, leaves completed tasks completed, and
# retires pending tasks the artifact catalog already covers, so a wave
# only builds what is genuinely missing or previously failed.
on:
  workflow_dispatch:
    inputs:
      refresh:
        description: >-
          Submit the wave although this version already preheated today
          (a scheduler reset, which emptied the queue, dispatches it so).
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  # Dispatch with the run's own GITHUB_TOKEN.
  actions: write

concurrency:
  group: preheat-cron

jobs:
  preheat:
    runs-on: ubuntu-latest
    steps:
      - name: Read the current stable rustc version
        id: channel
        run: |
          set -euo pipefail
          version="$(curl -fsS https://static.rust-lang.org/dist/channel-rust-stable.toml \
            | python3 -c 'import sys, tomllib; print(tomllib.load(sys.stdin.buffer)["pkg"]["rust"]["version"].split()[0])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Check whether a preheat already succeeded today
        id: marker
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          DAY: ${{ steps.channel.outputs.day }}
        run: |
          set -euo pipefail
          # Runs of this workflow across every ref: each release tag runs
          # it, and a cache entry saved on one tag is not readable from
          # another tag's runs, so the runs list is the marker. The
          # current run is in progress and never counts.
          count="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/preheat-cron.yml/runs" \
            -f status=success -f "created=>=$DAY" -f per_page=1 | jq -r '.total_count')"
          if [ "$count" -gt 0 ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Already preheated
        if: steps.marker.outputs.done == 'true' && !inputs.refresh
        run: |
          echo "a preheat already succeeded on ${{ steps.channel.outputs.day }}"
      - name: Dispatch the preheat wave
        if: steps.marker.outputs.done != 'true' || inputs.refresh
        env:
          # `gh` resolves the repository from the checkout's git remote,
          # and this job has no checkout — without GH_REPO every dispatch
          # dies on "not a git repository".
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RUSTC_VERSION: ${{ steps.channel.outputs.version }}
        run: |
          set -euo pipefail
          # The wave talks to the edge deployed from this release tag, so
          # its stow-admin is built from the same tag (#973).
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/preheat-admin.yml/dispatches" \
            -f ref="$GITHUB_REF_NAME" -f "inputs[rustc_version]=$RUSTC_VERSION" \
            -f 'inputs[projects]=true'
