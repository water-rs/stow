name: Measure project resolution

on:
  pull_request:
    paths:
      - .github/workflows/measure-resolve.yml
  workflow_dispatch:
    inputs:
      concurrency:
        description: Concurrent project resolvers
        type: number
        default: 16
      tools-run:
        description: Release gate run containing gate-tools-production
        type: string
        default: "41689819560"

permissions:
  contents: read
  actions: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gate-tools-production
          run-id: ${{ inputs.tools-run || '41689819560' }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/tools-archive
      - name: Prepare measured tools
        run: |
          mkdir -p "$RUNNER_TEMP/tools" "$RUNNER_TEMP/measurement" "$RUNNER_TEMP/registry"
          tar -xzf "$RUNNER_TEMP/tools-archive/gate-tools.tar.gz" -C "$RUNNER_TEMP/tools"
          rustup toolchain install 1.99.1 --profile minimal
      - name: Resolve every project and target against an empty local index
        env:
          STOW_RESOLVE_CONCURRENCY: ${{ inputs.concurrency || 16 }}
          STOW_RESOLVE_CARGO_HOME: ${{ runner.temp }}/resolve-cargo
          STOW_REGISTRY_BASE_URL: http://127.0.0.1:28123
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          timeout --kill-after=5 2160 "$RUNNER_TEMP/tools/stow-mock-registry" serve \
            --registry-root "$RUNNER_TEMP/registry" --listen 127.0.0.1:28123 \
            >"$RUNNER_TEMP/measurement/registry.log" 2>&1 &
          registry_pid=$!
          trap 'kill "$registry_pid" 2>/dev/null || true; wait "$registry_pid" 2>/dev/null || true' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 --max-time 2 --fail \
            http://127.0.0.1:28123/v2/
          /usr/bin/time -v -o "$RUNNER_TEMP/measurement/time.txt" \
            timeout --kill-after=30 2100 "$RUNNER_TEMP/tools/stow-admin" --json \
            preheat projects submit --file preheat/projects.toml --rustc-version 1.99.1 \
            >"$RUNNER_TEMP/measurement/plan.json" 2>"$RUNNER_TEMP/measurement/resolve.log"
          jq '.plan | {resolved: (.per_repo | length), skipped: (.skipped | length), submit_failed, tasks: ([.per_repo[].tasks] | add)}' \
            "$RUNNER_TEMP/measurement/plan.json" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/measurement/time.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: project-resolution
          path: ${{ runner.temp }}/measurement
