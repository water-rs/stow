# The locked Ubuntu debs a gnu Linux leg provisions from
# (stow#850, stow#862): restore the actions/cache entry, fetch +
# sha256-verify + install on a miss, save it back. The cache key and
# the ~/stow-system-debs path live only here so build-crate.yml's
# legs and the system-libs-warmup push job share one entry and can
# never drift.
name: Locked system debs
description: Restore (or fetch, verify, install and save) the target's locked system debs
inputs:
  target:
    description: Rust target triple the lock names sets for
    required: true
runs:
  using: composite
  steps:
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: cache
      with:
        path: ~/stow-system-debs
        key: system-debs-${{ inputs.target }}-${{ hashFiles('ci/system-libs/lock.txt') }}
    - shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: ci/system-libs/install.sh "$TARGET" "$HOME/stow-system-debs" "$HOME/stow-system-libs"
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: steps.cache.outputs.cache-hit != 'true'
      with:
        path: ~/stow-system-debs
        key: ${{ steps.cache.outputs.cache-primary-key }}
