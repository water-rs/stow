name: Install skyzen-cli
description: >-
  Install skyzen-cli from the pinned zen-rs/skyzen commit. The Worker shim
  `skyzen build` generates must come from the same skyzen commit the edge
  compiles against (the one in Cargo.lock): the unreleased Durable Object
  residency (stow#1574) needs a shim that passes a residency controller.
  The commit SHA is itself the pin.
inputs:
  rev:
    description: >-
      Full commit SHA in zen-rs/skyzen to install from source
      (`cargo install --git --rev`).
    required: false
    # Must equal the skyzen commit in Cargo.lock.
    default: 1787296d7f618b3b6f44c0589739cc0dd99d03ed
runs:
  using: composite
  steps:
    # A commit pin is itself the integrity check — `--rev` resolves to that
    # exact tree, so no second digest is needed. skyzen's Cargo.lock is
    # gitignored upstream, so `--locked` cannot apply.
    - shell: bash
      env:
        SKYZEN_REV: ${{ inputs.rev }}
      run: |
        set -euo pipefail
        cargo install --git https://github.com/zen-rs/skyzen --rev "$SKYZEN_REV" skyzen-cli
        skyzen --version
