name: Install skyzen-cli
description: >-
  Install the pinned skyzen-cli release binary for x86_64 Linux runners and
  verify it against a digest recorded here, so a compromised upstream
  release cannot run code in a job that holds deploy credentials.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        SKYZEN_CLI_VERSION: 0.4.2
        # sha256 of skyzen-cli-x86_64-unknown-linux-gnu.tar.xz from the
        # skyzen-cli-v0.4.2 release, recorded when the version was bumped.
        SKYZEN_CLI_SHA256: 024dee0fc635b4081a23810ce6754feca820eaab9d46becd6480cb6d6dba35e5
      run: |
        set -euo pipefail
        if [ "$(uname -sm)" != "Linux x86_64" ]; then
          echo "::error::install-skyzen-cli pins the x86_64 Linux archive; runner is $(uname -sm)" >&2
          exit 1
        fi
        archive="skyzen-cli-x86_64-unknown-linux-gnu.tar.xz"
        workdir="$(mktemp -d)"
        curl --proto '=https' --tlsv1.2 -LsSf -o "$workdir/$archive" \
          "https://github.com/zen-rs/skyzen/releases/download/skyzen-cli-v${SKYZEN_CLI_VERSION}/${archive}"
        echo "${SKYZEN_CLI_SHA256}  ${workdir}/${archive}" | sha256sum -c -
        tar -xJf "$workdir/$archive" -C "$workdir"
        install -m 0755 "$workdir/${archive%.tar.xz}/skyzen" "$HOME/.cargo/bin/skyzen"
        rm -rf "$workdir"
        skyzen --version
